/* ----- chapter ----- */
function figuresFor(chap, sec) { return arr(chap.figures).filter((f) => f.section === sec); }
function svgSrc(svg) {
  let s = svg;
  if (!/xmlns=/.test(s)) s = s.replace(/^<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
}

function viewChapter(c, n) {
  const ch = c.chapters[n - 1];
  if (!ch) return `<div class="empty">No such chapter.</div>`;
  const key = `${c.id}:${n}`;
  const chap = S.chapters[key];
  const p = S.prog[c.id];
  if (chap === undefined || !p || !S.errata[c.id]) {
    Promise.all([
      chap === undefined ? Store.get(chapterPath(c.id, n)).then((d) => { S.chapters[key] = d; }) : null,
      loadProg(c.id),
      S.errata[c.id] ? null : Store.list(`courses/${c.id}/errata`).then((l) => { S.errata[c.id] = l; }),
    ]).then(() => { if (S.view === "chapter" && S.courseId === c.id && S.chapterN === n) render(); });
    return `<p class="muted">Opening chapter ${n}…</p>`;
  }
  if (!S.profile.last || S.profile.last.courseId !== c.id || S.profile.last.n !== n) { S.profile.last = { courseId: c.id, n, at: Date.now() }; saveProfile(); }
  const L0 = chap && chap.lesson;
  const reviewed = !!(chap && chap.review && chap.review.full);
  const facts = L0
    ? `<span>${esc(persona(c.persona).id === "professor" ? "Dr. Professor" : persona(c.persona).name)}</span><span>${L0.sections.length} sections</span><span>≈ ${Math.max(5, Math.round(words(L0) / 200))} min reading</span><span>${arr(chap.figures).length} figures</span><span>${L0.sections.reduce((k, s) => k + s.practice.length, 0)} practice problems</span>${reviewed ? `<span>✓ Fact-checked</span>` : ""}`
    : `<span>${ch.sections.length} sections</span><span>Not yet written</span>`;
  const head = `<header class="opener">
      <div class="eyebrow">${esc(c.title.split(/:\s+/)[0])} · Chapter ${n} of ${c.chapters.length}</div>
      <h1 class="h1">${esc(ch.title)}</h1>
      <div class="sub">${facts}</div>
    </header>`;
  if (!L0) {
    return `<div class="stack col" style="max-width:900px">${head}
      <p class="lede">${esc(ch.summary)}</p>
      <div class="tbl-wrap"><table><tbody>${ch.sections.map((s, j) => `<tr><td class="num" style="color:var(--subj-ink)">${n}.${j + 1}</td><td><strong>${esc(s.title)}</strong><div class="muted">${esc(s.summary)}</div></td></tr>`).join("")}</tbody></table></div>
      <div class="sheet stack-sm" id="gen-box">${genBox(c, n, chap)}</div>
      ${pager(c, n)}</div>`;
  }
  const L = chap.lesson, A = chap.assess;
  let figNo = 0;
  const figHTML = (f) => { figNo++; return `<figure class="fig"><div class="plate"><img class="fig-img" alt="${esc(f.caption)}" src="${svgSrc(f.svg)}"></div><figcaption><b>Figure ${n}.${figNo}</b> ${fmt(f.caption)}</figcaption></figure>`; };
  const sectionIds = new Set(L.sections.map((s) => s.n));
  const IX = S.ix[key] = normInteractives(chap.interactives);
  S.wx = S.wxAll[key] = S.wxAll[key] || {}; // widget state lives per chapter, so ids like wx-1-0 never collide across books
  const wxFor = (sec) => IX.map((it, k) => ((sec ? it.section === sec : !sectionIds.has(it.section)) ? wxHTML(`wx-${n}-${k}`, it) : "")).join("");
  const loose = arr(chap.figures).filter((f) => !sectionIds.has(f.section));
  const rail = `<nav class="rail" aria-label="Chapter contents"><div class="eyebrow">Contents</div><ol>
      <li><a href="#top">Overview</a></li>
      ${chap.review ? `<li><a href="#factcheck">Fact-check report</a></li>` : ""}
      <li><a href="#listen">Audio edition</a></li>
      ${A ? `<li><a href="#lecture">Lecture</a></li>` : ""}
      ${L.sections.map((s) => `<li><a href="#s-${esc(s.n)}" class="${p.read[s.n] ? "done" : ""}">${esc(s.n)} ${esc(s.title)}</a></li>`).join("")}
      ${A ? `<li><a href="#quiz">Chapter quiz</a></li><li><a href="#challenge">Challenge exercises</a></li><li><a href="#readings">Homework reading</a></li><li><a href="#media">Watch and look</a></li>` : ""}
      <li><a href="#office">Office hours</a></li></ol></nav>`;
  const missing = !A || !chap.figures || !reviewed;
  return `<div class="ch-grid">${rail}<div class="ch-main">
    <section class="unit" id="top">${head}
      ${L.hook ? `<p class="hook">${fmt(L.hook)}</p>` : ""}
      <div class="prose">${paras(L.overview)}</div>
      ${L.objectives.length ? `<div class="cbox k-subj"><div class="cbox-h"><span>After this chapter you can</span></div><div class="cbox-b"><ul class="plain">${L.objectives.map((o) => `<li>${fmt(o)}</li>`).join("")}</ul></div></div>` : ""}
      ${chap.review ? reviewBox(chap.review) : ""}
      ${provLine(c, chap)}
      ${loose.map(figHTML).join("")}
      ${wxFor(null)}
      ${missing ? `<div class="sheet stack-sm" id="gen-box">${genBox(c, n, chap)}</div>` : ""}
    </section>
    <section class="unit" id="listen"><div class="sec-head"><h2 class="h2">Audio edition</h2><span class="eyebrow">Listen</span></div><div id="player">${playerHTML(c, n, chap)}</div></section>
    ${A && A.slides.length ? `<section class="unit" id="lecture"><div class="sec-head"><h2 class="h2">Lecture</h2><span class="eyebrow">${A.slides.length} slides</span></div><div id="deck">${deck(c, n, A)}</div></section>` : ""}
    ${L.sections.map((s) => `<section class="unit" id="s-${esc(s.n)}">
      <div class="sec-head"><h2 class="h2"><span class="num" style="color:var(--subj-ink)">${esc(s.n)}</span> ${esc(s.title)}</h2></div>
      ${pretestBlock(c, s)}
      <div class="prose">${s.reading.map((r) => `<p>${cite(fmt(r), s.n)}</p>`).join("")}</div>
      ${figuresFor(chap, s.n).map(figHTML).join("")}
      ${refsBlock(s)}
      ${altBlock(c, n, s)}
      ${wxFor(s.n)}
      ${s.misconception && s.misconception.myth ? `<div class="cbox k-myth"><div class="cbox-h"><span>Common misconception</span></div><div class="cbox-b"><div class="myth"><b>Myth</b><span>${fmt(s.misconception.myth)}</span><b class="fact">Fact</b><span>${fmt(s.misconception.fact)}</span></div></div></div>` : ""}
      ${arr(s.templates).length ? `<div class="cbox k-kit"><div class="cbox-h"><span>Prompt kit</span><span>${arr(s.templates).length} to copy</span></div><div class="cbox-b stack-sm">${arr(s.templates).map((t, k) => `<div class="kit"><div class="row"><b>${esc(t.title)}</b><button type="button" class="btn ghost sm" data-act="copy-kit" data-sec="${esc(s.n)}" data-k="${k}">Copy</button></div><pre class="kit-text">${esc(t.text)}</pre>${t.note ? `<p class="small muted">${fmt(t.note)}</p>` : ""}</div>`).join("")}</div></div>` : ""}
      ${s.keyTerms.length ? `<div class="cbox k-terms"><div class="cbox-h"><span>Key terms</span><span>${s.keyTerms.length}</span></div><div class="cbox-b"><dl class="terms">${s.keyTerms.map((t) => `<dt>${esc(t.term)}</dt><dd>${fmt(t.def)}</dd>`).join("")}</dl></div></div>` : ""}
      ${s.example.steps.length ? `<div class="cbox k-example"><div class="cbox-h"><span>Worked example</span></div><div class="cbox-b"><div class="h3">${fmt(s.example.title.replace(/^Worked example:\s*/i, ""))}</div><ol class="steps">${s.example.steps.map((x) => `<li>${fmt(x)}</li>`).join("")}</ol>${s.example.takeaway ? `<p class="small"><strong>Takeaway.</strong> ${fmt(s.example.takeaway)}</p>` : ""}</div></div>` : ""}
      ${s.practice.length ? `<div class="cbox k-practice"><div class="cbox-h"><span>Practice ${esc(s.n)}</span><span>${s.practice.length} problems</span></div><div class="cbox-b">${s.practice.map((pr, i) => `<div class="prob" id="pp-${esc(s.n)}-${i}">${practice(c, s.n, i, pr)}</div>`).join("")}</div></div>` : ""}
      ${feynBlock(c, n, s)}
      <div class="field notes"><label for="note-${esc(s.n)}">Your notes · ${esc(s.n)}</label><textarea class="input" id="note-${esc(s.n)}" data-inp="note" data-sec="${esc(s.n)}" placeholder="Summarize the section in your own words, or write questions to bring to office hours.">${esc(p.notes[s.n] || "")}</textarea></div>
      <label class="check"><input type="checkbox" id="read-${esc(s.n)}" data-inp="read" data-sec="${esc(s.n)}" ${p.read[s.n] ? "checked" : ""}> I have read section ${esc(s.n)} and done its practice</label>
      ${errataBlock(c, n, s.n)}
    </section>`).join("")}
    ${A ? `<section class="unit" id="quiz"><div class="sec-head"><h2 class="h2">Chapter quiz</h2><span class="eyebrow">${A.quiz.length} questions · ${pct(PASS_QUIZ)} to pass</span></div><div id="quiz-body">${quizBody(c, n, A.quiz, "quiz")}</div></section>
    <section class="unit" id="challenge"><div class="sec-head"><h2 class="h2">Challenge exercises</h2><span class="eyebrow">Graded by Dr. Professor</span></div>
      ${A.challenge.map((x, i) => `<div class="box" style="border-top:3px solid var(--subj)" id="cx-${i}">${challenge(c, n, i, x)}</div>`).join("")}</section>
    <section class="unit" id="readings"><div class="sec-head"><h2 class="h2">Homework reading</h2></div>
      <p class="small muted">Citations are written by Dr. Professor and checked by the fact-check pass from memory, not against a library. Use the search links to find and confirm each one before you rely on it.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Source</th><th>Read it for</th><th></th></tr></thead><tbody>${A.readings.map((r) => `<tr><td>${esc(r.citation)}${r.pages ? `<div class="muted">${esc(r.pages)}</div>` : ""}<div class="row" style="gap:6px;margin-top:4px"><span class="pill">${esc(r.kind || "source")}</span>${r.checked ? `<span class="pill ok">Checked</span>` : r.unverified ? `<span class="pill warn">Unverified</span>` : ""}</div></td><td>${fmt(r.why)}</td><td style="white-space:nowrap"><a href="${readingLink(r)}" target="_blank" rel="noopener">Find it ↗</a></td></tr>`).join("")}</tbody></table></div></section>
    <section class="unit" id="media"><div class="sec-head"><h2 class="h2">Watch and look</h2></div>
      <p class="small muted">Dr. Professor does not invent video or image addresses. These links run a search; pick a result from a university, museum, agency or recognized educator.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Search</th><th>What to look for</th></tr></thead><tbody>
        ${A.videos.map((v) => `<tr><td>Video</td><td><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.search)}" target="_blank" rel="noopener">${esc(v.search)} ↗</a></td><td>${fmt(v.why)}</td></tr>`).join("")}
        ${A.images.map((v) => `<tr><td>Images${v.source === "nasa" ? " · NASA" : " · Wikimedia"}</td><td><a href="${v.source === "nasa" ? "https://images.nasa.gov/search?q=" : "https://commons.wikimedia.org/w/index.php?search="}${encodeURIComponent(v.search)}" target="_blank" rel="noopener">${esc(v.search)} ↗</a></td><td>${fmt(v.why)}</td></tr>`).join("")}
      </tbody></table></div></section>` : ""}
    <section class="unit" id="office"><div class="sec-head"><h2 class="h2">Office hours</h2><span class="eyebrow">Ask about this chapter</span></div>
      <div id="chat">${chatBody(key)}</div></section>
    ${pager(c, n)}
  </div></div>`;
}
function reviewBox(r) {
  const corr = arr(r.corrections), applied = corr.filter((x) => x.applied), fixes = arr(r.keyFixes), removed = arr(r.readingsRemoved);
  const plural = (k, w) => `${k} ${w}${k === 1 ? "" : "s"}`;
  return `<div class="cbox k-check" id="factcheck"><div class="cbox-h"><span>Fact-check report</span><span>${esc(date(r.at))}</span></div><div class="cbox-b">
    <p class="small">${esc(r.by || "Checked after writing by a second, more careful Claude pass.")}
      ${r.keysChecked ? ` Answer keys re-solved blind: <strong class="num">${r.keysAgreed}/${r.keysChecked}</strong> agreed${fixes.length ? `, ${plural(fixes.length, "key")} corrected` : ""}.` : ""}
      ${r.srcChecked ? ` Sources checked: <strong class="num">${r.srcChecked - (r.srcWithdrawn || 0)}/${r.srcChecked}</strong> confirmed${r.srcWithdrawn ? `, ${r.srcWithdrawn} withdrawn` : ""}.` : ""}
      ${applied.length ? ` ${plural(applied.length, "correction")} applied to the text.` : " No text corrections were needed."}
      ${removed.length ? ` ${plural(removed.length, "unverifiable reading")} removed.` : ""}
      ${r.style ? (Object.keys(r.style).length ? ` Style check: ${esc(Object.entries(r.style).map(([w, k]) => `${w} ×${k}`).join(", "))} remaining.` : " Style check: no stock AI phrasing found.") : ""}</p>
    ${r.summary ? `<p class="small muted">${fmt(r.summary)}</p>` : ""}
    ${corr.length || fixes.length ? `<details class="report"><summary>Show every change</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Where</th><th>Change</th><th>Why</th></tr></thead><tbody>
      ${fixes.map((k) => `<tr><td>${esc(k.id)}</td><td>Answer key <span class="fix-before">${esc(k.from)}</span> → <span class="fix-after">${esc(k.to)}</span></td><td>${fmt(k.why)}</td></tr>`).join("")}
      ${corr.map((x) => `<tr><td>${esc(x.where)}${x.applied ? "" : ` <span class="pill warn">not applied</span>`}</td><td><span class="fix-before">${esc(x.before)}</span><br><span class="fix-after">${esc(x.after)}</span></td><td>${fmt(x.why)}</td></tr>`).join("")}
    </tbody></table></div></details>` : ""}
    <p class="small muted">The fact-check uses Claude's own knowledge, not a library lookup. It catches most errors, not all of them. If you spot one, use “Report an error” under the section.</p>
  </div></div>`;
}
function errataBlock(c, n, sec) {
  const list = arr(S.errata[c.id]).filter((e) => e.n === n && e.sec === sec);
  const open = S.errOpen[`${c.id}:${sec}`];
  const label = { checking: "Checking…", error: "Fixed", partly: "Partly fixed", "not-an-error": "No error found", failed: "Could not check" };
  return `<div class="errata" id="err-${esc(sec)}">
    ${list.map((e) => `<div class="cbox k-myth"><div class="cbox-h"><span>Error report · ${esc(date(e.at))}</span><span>${esc(label[e.status] || e.status)}</span></div><div class="cbox-b">
      <p><strong>Reported:</strong> ${esc(e.text)}</p>
      ${e.reply ? `<p><strong>Dr. Professor:</strong> ${fmt(e.reply)}</p>` : ""}
      ${arr(e.fixes).filter((f) => f.applied).map((f) => `<p class="small"><span class="fix-before">${esc(f.quote)}</span> → <span class="fix-after">${esc(f.correction)}</span></p>`).join("")}
    </div></div>`).join("")}
    ${open ? `<div class="field"><label for="err-text-${esc(sec)}">What is wrong in section ${esc(sec)}?</label><textarea class="input" id="err-text-${esc(sec)}" maxlength="4000" placeholder="Quote the sentence and say what you think is wrong. A source helps."></textarea>
      <div class="row"><button class="btn sm" data-act="err-submit" data-sec="${esc(sec)}">Submit for checking</button><button class="btn ghost sm" data-act="err-cancel" data-sec="${esc(sec)}">Cancel</button></div></div>`
      : `<div><button class="linkbtn" data-act="err-open" data-sec="${esc(sec)}">Report an error in ${esc(sec)}</button></div>`}
  </div>`;
}

const cite = (html, sec) => html.replace(/\[(\d+(?:\s*[,–-]\s*\d+)*)\]/g, (m, g) => `<sup class="cite"><a href="#ref-${esc(sec)}-${g.match(/\d+/)[0]}" title="See source">[${g}]</a></sup>`);
function provLine(c, chap) {
  const pv = chap.prov || {}, P = persona(c.persona);
  needNames(Object.values(pv).map((x) => x && x.by));
  const part = (k, label) => (pv[k] && pv[k].at ? `${label}: ${esc(engineName(pv[k].tier))} engine, ${esc(date(pv[k].at))}${pv[k].by ? `, requested by ${who(pv[k].by)}` : ""}` : "");
  const bits = pv.note ? [esc(pv.note)] : [part("lesson", "Text and practice"), part("figures", "Figures"), part("assess", "Lecture and assessments"), part("review", "Fact-check"), part("audio", "Narrated edition")].filter(Boolean);
  return `<p class="small muted prov"><strong>Who wrote this chapter.</strong> Dr. Professor, writing as ${esc(P.name)}, using Claude by Anthropic. ${bits.join(" · ")}${bits.length ? "." : ""}</p>`;
}
function refsBlock(s) {
  if (!arr(s.sources).length) return "";
  return `<details class="refs-wrap" open><summary class="box-title">Sources for ${esc(s.n)}</summary><ol class="refs">${s.sources.map((x) => `<li id="ref-${esc(s.n)}-${x.n}" value="${x.n}" class="${x.withdrawn ? "withdrawn" : ""}">${esc(x.citation)}
    ${x.withdrawn ? `<span class="pill warn">Withdrawn by fact-check</span>` : x.checked ? `<span class="pill ok">Checked</span>` : x.unverified ? `<span class="pill warn">Unverified</span>` : ""}
    <a href="${readingLink(x)}" target="_blank" rel="noopener">Find it ↗</a>${x.supports ? `<div class="muted">Cited for: ${esc(x.supports)}</div>` : ""}</li>`).join("")}</ol></details>`;
}
function altBlock(c, n, s) {
  const p = S.prog[c.id], a = p.alt && p.alt[s.n], key = `${c.id}:${s.n}`;
  const busy = S.busy["alt:" + key];
  const cur = S.altPick[key] || (a && a.mode) || S.profile.mode || "simpler";
  const label = a ? (a.mode ? modeOf(a.mode).name : persona(a.persona).name) : "";
  return `<div class="alt" id="alt-${esc(s.n)}">
    <div class="row alt-bar"><label class="small" for="altp-${esc(s.n)}">Explain ${esc(s.n)} again:</label>
      <select class="input sel" id="altp-${esc(s.n)}" data-inp="alt-pick" data-sec="${esc(s.n)}">${MODES.map((m) => `<option value="${m.id}" ${m.id === cur ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
      ${busy ? `<button class="btn ghost sm" data-act="stop" data-k="alt:${esc(key)}">Stop</button>` : `<button class="btn ghost sm" data-act="alt-explain" data-sec="${esc(s.n)}">${a ? "Explain again" : "Explain"}</button>`}</div>
    ${a ? `<div class="cbox k-subj"><div class="cbox-h"><span>Dr. Professor · ${esc(label)}</span><span>Private to you</span></div><div class="cbox-b"><div class="prose alt-text">${a.text ? paras(a.text) : "<p class='muted'>Thinking…</p>"}</div>${a.err ? `<p class="status err">${esc(a.err)}</p>` : ""}</div></div>` : ""}
  </div>`;
}

function readingLink(r) {
  const doi = String(r.citation).match(/https:\/\/doi\.org\/[^\s]+/), url = String(r.citation).match(/https?:\/\/[^\s)]+/);
  if (doi) return doi[0].replace(/[.,]$/, "");
  if (url) return url[0].replace(/[.,]$/, "");
  const q = encodeURIComponent(r.citation);
  if (r.kind === "book" || r.kind === "chapter") return "https://www.worldcat.org/search?q=" + q;
  if (r.kind === "website") return "https://duckduckgo.com/?q=" + q;
  return "https://scholar.google.com/scholar?q=" + q;
}
function pager(c, n) {
  const prev = n > 1 ? `<button class="btn ghost sm" data-act="open-chapter" data-n="${n - 1}">← Ch. ${n - 1}: ${esc(c.chapters[n - 2].title)}</button>` : `<button class="btn ghost sm" data-act="open-course" data-id="${esc(c.id)}">← Syllabus</button>`;
  const next = n < c.chapters.length ? `<button class="btn ghost sm" data-act="open-chapter" data-n="${n + 1}">Ch. ${n + 1}: ${esc(c.chapters[n].title)} →</button>` : `<button class="btn ghost sm" data-act="open-final">Final examination →</button>`;
  return `<div class="pager">${prev}${next}</div>`;
}

function genBox(c, n, chap) {
  const key = `${c.id}:${n}`, g = S.gen[key];
  const parts = [["lesson", "Textbook text, worked examples, misconceptions and practice"], ["figures", "Color figures and interactive pieces"], ["assess", "Lecture slides, quiz, challenges and study list"], ["review", "Fact-check: claims, figure labels and citations; every answer key re-solved blind"]];
  const has = (k) => chap && (k === "review" ? chap.review && chap.review.full : chap[k]);
  const running = g && g.running;
  const st = (k) => {
    if (has(k)) return `<span class="st" style="color:var(--ok)">Done</span>`;
    const s = g && g.parts[k];
    if (!s) return `<span class="st muted">Waiting</span>`;
    if (s.state === "wait") return `<span class="st muted">Queued</span>`;
    if (s.state === "run") return `<span class="st">${s.len ? `${(s.len / 1000).toFixed(1)}k chars` : "Thinking…"}</span>`;
    if (s.state === "err") return `<span class="st" style="color:var(--bad)">Failed</span>`;
    return `<span class="st" style="color:var(--ok)">Done</span>`;
  };
  const errs = g ? Object.values(g.parts).filter((s) => s.state === "err").map((s) => s.msg) : [];
  const onlyReview = chap && chap.lesson && chap.figures && chap.assess;
  const title = !(chap && chap.lesson) ? "This chapter has not been written yet" : onlyReview ? "This chapter has not been fact-checked yet" : "Parts of this chapter are not written yet";
  const btn = !(chap && chap.lesson) ? `Write chapter ${n}` : onlyReview ? "Run the fact-check" : "Write the missing parts";
  return `<div class="h3">${title}</div>
    <p class="small muted">Dr. Professor writes the chapter in three parts at once. A second, more careful pass then fact-checks it and corrects what it finds before you rely on it. This uses your Claude account and usually takes three to six minutes. The finished chapter is saved to the shared library, so it is only written once.</p>
    <ul class="gen-list">${parts.map(([k, label]) => `<li>${st(k)}<span>${label}</span></li>`).join("")}</ul>
    ${errs.length ? `<p class="status err">${esc([...new Set(errs)].join(" "))}</p>` : ""}
    <div class="row">${running ? `<button class="btn ghost" data-act="stop" data-k="${esc(key)}">Stop</button>` : `<button class="btn" data-act="write-chapter" data-n="${n}">${btn}</button>`}</div>`;
}

function deck(c, n, A) {
  const key = `${c.id}:${n}`;
  const i = Math.min(S.slide[key] || 0, A.slides.length - 1);
  const s = A.slides[i];
  return `<div class="deck" tabindex="0" data-deck="${esc(key)}" aria-roledescription="slide deck" aria-label="Lecture slides">
    <div class="slide"><h3>${esc(s.title)}</h3><ul>${s.bullets.map((b) => `<li>${fmt(b)}</li>`).join("")}</ul>
      <div class="foot"><span>${esc(c.code)} · Ch. ${n}</span><span>${i + 1} / ${A.slides.length}</span></div></div>
    <div class="deck-ctl"><button class="btn ghost sm" data-act="slide" data-d="-1" ${i === 0 ? "disabled" : ""}>← Previous</button><button class="btn ghost sm" data-act="slide" data-d="1" ${i === A.slides.length - 1 ? "disabled" : ""}>Next →</button><span class="small muted">Arrow keys work when the deck is focused.</span></div>
    ${s.notes ? `<p class="deck-notes"><strong>Lecturer's notes.</strong> ${fmt(s.notes)}</p>` : ""}</div>`;
}

function practice(c, sec, i, pr) {
  const p = S.prog[c.id], k = `${sec}#${i}`, rec = p.practice[k];
  const num = `<span class="num muted">${i + 1}.</span> `;
  if (pr.type === "mc") {
    const done = rec && rec.choice != null;
    return `<div class="q">${num}${fmt(pr.q)}</div><div class="choices">${pr.choices.map((ch, j) => {
      const cls = done ? (j === pr.answer ? "right" : j === rec.choice ? "wrong" : "") : "";
      return `<button class="choice ${cls}" data-act="practice-mc" data-sec="${esc(sec)}" data-i="${i}" data-j="${j}" ${done ? "disabled" : ""}><span class="k">${LETTERS[j]}</span><span>${fmt(ch)}</span></button>`;
    }).join("")}</div>
    ${done ? `<div class="verdict ${rec.choice === pr.answer ? "ok" : "bad"}">${rec.choice === pr.answer ? "Correct." : `Not quite. The answer is ${LETTERS[pr.answer]}.`}</div>${pr.explanation ? `<div class="expl">${fmt(pr.explanation)}</div>` : ""}<div><button class="btn ghost sm" data-act="practice-reset" data-sec="${esc(sec)}" data-i="${i}">Try again</button></div>` : ""}`;
  }
  const shown = rec && rec.revealed;
  return `<div class="q">${num}${fmt(pr.q)}</div>
    <textarea class="input" id="pa-${esc(sec)}-${i}" data-inp="practice-text" data-sec="${esc(sec)}" data-i="${i}" placeholder="Write your answer before checking.">${esc((rec && rec.text) || "")}</textarea>
    ${shown ? `<div class="expl"><strong>Model answer.</strong> ${fmt(pr.answer)}${pr.explanation ? `<br><span class="muted">${fmt(pr.explanation)}</span>` : ""}</div>` : `<div><button class="btn ghost sm" data-act="practice-reveal" data-sec="${esc(sec)}" data-i="${i}">Check against the model answer</button></div>`}`;
}

function quizBody(c, n, qs, kind) {
  const p = S.prog[c.id];
  const rec = kind === "quiz" ? p.quiz[n] : p.final;
  const selKey = `${c.id}:${kind}:${n}`;
  const sel = S.quizSel[selKey] || [];
  const done = !!rec && !S.quizSel[selKey + ":retake"];
  const pass = kind === "quiz" ? PASS_QUIZ : PASS_FINAL;
  const items = qs.map((q, i) => {
    const pick = done ? rec.answers[i] : sel[i];
    return `<div class="prob"><div class="q"><span class="num muted">${i + 1}.</span> ${q.ch ? `<span class="pill">Ch. ${q.ch}</span> ` : ""}${fmt(q.q)}</div><div class="choices">${q.choices.map((ch, j) => {
      const cls = done ? (j === q.answer ? "right" : j === pick ? "wrong" : "") : (j === pick ? "sel" : "");
      return `<button class="choice ${cls}" data-act="quiz-pick" data-kind="${kind}" data-i="${i}" data-j="${j}" ${done ? "disabled" : ""} aria-pressed="${j === pick}"><span class="k">${LETTERS[j]}</span><span>${fmt(ch)}</span></button>`;
    }).join("")}</div>${done && q.explanation ? `<div class="expl">${fmt(q.explanation)}</div>` : ""}</div>`;
  }).join("");
  const answered = sel.filter((x) => x != null).length;
  const foot = done
    ? `<div class="box"><div class="h3">Score: <span class="num">${pct(rec.score)}</span> <span class="pill ${rec.score >= pass ? "ok" : "warn"}">${rec.score >= pass ? "Passed" : "Not passed"}</span></div>
       <div class="bar-meter" role="img" aria-label="Score ${pct(rec.score)}"><span style="width:${pct(rec.score)};--bw:${rec.score >= pass ? "var(--ok)" : "var(--warn)"}"></span></div>
       <p class="small muted">Taken ${esc(date(rec.at))}. ${rec.score >= pass ? "" : `You need ${pct(pass)}. Review the explanations, then retake.`}</p>
       <div class="row"><button class="btn ghost sm" data-act="quiz-retake" data-kind="${kind}">Retake</button>${kind === "final" && rec.score >= pass ? `<button class="btn sm" data-act="open-cert">View certificate</button>` : ""}</div></div>`
    : `<div class="row"><button class="btn" data-act="quiz-submit" data-kind="${kind}" ${answered < qs.length ? "disabled" : ""}>Submit answers</button><span class="small muted num">${answered}/${qs.length} answered</span></div>`;
  return `<div class="box">${items}</div>${foot}`;
}

function challenge(c, n, i, x) {

  const busy = S.busy["grade:" + c.id + ":" + k];

    <textarea class="input" id="cx-text-${n}-${i}" data-inp="challenge" data-i="${i}" style="min-height:140px" placeholder="Your submission">${esc(rec.text || "")}</textarea>
    <div class="row"><button class="btn sm" data-act="grade" data-i="${i}" ${busy ? "disabled" : ""}>${busy ? "Grading…" : gr ? "Resubmit for grading" : "Submit for grading"}</button><span class="status ${rec.err ? "err" : ""}">${esc(rec.err || "")}</span></div>
    ${gr ? `<div class="box" style="background:var(--paper)"><div class="h3">Grade: <span class="num">${esc(gr.score)}</span>/100</div><p>${fmt(gr.verdict)}</p>

      ${gr.next ? `<p class="small"><strong>Next step.</strong> ${fmt(gr.next)}</p>` : ""}</div>` : ""}`;
}

function chatBody(key) {
  const ch = S.chat[key] || { turns: [], busy: false };
  return `<div class="chat">
    ${ch.turns.length ? "" : `<p class="small muted">Ask about anything in this chapter: a step you did not follow, a practice answer you disagree with, how this connects to something else. Answers use your Claude account.</p>`}

}

/* ----- final / cert / notebook / transcript ----- */
function viewFinal(c) {
  const ex = S.finals[c.id], p = S.prog[c.id];
  if (ex === undefined || !p) {
    Promise.all([ex === undefined ? Store.get(finalPath(c.id)).then((d) => { S.finals[c.id] = d; }) : null, loadProg(c.id)])
      .then(() => { if (S.view === "final" && S.courseId === c.id) render(); });
    return `<p class="muted">Opening the examination…</p>`;
  }
  const head = `<div class="stack-sm"><div class="eyebrow">${esc(c.code)} · Final examination</div><h1 class="h1">${esc(c.title)}</h1>
    <p class="lede">16 questions drawn from every chapter. ${pct(PASS_FINAL)} passes. Passing issues your certificate; it says "coursework and examination" if every chapter quiz is also passed, and "credit by examination" otherwise.</p></div>`;
  if (!ex) {
    const busy = S.busy["final:" + c.id];
    return `<div class="stack col">${head}<div class="sheet stack-sm"><div class="h3">The examination has not been written yet</div>
      <p class="small muted">It is written once from the syllabus and shared by everyone taking this course. About a minute.</p>
      <div class="row">${busy ? `<button class="btn ghost" data-act="stop" data-k="final:${esc(c.id)}">Stop</button>` : `<button class="btn" data-act="write-final">Write the final examination</button>`}<span class="status ${S.gen["final:" + c.id + ":err"] ? "err" : ""}">${esc(busy ? S.gen["final:" + c.id] || "Thinking…" : S.gen["final:" + c.id + ":err"] || "")}</span></div></div></div>`;
  }

/* ----- spaced repetition ----- */
const DAY = 864e5;
const Srs = {
  data: { cards: {} }, timer: null,
  async load() { const d = await Store.getUser("srs"); this.data = d && d.cards ? d : { cards: {} }; },
  save() { clearTimeout(this.timer); this.timer = setTimeout(() => Store.setUser("srs", this.data).catch(() => {}), 800); },
  add(cards) {
    let added = 0;
    cards.forEach((cd) => { if (cd && !this.data.cards[cd.id]) { this.data.cards[cd.id] = { ...cd, due: Date.now(), ivl: 0, ease: 2.5, reps: 0, lapses: 0, added: Date.now() }; added++; } });
    if (added) { this.save(); dueBadge(); }
    return added;
  },
  due(now = Date.now()) { return Object.values(this.data.cards).filter((x) => x.due <= now).sort((a, b) => a.due - b.due); },
  count() { return Object.keys(this.data.cards).length; },
  next(cd, r) {
    const { ivl, ease, reps } = cd;
    if (r === 0) return { ivl: 0, ease: Math.max(1.3, ease - 0.2), reps: 0, due: Date.now() + 10 * 60e3, lapse: true };
    if (r === 1) { const n = reps === 0 ? 0.5 : Math.max(1, ivl * 1.2); return { ivl: n, ease: Math.max(1.3, ease - 0.15), reps: reps + 1, due: Date.now() + n * DAY }; }
    if (r === 2) { const n = reps === 0 ? 1 : reps === 1 ? 3 : Math.round(ivl * ease); return { ivl: n, ease, reps: reps + 1, due: Date.now() + n * DAY }; }
    const n = reps === 0 ? 4 : Math.round(Math.max(ivl, 1) * ease * 1.3);
    return { ivl: n, ease: ease + 0.15, reps: reps + 1, due: Date.now() + n * DAY };
  },
  rate(id, r) {
    const cd = this.data.cards[id]; if (!cd) return;
    const nx = this.next(cd, r);
    Object.assign(cd, { ivl: nx.ivl, ease: nx.ease, reps: nx.reps, due: nx.due, last: Date.now() });
    if (nx.lapse) cd.lapses = (cd.lapses || 0) + 1;
    this.save(); dueBadge();
  },
};
const ivlLabel = (nx) => (nx.ivl === 0 ? "10 min" : nx.ivl < 1 ? `${Math.round(nx.ivl * 24)} hours` : nx.ivl < 1.5 ? "1 day" : nx.ivl < 45 ? `${Math.round(nx.ivl)} days` : `${Math.round(nx.ivl / 30)} months`);
const cardId = (c, sec, tail) => `${c.id}~${String(sec).replace(/\./g, "_")}~${tail}`;
const termCards = (c, s) => s.keyTerms.map((t) => ({ id: cardId(c, s.n, "t" + hashStr(t.term)), courseId: c.id, code: c.code, sec: s.n, kind: "term", front: t.term, back: t.def }));
const qCard = (c, sec, tail, q) => ({ id: cardId(c, sec, tail), courseId: c.id, code: c.code, sec, kind: "q", front: q.q, choices: q.choices, answer: q.answer, back: q.explanation });
function dueBadge() { const b = $("#due-badge"); if (!b) return; const n = Srs.due().length; b.textContent = n > 99 ? "99+" : String(n); b.hidden = !n; }

function viewReview() {

  return `<div class="stack col">
    <h1 class="h1">Review</h1>${done}

      ${due.length ? `<div><button class="btn" data-act="rv-start">Start review</button></div>` : `<p class="muted small">${total ? "Nothing due right now. Come back tomorrow." : "Your deck is empty. Key terms join it when you mark a section as read, and any question you miss joins it too."}</p>`}</div>
    ${Object.keys(byBook).length ? `<div class="rows">${Object.entries(byBook).map(([id, b]) => { const c = S.courses.get(id); return c ? `<button class="rowlink" data-act="open-course" data-id="${esc(id)}" style="--subj:${subj(c)}"><span class="n">${b.due}</span><span class="t"><b>${esc(c.title)}</b><span>${b.due} due · ${b.total} cards</span></span><span class="chev">›</span></button>` : ""; }).join("")}</div>` : ""}
    <details class="more"><summary>How spaced review works</summary><div class="more-b"><p class="small">Each card comes back just before you would forget it: after a day, then three days, then about a week, and further apart every time you remember it. A card you miss comes back in ten minutes. Cards from all your books are mixed together, which trains you to tell similar ideas apart. Rate honestly: <b>Again</b> if you could not recall it, <b>Hard</b> if it was a struggle, <b>Good</b> if it came with some effort, <b>Easy</b> if it was instant.</p></div></details>
  </div>`;
}

      : `<p class="small">You guessed <b>${LETTERS[pre]}</b>. Read on: the answer is in this section, and the same question is waiting in Practice ${esc(s.n)}. Guessing first, even wrongly, makes the right answer stick.</p>`}

    ${r ? `<div class="bar-meter"><span style="width:${r.score}%;--bw:${r.score >= 70 ? "var(--ok)" : "var(--warn)"}"></span></div>

async function feynCheck(c, n, sec) {

  let lastPaint = 0;
  const onLen = (k) => (len) => { g.parts[k].len = len; const now = Date.now(); if (now - lastPaint > 400) { lastPaint = now; refresh(); } };
  const run = async (k) => {
    try {
      const res = await askData(PROMPTS[k](c, n), { signal: ctl.signal, onLen: onLen(k), tier: k === "figures" ? "default" : (c.engine || "default") });
      const raw = res.data;
      const val = k === "lesson" ? normLesson(raw, c, n) : k === "figures" ? normFigures(raw) : normAssess(raw);
      const extra = k === "figures" ? { interactives: normInteractives(raw && raw.interactives) } : {};
      const doc = { ...S.chapters[key], [k]: val, ...extra, n, updatedAt: Date.now(), prov: { ...(S.chapters[key].prov || {}), [k]: stamp(res.tier, { persona: c.persona || "scholar" }) } };
      S.chapters[key] = doc;
      g.parts[k] = { state: "done" };
      await Store.set(path, doc);
      if (k === "lesson") await Store.merge(coursePath(c.id), { written: { [n]: Date.now() } }).catch(() => {});
    } catch (e) {
      g.parts[k] = { state: "err", msg: e && e.code ? errCopy(e) : saveErr(e) };
    }
    refresh();
  };
  await Promise.all(todo.map(run));
  const doc = S.chapters[key];
  if (needReview) {
    if (ctl.signal.aborted) g.parts.review = { state: "err", msg: errCopy({ code: "cancelled" }) };
    else if (!doc.lesson || !doc.assess) g.parts.review = { state: "err", msg: "The fact-check runs once the text and assessments are written; retry the failed part first." };
    else {
      g.parts.review = { state: "run", len: 0 }; refresh();
      try {
        await factCheck(c, n, doc, ctl.signal, onLen("review"));
        g.parts.review = { state: "done" };
        await Store.set(path, doc);
      } catch (e) { g.parts.review = { state: "err", msg: e && e.code ? errCopy(e) : saveErr(e) }; }
    }
    refresh();
  }
  g.running = false;
  const cc = S.courses.get(c.id);
  if (cc && doc.lesson) { cc.written = { ...(cc.written || {}), [n]: Date.now() }; }
  if (S.view === "chapter" && S.courseId === c.id && S.chapterN === n) {
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
}

/* ----- accuracy: fact-check, blind answer-key check, learner error reports ----- */
const unesc = (s) => String(s).replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
const svgLabels = (svg) => [...String(svg).matchAll(/<text[^>]*>([^<]+)<\/text>/g)].map((m) => unesc(m[1]).trim()).filter(Boolean);
function keyItems(chap) {
  const items = [];
  chap.lesson.sections.forEach((s) => s.practice.forEach((p, i) => { if (p.type === "mc") items.push({ id: `P${s.n}-${i}`, ref: p }); }));
  arr(chap.assess && chap.assess.quiz).forEach((q, i) => items.push({ id: `Q${i + 1}`, ref: q }));
  return items;
}
const mcText = (q) => q.choices.map((ch, j) => `  ${LETTERS[j]}. ${ch}`).join("\n");
const stripCites = (t) => String(t).replace(/\s*\[\d+(?:\s*[,–-]\s*\d+)*\]/g, "");
function sectionText(chap, s, o = {}) {
  const out = [`## Section ${s.n} ${s.title}`, ...s.reading.map((r) => (o.forAudio ? stripCites(r) : r))];
  if (!o.forAudio && arr(s.sources).length) out.push("Sources:\n" + s.sources.map((x) => `[S${s.n}-${x.n}] ${x.citation} (cited for: ${x.supports})`).join("\n"));
  if (s.keyTerms.length) out.push("Key terms:\n" + s.keyTerms.map((t) => `- ${t.term}: ${t.def}`).join("\n"));
  if (s.example.steps.length) out.push(`${s.example.title}\n${s.example.steps.map((x, i) => `${i + 1}. ${x}`).join("\n")}\nTakeaway: ${s.example.takeaway}`);
  if (s.misconception && s.misconception.myth) out.push(`Misconception. Myth: ${s.misconception.myth}\nFact: ${s.misconception.fact}`);
  if (!o.forAudio) s.practice.forEach((p, i) => out.push(p.type === "mc"
    ? `[P${s.n}-${i}] ${p.q}\n${mcText(p)}\n  Key: ${LETTERS[p.answer]}. Explanation: ${p.explanation}`
    : `[P${s.n}-${i}] (short answer) ${p.q}\n  Model answer: ${p.answer}\n  Explanation: ${p.explanation}`));
  arr(chap.figures).filter((f) => f.section === s.n).forEach((f) => out.push(`Figure for ${s.n}. Caption: ${f.caption}\n  Labels: ${svgLabels(f.svg).join(" | ")}`));
  return out.join("\n\n");
}
function chapterText(chap, o = {}) {
  const L = chap.lesson, A = chap.assess || {};
  const out = ["## Overview", L.overview, o.forAudio ? "" : "Objectives: " + L.objectives.join("; "), ...L.sections.map((s) => sectionText(chap, s, o))];
  const secIds = new Set(L.sections.map((s) => s.n));
  arr(chap.figures).filter((f) => !secIds.has(f.section)).forEach((f) => out.push(`Figure. Caption: ${f.caption}\n  Labels: ${svgLabels(f.svg).join(" | ")}`));
  if (!o.forAudio) {
    if (arr(A.slides).length) out.push("## Lecture slides\n" + A.slides.map((s, i) => `${i + 1}. ${s.title}: ${s.bullets.join(" / ")}\n   Notes: ${s.notes}`).join("\n"));
    if (arr(A.quiz).length) out.push("## Quiz\n" + A.quiz.map((q, i) => `[Q${i + 1}]${q.sec ? ` (section ${q.sec})` : ""} ${q.q}\n${mcText(q)}\n  Key: ${LETTERS[q.answer]}. Explanation: ${q.explanation}`).join("\n\n"));
    if (arr(A.challenge).length) out.push("## Challenge exercises\n" + A.challenge.map((x) => `${x.title}: ${x.prompt} Deliverable: ${x.deliverable} Rubric: ${x.rubric.join("; ")}`).join("\n"));
    if (arr(A.readings).length) out.push("## Readings\n" + A.readings.map((r, i) => `[R${i + 1}] ${r.citation} ${r.pages ? "(" + r.pages + ")" : ""}. Read it for: ${r.why}`).join("\n"));
  }
  return out.filter(Boolean).join("\n\n");
}
function proseOf(chap) {
  const L = chap.lesson, A = chap.assess || {};
  return [L.overview, ...L.sections.flatMap((s) => [...s.reading, ...s.example.steps, s.example.takeaway, s.misconception && s.misconception.myth, s.misconception && s.misconception.fact, ...s.practice.map((p) => p.explanation)]),
    ...arr(A.slides).flatMap((s) => [s.title, ...s.bullets, s.notes]), ...arr(A.quiz).map((q) => q.explanation)].filter(Boolean).join("\n");
}
function applyFix(scope, quote, correction) {
  if (!quote || quote === correction) return false;
  const xml = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let done = false;
  const walk = (o) => {
    if (done || !o || typeof o !== "object") return;
    for (const k of Object.keys(o)) {
      if (done) return;
      const v = o[k];
      if (typeof v === "string") {
        if (k === "svg") { const q = ">" + xml(quote) + "<"; if (v.includes(q)) { o[k] = v.replace(q, () => ">" + xml(correction) + "<"); done = true; } }
        else if (v.includes(quote)) { o[k] = v.replace(quote, () => correction); done = true; }
      } else walk(v);
    }
  };
  walk(scope);
  return done;
}
async function resolveKeys(c, items, blind, extra, signal) {
  const byId = {};
  arr(blind).forEach((b) => { byId[str(b.id)] = b; });
  const disputes = items.filter((it) => { const b = byId[it.id]; return !b || +b.answer !== it.ref.answer || str(b.problem) || extra[it.id]; })
    .map((it) => ({ ...it, blind: byId[it.id], extra: extra[it.id] }));
  const keyFixes = [];
  if (disputes.length) {
    const res = arr(await askJSON(PROMPTS.adjudicate(c, disputes), { signal, tier: "complex" }));
    for (const r of res) {
      const it = disputes.find((d) => d.id === str(r.id));
      if (!it) continue;
      const q = it.ref, before = LETTERS[q.answer];
      const rw = r.rewrite && typeof r.rewrite === "object" ? normMC(r.rewrite) : null;
      if (rw && rw.q) {
        q.q = rw.q; q.choices = rw.choices; q.answer = rw.answer; q.explanation = str(r.explanation) || q.explanation;
        keyFixes.push({ id: it.id, from: before, to: `${LETTERS[q.answer]} (question rewritten)`, why: str(r.explanation) });
      } else if (Number.isInteger(+r.answer) && +r.answer >= 0 && +r.answer < q.choices.length && +r.answer !== q.answer) {
        q.answer = +r.answer; q.explanation = str(r.explanation) || q.explanation;
        keyFixes.push({ id: it.id, from: before, to: LETTERS[q.answer], why: str(r.explanation) });
      }
    }
  }
  return { keysChecked: items.length, keysAgreed: items.length - disputes.length, keyFixes };
}
async function factCheck(c, n, chap, signal, onLen) {
  const items = keyItems(chap);
  const [fcRes, blind] = await Promise.all([
    askData(PROMPTS.factcheck(c, n, chap), { signal, tier: "complex", onLen }),
    items.length ? askJSON(PROMPTS.blindKeys(c, items), { signal, tier: "complex" }) : [],
  ]);
  const fc = fcRes.data || {};
  const extra = {};
  arr(fc.keys).forEach((k) => { if (str(k.id)) extra[str(k.id)] = str(k.problem) || "flagged"; });
  const kr = await resolveKeys(c, items, blind, extra, signal);
  const scope = { lesson: chap.lesson, figures: chap.figures, assess: chap.assess };
  const corrections = arr(fc.issues).map((i) => ({ where: str(i.where), before: str(i.quote), after: str(i.correction), why: str(i.problem), severity: str(i.severity) }))
    .filter((x) => x.before && x.after && x.before !== x.after);
  corrections.forEach((x) => { x.applied = applyFix(scope, x.before, x.after); });
  const srcVerdict = {};
  arr(fc.sources).forEach((s) => { srcVerdict[str(s.id)] = s; });
  let srcChecked = 0, srcWithdrawn = 0;
  chap.lesson.sections.forEach((s) => arr(s.sources).forEach((x) => {
    const v = srcVerdict[`S${s.n}-${x.n}`];
    if (!v) return;
    srcChecked++;
    delete x.checked; delete x.unverified; delete x.withdrawn;
    if (str(v.verdict) === "likely-invented") { x.withdrawn = true; srcWithdrawn++; }
    else if (str(v.verdict) === "uncertain" || str(v.supports) === "no") x.unverified = true;
    else if (str(v.verdict) === "real") x.checked = true;
  }));
  const removed = [];
  if (chap.assess) {
    const verdict = {};
    arr(fc.readings).forEach((r) => { verdict[str(r.id)] = str(r.verdict); });
    chap.assess.readings = chap.assess.readings.filter((r, i) => {
      const v = verdict["R" + (i + 1)];
      if (v === "likely-invented") { removed.push(r.citation); return false; }
      if (v === "uncertain") r.unverified = true; else if (v === "real") r.checked = true;
      return true;
    });
  }
  chap.review = { full: true, at: Date.now(), tier: fcRes.tier, by: null, ...kr, srcChecked, srcWithdrawn,
    corrections: [...arr(chap.review && chap.review.corrections), ...corrections], readingsRemoved: removed, summary: str(fc.summary), style: styleLint(proseOf(chap)) };
  chap.prov = { ...(chap.prov || {}), review: stamp(fcRes.tier) };
}
async function errSubmit(c, n, sec) {
  const ta = document.getElementById("err-text-" + sec);

  const s = chap.lesson.sections.find((x) => x.n === sec);
  const id = `e-${Date.now()}-${rand(4)}`;
  const e = { id, n, sec, text: text.slice(0, 4000), at: Date.now(), by: Store.uid || null, status: "checking" };
  S.errata[c.id] = [...arr(S.errata[c.id]), e];
  S.errOpen[`${c.id}:${sec}`] = false;
  const el = document.getElementById("err-" + sec); if (el) el.outerHTML = errataBlock(c, n, sec);
  const save = () => { const { id: _id, ...doc } = e; return Store.set(`courses/${c.id}/errata/${id}`, doc).catch(() => {}); };
  save();
  try {
    const res = await askJSON(PROMPTS.errata(c, chap, s, e.text), { tier: "complex" });
    e.status = ["error", "partly", "not-an-error"].includes(res.verdict) ? res.verdict : "partly";
    e.reply = str(res.reply);
    e.fixes = arr(res.fixes).map((f) => ({ quote: str(f.quote), correction: str(f.correction) })).filter((f) => f.quote && f.correction && f.quote !== f.correction);
    const scope = { lesson: chap.lesson, figures: chap.figures, assess: chap.assess };
    e.fixes.forEach((f) => { f.applied = applyFix(scope, f.quote, f.correction); });
    const applied = e.fixes.filter((f) => f.applied);
    if (applied.length) {
      chap.review = chap.review || { at: Date.now(), corrections: [] };
      chap.review.corrections = [...arr(chap.review.corrections), ...applied.map((f) => ({ where: `${sec} (learner report)`, before: f.quote, after: f.correction, why: e.reply, severity: "error", applied: true }))];
      await Store.set(chapterPath(c.id, n), chap);
    }
  } catch (err) { e.status = "failed"; e.reply = errCopy(err); }
  await save();
  if (S.view === "chapter" && S.courseId === c.id && S.chapterN === n) { const y = window.scrollY; render(); window.scrollTo(0, y); }

async function writeFinal(c) {
  const k = "final:" + c.id;
  const ctl = new AbortController(); ctls[k] = ctl;
  S.busy[k] = true; S.gen[k + ":err"] = ""; render();
  const status = (t) => { S.gen[k] = t; const el = $("#main .status"); if (el) el.textContent = t; };
  try {
    const raw = await askJSON(PROMPTS.final(c), { signal: ctl.signal, onLen: (len) => status(`Writing: ${(len / 1000).toFixed(1)}k characters`) });
    const questions = arr(raw.questions).map(normMC).filter((q) => q && q.q);
    if (questions.length < 8) throw { code: "bad_shape" };
    status("Checking the answer key: every question re-solved blind…");
    const items = questions.map((q, i) => ({ id: `F${i + 1}`, ref: q }));
    const blind = await askJSON(PROMPTS.blindKeys(c, items), { signal: ctl.signal, tier: "complex" });
    const check = await resolveKeys(c, items, blind, {}, ctl.signal);
    const doc = { questions, at: Date.now(), check: { ...check, at: Date.now() } };
    await Store.set(finalPath(c.id), doc);
    S.finals[c.id] = doc;
  } catch (e) {
    S.gen[k + ":err"] = e && e.code ? errCopy(e) : saveErr(e);
  }
  S.busy[k] = false;
  if (S.view === "final") render();
}

async function chatSend(c, n) {
  const key = `${c.id}:${n}`;
  const ch = S.chat[key] = S.chat[key] || { turns: [] };
  const q = str($("#chat-in") && $("#chat-in").value);
  if (!q || ch.busy) return;
  const sample = await caps.sample;
  const paint = () => { const el = $("#chat"); if (el) el.innerHTML = chatBody(key); };
  if (!sample) { ch.err = errCopy({ code: "unavailable_here" }); paint(); return; }
  const chap = S.chapters[key], L = chap.lesson;
  const text = L.sections.map((s) => `${s.n} ${s.title}\n${s.reading.join("\n")}`).join("\n\n").slice(0, 24000);
  const rules = `${preamble(c)}

You are holding office hours for Chapter ${n}: "${c.chapters[n - 1].title}". Answer the student's question directly at the ${lvl(c.level).name} level, in one to four short paragraphs separated by blank lines. Use the chapter text below as the shared reference, and say so when you go beyond it. If the student is mistaken, say so and explain. Plain text; **bold** allowed.
Learner profile: ${profileText()}

CHAPTER TEXT
${text}`;
  ch.turns.push({ role: "user", content: q }, { role: "assistant", content: "" });
  ch.draft = ""; ch.err = ""; ch.busy = true; paint();
  const ctl = new AbortController(); ctls["chat:" + key] = ctl;
  const history = ch.turns.slice(0, -1).slice(-10);
  try {
    const { text: ans } = await sample([{ role: "user", content: rules }, ...history], {
      cache: false, signal: ctl.signal,
      onText: ({ text: t }) => { ch.turns[ch.turns.length - 1].content = t; const last = $("#chat .msg:last-of-type .body"); if (last) last.innerHTML = paras(t); },
    });
    ch.turns[ch.turns.length - 1].content = ans;
  } catch (e) {
    if (e && e.text) ch.turns[ch.turns.length - 1].content = e.text + "\n\n[Answer interrupted]";
    else ch.turns.pop();
    if (!e || e.code !== "cancelled") ch.err = errCopy(e);
  }
  ch.busy = false; paint();
}

async function saveFile(filename, data, statusSel) {

  if (!dl) { if (st) st.textContent = "Saving files is not available in this view."; return; }
  try { await dl.save({ filename, data }); if (st) st.textContent = "Saved."; }
  catch (e) { if (st) st.textContent = e && e.code === "declined" ? "" : "The file could not be saved."; }
}

function notesMarkdown(c) {
  const p = S.prog[c.id];
  let out = `# ${c.code} — ${c.title}\n\nNotes exported ${new Date().toISOString().slice(0, 10)}\n`;
  c.chapters.forEach((ch, i) => {
    const n = i + 1; let block = "";
    ch.sections.forEach((s, j) => { const t = p.notes[`${n}.${j + 1}`]; if (t && t.trim()) block += `\n### ${n}.${j + 1} ${s.title}\n\n${t.trim()}\n`; });
    Object.entries(p.challenge).filter(([k, v]) => k.startsWith(n + "#") && v.text).forEach(([k, v]) => { block += `\n### Challenge ${k.replace("#", ".")}${v.grade ? ` (graded ${v.grade.score}/100)` : ""}\n\n${v.text.trim()}\n`; });
    if (block) out += `\n## Chapter ${n}. ${ch.title}\n${block}`;
  });
  return out;
}

      if (t) { const done = () => { a.textContent = "Copied"; setTimeout(() => { a.textContent = "Copy"; }, 1500); };
        const legacy = () => { try { const ta = document.createElement("textarea"); ta.value = t.text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); if (ok) done(); else a.textContent = "Select and copy"; } catch { a.textContent = "Select and copy"; } };
        try { navigator.clipboard.writeText(t.text).then(done, legacy); } catch { legacy(); } }
      break;
    }
    case "wx-reveal": S.wx[a.dataset.wx].shown++; wxPaint(a.dataset.wx); break;
    case "wx-reset": delete S.wx[a.dataset.wx]; wxPaint(a.dataset.wx); break;
    case "go-transcript": go("transcript"); break;
    case "open-course": go("course", a.dataset.id); break;
    case "open-chapter": go("chapter", S.courseId, +a.dataset.n, a.dataset.anchor || null); break;
    case "open-glossary": go("glossary", S.courseId); break;
    case "open-biblio": go("biblio", S.courseId); break;
    case "go-profile": go("profile"); break;
    case "draw-cover": writeCover(c); break;
    case "alt-explain": altExplain(c, S.chapterN, a.dataset.sec); break;
    case "coach-write": coachWrite(c); break;
    case "coach-alt": { const sec = a.dataset.sec; go("chapter", S.courseId, +sec.split(".")[0], "alt-" + sec); break; }
    case "rv-pick": { const i = +a.dataset.i, it = S.prog[c.id].review.sheet.items[i]; S.rvPick[i] = +a.dataset.j; $("#rv-" + i).innerHTML = reviewCheck(i, it.check); break; }
    case "au-play": auToggle(c, S.chapterN); break;
    case "au-skip": auMove(c, S.chapterN, (i) => i + +a.dataset.d); break;
    case "au-jump": auMove(c, S.chapterN, +a.dataset.i); break;
    case "au-prepare": writeAudio(c, S.chapterN); break;
    case "open-final": go("final", S.courseId); break;
    case "open-cert": go("cert", S.courseId); break;
    case "open-notebook": go("notebook", S.courseId); break;
    case "quick": S.form.topic = a.dataset.v; $("#f-topic").value = a.dataset.v; $("#f-topic").focus(); break;
    case "stop": ctls[a.dataset.k] && ctls[a.dataset.k].abort(); break;
    case "write-chapter": writeChapter(c, +a.dataset.n); break;
    case "write-final": writeFinal(c); break;
    case "slide": {
      const key = `${c.id}:${S.chapterN}`, A = S.chapters[key].assess;
      S.slide[key] = Math.max(0, Math.min(A.slides.length - 1, (S.slide[key] || 0) + +a.dataset.d));
      $("#deck").innerHTML = deck(c, S.chapterN, A); $("#deck .deck").focus(); break;
    }
    case "practice-mc": case "practice-reveal": case "practice-reset": {
      const sec = a.dataset.sec, i = +a.dataset.i, p = S.prog[c.id], k = `${sec}#${i}`;
      const pr = S.chapters[`${c.id}:${S.chapterN}`].lesson.sections.find((s) => s.n === sec).practice[i];
      if (act === "practice-mc") { p.practice[k] = { choice: +a.dataset.j, correct: +a.dataset.j === pr.answer }; if (+a.dataset.j !== pr.answer) Srs.add([qCard(c, sec, "p" + i, pr)]); }
      else if (act === "practice-reveal") p.practice[k] = { ...(p.practice[k] || {}), revealed: true };
      else delete p.practice[k];
      saveProg(c.id);
      $(`#pp-${CSS.escape(sec)}-${i}`).innerHTML = practice(c, sec, i, pr); break;
    }
    case "quiz-pick": case "quiz-submit": case "quiz-retake": {
      const kind = a.dataset.kind, n = kind === "quiz" ? S.chapterN : 0;
      const qs = kind === "quiz" ? S.chapters[`${c.id}:${n}`].assess.quiz : S.finals[c.id].questions;
      const selKey = `${c.id}:${kind}:${n}`, p = S.prog[c.id];
      if (act === "quiz-pick") { const s = S.quizSel[selKey] = S.quizSel[selKey] || []; s[+a.dataset.i] = +a.dataset.j; }
      else if (act === "quiz-retake") { S.quizSel[selKey] = []; S.quizSel[selKey + ":retake"] = true; }
      else {
        const sel = S.quizSel[selKey] || [];
        const right = qs.filter((q, i) => sel[i] === q.answer).length;
        const rec = { answers: qs.map((_, i) => sel[i] ?? null), score: right / qs.length, at: Date.now(), items: qs.map((q, i) => ({ sec: q.sec || null, ok: sel[i] === q.answer })) };
        if (kind === "quiz") { p.quiz[n] = rec; Srs.add(qs.map((q, i) => (sel[i] !== q.answer ? qCard(c, q.sec || `${n}.1`, `q${n}_${i}`, q) : null)).filter(Boolean)); } else p.final = rec;
        delete S.quizSel[selKey]; delete S.quizSel[selKey + ":retake"];
        saveProg(c.id, true);
      }
      $("#quiz-body").innerHTML = quizBody(c, n, qs, kind);
      if (act === "quiz-submit") $("#quiz-body").scrollIntoView({ block: "end" });
      break;
    }
    case "grade": grade(c, S.chapterN, +a.dataset.i); break;
    case "err-open": case "err-cancel": {
      const sec = a.dataset.sec;
      S.errOpen[`${c.id}:${sec}`] = act === "err-open";
      const el = document.getElementById("err-" + sec);
      if (el) el.outerHTML = errataBlock(c, S.chapterN, sec);
      if (act === "err-open") { const ta = document.getElementById("err-text-" + sec); if (ta) ta.focus(); }
      break;
    }
    case "err-submit": errSubmit(c, S.chapterN, a.dataset.sec); break;
    case "chat-send": chatSend(c, S.chapterN); break;
    case "chat-stop": ctls["chat:" + `${c.id}:${S.chapterN}`] && ctls["chat:" + `${c.id}:${S.chapterN}`].abort(); break;
    case "save-cert": saveFile(`${c.code.replace(/\s/g, "")}-certificate.svg`, certSVG(c, S.prog[c.id], S.profile.name), "#cert-status"); break;
    case "save-notes": saveFile(`${c.code.replace(/\s/g, "")}-notes.md`, notesMarkdown(c), "#notes-status"); break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches("tr.link")) { e.target.click(); return; }
  const d = e.target.closest && e.target.closest("[data-deck]");
  if (d && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    e.preventDefault();
    const b = d.querySelector(`[data-act="slide"][data-d="${e.key === "ArrowRight" ? 1 : -1}"]`);
    if (b && !b.disabled) b.click();
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "enroll") { e.preventDefault(); if (!S.busy.syllabus) draftSyllabus(); }
  if (e.target.id === "learn-form") { e.preventDefault(); const v = str($("#learn-in").value); if (v) { S.form.topic = v; go("newbook"); } else $("#learn-in").focus(); }
});
document.addEventListener("input", (e) => {
  const t = e.target, k = t.dataset && t.dataset.inp;
  if (!k) return;
  const c = S.courses.get(S.courseId), p = c && S.prog[c.id];
  if (["topic", "focus", "level", "length", "persona", "engine"].includes(k)) { S.form[k] = t.value; return; }
  if (k.startsWith("pf-")) {
    const f = k.slice(3);
    if (f === "pref") S.profile.prefs = [...document.querySelectorAll('[data-inp="pf-pref"]:checked')].map((x) => x.value);
    else S.profile[f] = t.value;
    const st = $("#pf-status"); if (st) st.textContent = "Saving…";
    saveProfile(); return;
  }
  if (k === "wx-in") {
    const id = t.dataset.wx, it = wxFind(id), st = S.wx[id];
    if (!it || !st) return;
    st[t.dataset.id] = +t.value;
    const inp = it.inputs.find((x) => x.id === t.dataset.id), vEl = document.getElementById(t.id + "-v");
    if (vEl && inp) vEl.textContent = `${fmtNum(+t.value, 4)} ${inp.unit}`;
    const out = document.getElementById(id + "-outs"); if (out) out.innerHTML = wxOutputs(id, it);
    return;
  }
  if (k === "fy" && p) { p.feynman = p.feynman || {}; const r = p.feynman[t.dataset.sec] = p.feynman[t.dataset.sec] || {}; r.text = t.value; saveProg(c.id); return; }
  if (k === "alt-pick") { S.altPick[`${c.id}:${t.dataset.sec}`] = t.value; return; }
  if (k === "au-rate" || k === "au-voice") {
    if (k === "au-rate") S.audio.rate = +t.value; else { S.audio.voice = t.value; LS.set("me/voice", t.value); }
    if (k === "au-rate" && S.audio.el && S.audio.el.dataset.src) { S.audio.el.playbackRate = S.audio.rate; return; }
    if (S.audio.playing) { const n = S.chapterN; auStop(); S.audio.playing = true; auSpeak(c, n); }
    return;
  }
  if (k === "note" && p) { p.notes[t.dataset.sec] = t.value; saveProg(c.id); }
  else if (k === "practice-text" && p) { const key = `${t.dataset.sec}#${t.dataset.i}`; p.practice[key] = { ...(p.practice[key] || {}), text: t.value }; saveProg(c.id); }
  else if (k === "challenge" && p) { const key = `${S.chapterN}#${t.dataset.i}`; p.challenge[key] = { ...(p.challenge[key] || {}), text: t.value }; saveProg(c.id); }
  else if (k === "chat") { const key = `${c.id}:${S.chapterN}`; S.chat[key] = S.chat[key] || { turns: [] }; S.chat[key].draft = t.value; }
  else if (k === "cert-name") {
    S.profile.name = t.value; $("#cert-svg").innerHTML = certSVG(c, p, t.value);
    saveProfile();
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.inp === "read") {
    const c = S.courses.get(S.courseId), p = S.prog[c.id];
    if (t.checked) { p.read[t.dataset.sec] = true; const chx = S.chapters[`${c.id}:${S.chapterN}`], sx = chx && chx.lesson && chx.lesson.sections.find((x) => x.n === t.dataset.sec); if (sx) Srs.add(termCards(c, sx)); } else delete p.read[t.dataset.sec];
    saveProg(c.id, true);
    const link = document.querySelector(`.rail a[href="#s-${CSS.escape(t.dataset.sec)}"]`);
    if (link) link.classList.toggle("done", t.checked);
  }
});
document.addEventListener("error", (e) => {
  const t = e.target;
  if (t && t.classList && t.classList.contains("fig-img")) {
    const plate = t.closest(".plate"); if (plate) plate.outerHTML = `<div class="empty">This figure could not be drawn. The caption below still describes it.</div>`;
  }
}, true);

/* ---------- boot ---------- */
render();
Store.init().catch(() => { S.catalogLoaded = true; onCoursesChanged(); });
})();
</script>
