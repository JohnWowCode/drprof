function sectionText(chap, s, o = {}) {
  const out = [`## Section ${s.n} ${s.title}`, ...s.reading.map((r) => (o.forAudio ? stripCites(r) : r))];
  if (!o.forAudio && arr(s.sources).length) out.push("Sources:\n" + s.sources.map((x) => `[S${s.n}-${x.n}] ${x.citation} (cited for: ${x.supports})`).join("\n"));
  if (s.keyTerms.length) out.push("Key terms:\n" + s.keyTerms.map((t) => `- ${t.term}: ${t.def}`).join("\n"));
  if (s.example.steps.length) out.push(`${s.example.title}\n${s.example.steps.map((x, i) => `${i + 1}. ${x}`).join("\n")}\nTakeaway: ${s.example.takeaway}`);
  if (s.misconception && s.misconception.myth) out.push(`Misconception. Myth: ${s.misconception.myth}\nFact: ${s.misconception.fact}`);
  if (!o.forAudio) s.practice.forEach((p, i) => out.push(p.type === "mc"
    ? `[P${s.n}-${i}] ${p.q}\n${mcText(p)}\n  Key: ${LETTERS[p.answer]}. Explanation: ${p.explanation}`
    : `[P${s.n}-${i}] (short answer) ${p.q}\n  Model answer: ${p.answer}\n  Explanation: ${p.explanation}`));
  arr(chap.figures).filter((f) => f.section === s.n).forEach((f) => out.push(`Figure for ${s.n}. Caption: ${f.caption}\n  Labels: ${svgLabels(f.svg).join(" | ")}`));
  return out.join("\n\n");
}
function chapterText(chap, o = {}) {
  const L = chap.lesson, A = chap.assess || {};
  const out = ["## Overview", L.overview, o.forAudio ? "" : "Objectives: " + L.objectives.join("; "), ...L.sections.map((s) => sectionText(chap, s, o))];
  const secIds = new Set(L.sections.map((s) => s.n));
  arr(chap.figures).filter((f) => !secIds.has(f.section)).forEach((f) => out.push(`Figure. Caption: ${f.caption}\n  Labels: ${svgLabels(f.svg).join(" | ")}`));
  if (!o.forAudio) {
    if (arr(A.slides).length) out.push("## Lecture slides\n" + A.slides.map((s, i) => `${i + 1}. ${s.title}: ${s.bullets.join(" / ")}\n   Notes: ${s.notes}`).join("\n"));
    if (arr(A.quiz).length) out.push("## Quiz\n" + A.quiz.map((q, i) => `[Q${i + 1}]${q.sec ? ` (section ${q.sec})` : ""} ${q.q}\n${mcText(q)}\n  Key: ${LETTERS[q.answer]}. Explanation: ${q.explanation}`).join("\n\n"));
    if (arr(A.challenge).length) out.push("## Challenge exercises\n" + A.challenge.map((x) => `${x.title}: ${x.prompt} Deliverable: ${x.deliverable} Rubric: ${x.rubric.join("; ")}`).join("\n"));
    if (arr(A.readings).length) out.push("## Readings\n" + A.readings.map((r, i) => `[R${i + 1}] ${r.citation} ${r.pages ? "(" + r.pages + ")" : ""}. Read it for: ${r.why}`).join("\n"));
  }
  return out.filter(Boolean).join("\n\n");
}
function proseOf(chap) {
  const L = chap.lesson, A = chap.assess || {};
  return [L.overview, ...L.sections.flatMap((s) => [...s.reading, ...s.example.steps, s.example.takeaway, s.misconception && s.misconception.myth, s.misconception && s.misconception.fact, ...s.practice.map((p) => p.explanation)]),
    ...arr(A.slides).flatMap((s) => [s.title, ...s.bullets, s.notes]), ...arr(A.quiz).map((q) => q.explanation)].filter(Boolean).join("\n");
}
function applyFix(scope, quote, correction) {
  if (!quote || quote === correction) return false;
  const xml = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let done = false;
  const walk = (o) => {
    if (done || !o || typeof o !== "object") return;
    for (const k of Object.keys(o)) {
      if (done) return;
      const v = o[k];
      if (typeof v === "string") {
        if (k === "svg") { const q = ">" + xml(quote) + "<"; if (v.includes(q)) { o[k] = v.replace(q, () => ">" + xml(correction) + "<"); done = true; } }
        else if (v.includes(quote)) { o[k] = v.replace(quote, () => correction); done = true; }
      } else walk(v);
    }
  };
  walk(scope);
  return done;
}
async function resolveKeys(c, items, blind, extra, signal) {
  const byId = {};
  arr(blind).forEach((b) => { byId[str(b.id)] = b; });
  const disputes = items.filter((it) => { const b = byId[it.id]; return !b || +b.answer !== it.ref.answer || str(b.problem) || extra[it.id]; })
    .map((it) => ({ ...it, blind: byId[it.id], extra: extra[it.id] }));
  const keyFixes = [];
  if (disputes.length) {
    const res = arr(await askJSON(PROMPTS.adjudicate(c, disputes), { signal, tier: "complex" }));
    for (const r of res) {
      const it = disputes.find((d) => d.id === str(r.id));
      if (!it) continue;
      const q = it.ref, before = LETTERS[q.answer];
      const rw = r.rewrite && typeof r.rewrite === "object" ? normMC(r.rewrite) : null;
      if (rw && rw.q) {
        q.q = rw.q; q.choices = rw.choices; q.answer = rw.answer; q.explanation = str(r.explanation) || q.explanation;
        keyFixes.push({ id: it.id, from: before, to: `${LETTERS[q.answer]} (question rewritten)`, why: str(r.explanation) });
      } else if (Number.isInteger(+r.answer) && +r.answer >= 0 && +r.answer < q.choices.length && +r.answer !== q.answer) {
        q.answer = +r.answer; q.explanation = str(r.explanation) || q.explanation;
        keyFixes.push({ id: it.id, from: before, to: LETTERS[q.answer], why: str(r.explanation) });
      }
    }
  }
  return { keysChecked: items.length, keysAgreed: items.length - disputes.length, keyFixes };
}
async function factCheck(c, n, chap, signal, onLen) {
  const items = keyItems(chap);
  const [fcRes, blind] = await Promise.all([
    askData(PROMPTS.factcheck(c, n, chap), { signal, tier: "complex", onLen }),
    items.length ? askJSON(PROMPTS.blindKeys(c, items), { signal, tier: "complex" }) : [],
  ]);
  const fc = fcRes.data || {};
  const extra = {};
  arr(fc.keys).forEach((k) => { if (str(k.id)) extra[str(k.id)] = str(k.problem) || "flagged"; });
  const kr = await resolveKeys(c, items, blind, extra, signal);
  const scope = { lesson: chap.lesson, figures: chap.figures, assess: chap.assess };
  const corrections = arr(fc.issues).map((i) => ({ where: str(i.where), before: str(i.quote), after: str(i.correction), why: str(i.problem), severity: str(i.severity) }))
    .filter((x) => x.before && x.after && x.before !== x.after);
  corrections.forEach((x) => { x.applied = applyFix(scope, x.before, x.after); });
  const srcVerdict = {};
  arr(fc.sources).forEach((s) => { srcVerdict[str(s.id)] = s; });
  let srcChecked = 0, srcWithdrawn = 0;
  chap.lesson.sections.forEach((s) => arr(s.sources).forEach((x) => {
    const v = srcVerdict[`S${s.n}-${x.n}`];
    if (!v) return;
    srcChecked++;
    delete x.checked; delete x.unverified; delete x.withdrawn;
    if (str(v.verdict) === "likely-invented") { x.withdrawn = true; srcWithdrawn++; }
    else if (str(v.verdict) === "uncertain" || str(v.supports) === "no") x.unverified = true;
    else if (str(v.verdict) === "real") x.checked = true;
  }));
  const removed = [];
  if (chap.assess) {
    const verdict = {};
    arr(fc.readings).forEach((r) => { verdict[str(r.id)] = str(r.verdict); });
    chap.assess.readings = chap.assess.readings.filter((r, i) => {
      const v = verdict["R" + (i + 1)];
      if (v === "likely-invented") { removed.push(r.citation); return false; }
      if (v === "uncertain") r.unverified = true; else if (v === "real") r.checked = true;
      return true;
    });
  }
  chap.review = { full: true, at: Date.now(), tier: fcRes.tier, by: null, ...kr, srcChecked, srcWithdrawn,
    corrections: [...arr(chap.review && chap.review.corrections), ...corrections], readingsRemoved: removed, summary: str(fc.summary), style: styleLint(proseOf(chap)) };
  chap.prov = { ...(chap.prov || {}), review: stamp(fcRes.tier) };
}
async function errSubmit(c, n, sec) {
  const ta = document.getElementById("err-text-" + sec);
  const text = str(ta && ta.value);
  if (!text) { if (ta) ta.focus(); return; }
  const chap = S.chapters[`${c.id}:${n}`];
  const s = chap.lesson.sections.find((x) => x.n === sec);
  const id = `e-${Date.now()}-${rand(4)}`;
  const e = { id, n, sec, text: text.slice(0, 4000), at: Date.now(), by: Store.uid || null, status: "checking" };
  S.errata[c.id] = [...arr(S.errata[c.id]), e];
  S.errOpen[`${c.id}:${sec}`] = false;
  const el = document.getElementById("err-" + sec); if (el) el.outerHTML = errataBlock(c, n, sec);
  const save = () => { const { id: _id, ...doc } = e; return Store.set(`courses/${c.id}/errata/${id}`, doc).catch(() => {}); };
  save();
  try {
    const res = await askJSON(PROMPTS.errata(c, chap, s, e.text), { tier: "complex" });
    e.status = ["error", "partly", "not-an-error"].includes(res.verdict) ? res.verdict : "partly";
    e.reply = str(res.reply);
    e.fixes = arr(res.fixes).map((f) => ({ quote: str(f.quote), correction: str(f.correction) })).filter((f) => f.quote && f.correction && f.quote !== f.correction);
    const scope = { lesson: chap.lesson, figures: chap.figures, assess: chap.assess };
    e.fixes.forEach((f) => { f.applied = applyFix(scope, f.quote, f.correction); });
    const applied = e.fixes.filter((f) => f.applied);
    if (applied.length) {
      chap.review = chap.review || { at: Date.now(), corrections: [] };
      chap.review.corrections = [...arr(chap.review.corrections), ...applied.map((f) => ({ where: `${sec} (learner report)`, before: f.quote, after: f.correction, why: e.reply, severity: "error", applied: true }))];
      await Store.set(chapterPath(c.id, n), chap);
    }
  } catch (err) { e.status = "failed"; e.reply = errCopy(err); }
  await save();
  if (S.view === "chapter" && S.courseId === c.id && S.chapterN === n) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}

async function writeFinal(c) {
  const k = "final:" + c.id;
  const ctl = new AbortController(); ctls[k] = ctl;
  S.busy[k] = true; S.gen[k + ":err"] = ""; render();
  const status = (t) => { S.gen[k] = t; const el = $("#main .status"); if (el) el.textContent = t; };
  try {
    const raw = await askJSON(PROMPTS.final(c), { signal: ctl.signal, onLen: (len) => status(`Writing: ${(len / 1000).toFixed(1)}k characters`) });
    const questions = arr(raw.questions).map(normMC).filter((q) => q && q.q);
    if (questions.length < 8) throw { code: "bad_shape" };
    status("Checking the answer key: every question re-solved blind…");
    const items = questions.map((q, i) => ({ id: `F${i + 1}`, ref: q }));
    const blind = await askJSON(PROMPTS.blindKeys(c, items), { signal: ctl.signal, tier: "complex" });
    const check = await resolveKeys(c, items, blind, {}, ctl.signal);
    const doc = { questions, at: Date.now(), check: { ...check, at: Date.now() } };
    await Store.set(finalPath(c.id), doc);
    S.finals[c.id] = doc;
  } catch (e) {
    S.gen[k + ":err"] = e && e.code ? errCopy(e) : saveErr(e);
  }
  S.busy[k] = false;
  if (S.view === "final") render();
}

async function grade(c, n, i) {
  const A = S.chapters[`${c.id}:${n}`].assess, x = A.challenge[i];
  const p = S.prog[c.id], k = `${n}#${i}`, rec = p.challenge[k] = p.challenge[k] || {};
  const box = () => $("#cx-" + i);
  if (!str(rec.text)) { rec.err = "Write your submission first."; box().innerHTML = challenge(c, n, i, x); return; }
  const bk = "grade:" + c.id + ":" + k;
  S.busy[bk] = true; rec.err = ""; box().innerHTML = challenge(c, n, i, x);
  try {
    const g = await askJSON(PROMPTS.grade(c, x, rec.text.slice(0, 20000)));
    const score = Math.max(0, Math.min(100, Math.round(Number(g.score) || 0)));
    rec.grade = { score, verdict: str(g.verdict), next: str(g.next), rubric: arr(g.rubric).map((r) => ({ criterion: str(r.criterion), met: str(r.met).toLowerCase(), comment: str(r.comment) })), at: Date.now() };
    saveProg(c.id, true);
  } catch (e) { rec.err = errCopy(e); }
  S.busy[bk] = false;
  if (box()) box().innerHTML = challenge(c, n, i, x);
}

async function chatSend(c, n) {
  const key = `${c.id}:${n}`;
  const ch = S.chat[key] = S.chat[key] || { turns: [] };
  const q = str($("#chat-in") && $("#chat-in").value);
  if (!q || ch.busy) return;
  const sample = await caps.sample;
  const paint = () => { const el = $("#chat"); if (el) el.innerHTML = chatBody(key); };
  if (!sample) { ch.err = errCopy({ code: "unavailable_here" }); paint(); return; }
  const chap = S.chapters[key], L = chap.lesson;
  const text = L.sections.map((s) => `${s.n} ${s.title}\n${s.reading.join("\n")}`).join("\n\n").slice(0, 24000);
  const rules = `${preamble(c)}

You are holding office hours for Chapter ${n}: "${c.chapters[n - 1].title}". Answer the student's question directly at the ${lvl(c.level).name} level, in one to four short paragraphs separated by blank lines. Use the chapter text below as the shared reference, and say so when you go beyond it. If the student is mistaken, say so and explain. Plain text; **bold** allowed.
Learner profile: ${profileText()}

CHAPTER TEXT
${text}`;
  ch.turns.push({ role: "user", content: q }, { role: "assistant", content: "" });
  ch.draft = ""; ch.err = ""; ch.busy = true; paint();
  const ctl = new AbortController(); ctls["chat:" + key] = ctl;
  const history = ch.turns.slice(0, -1).slice(-10);
  try {
    const { text: ans } = await sample([{ role: "user", content: rules }, ...history], {
      cache: false, signal: ctl.signal,
      onText: ({ text: t }) => { ch.turns[ch.turns.length - 1].content = t; const last = $("#chat .msg:last-of-type .body"); if (last) last.innerHTML = paras(t); },
    });
    ch.turns[ch.turns.length - 1].content = ans;
  } catch (e) {
    if (e && e.text) ch.turns[ch.turns.length - 1].content = e.text + "\n\n[Answer interrupted]";
    else ch.turns.pop();
    if (!e || e.code !== "cancelled") ch.err = errCopy(e);
  }
  ch.busy = false; paint();
}

async function saveFile(filename, data, statusSel) {
  const st = $(statusSel);
  const dl = await caps.downloads;
  if (!dl) { if (st) st.textContent = "Saving files is not available in this view."; return; }
  try { await dl.save({ filename, data }); if (st) st.textContent = "Saved."; }
  catch (e) { if (st) st.textContent = e && e.code === "declined" ? "" : "The file could not be saved."; }
}

function notesMarkdown(c) {
  const p = S.prog[c.id];
  let out = `# ${c.code} — ${c.title}\n\nNotes exported ${new Date().toISOString().slice(0, 10)}\n`;
  c.chapters.forEach((ch, i) => {
    const n = i + 1; let block = "";
    ch.sections.forEach((s, j) => { const t = p.notes[`${n}.${j + 1}`]; if (t && t.trim()) block += `\n### ${n}.${j + 1} ${s.title}\n\n${t.trim()}\n`; });
    Object.entries(p.challenge).filter(([k, v]) => k.startsWith(n + "#") && v.text).forEach(([k, v]) => { block += `\n### Challenge ${k.replace("#", ".")}${v.grade ? ` (graded ${v.grade.score}/100)` : ""}\n\n${v.text.trim()}\n`; });
    if (block) out += `\n## Chapter ${n}. ${ch.title}\n${block}`;
  });
  return out;
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  const c = S.courses.get(S.courseId);
  if (a.tagName === "A") e.preventDefault();
  switch (act) {
    case "go-catalog": go("catalog"); break;
    case "go-transcript": go("transcript"); break;
    case "open-course": go("course", a.dataset.id); break;
    case "open-chapter": go("chapter", S.courseId, +a.dataset.n, a.dataset.anchor || null); break;
    case "open-glossary": go("glossary", S.courseId); break;
    case "open-biblio": go("biblio", S.courseId); break;
    case "go-profile": go("profile"); break;
    case "draw-cover": writeCover(c); break;
    case "alt-explain": altExplain(c, S.chapterN, a.dataset.sec); break;
    case "coach-write": coachWrite(c); break;
    case "coach-alt": { const sec = a.dataset.sec; go("chapter", S.courseId, +sec.split(".")[0], "alt-" + sec); break; }
    case "rv-pick": { const i = +a.dataset.i, it = S.prog[c.id].review.sheet.items[i]; S.rvPick[i] = +a.dataset.j; $("#rv-" + i).innerHTML = reviewCheck(i, it.check); break; }
    case "au-play": auToggle(c, S.chapterN); break;
    case "au-skip": auMove(c, S.chapterN, (i) => i + +a.dataset.d); break;
    case "au-jump": auMove(c, S.chapterN, +a.dataset.i); break;
    case "au-prepare": writeAudio(c, S.chapterN); break;
    case "open-final": go("final", S.courseId); break;
    case "open-cert": go("cert", S.courseId); break;
    case "open-notebook": go("notebook", S.courseId); break;
    case "quick": S.form.topic = a.dataset.v; $("#f-topic").value = a.dataset.v; $("#f-topic").focus(); break;
    case "stop": ctls[a.dataset.k] && ctls[a.dataset.k].abort(); break;
    case "write-chapter": writeChapter(c, +a.dataset.n); break;
    case "write-final": writeFinal(c); break;
    case "slide": {
      const key = `${c.id}:${S.chapterN}`, A = S.chapters[key].assess;
      S.slide[key] = Math.max(0, Math.min(A.slides.length - 1, (S.slide[key] || 0) + +a.dataset.d));
      $("#deck").innerHTML = deck(c, S.chapterN, A); $("#deck .deck").focus(); break;
    }
    case "practice-mc": case "practice-reveal": case "practice-reset": {
      const sec = a.dataset.sec, i = +a.dataset.i, p = S.prog[c.id], k = `${sec}#${i}`;
      const pr = S.chapters[`${c.id}:${S.chapterN}`].lesson.sections.find((s) => s.n === sec).practice[i];
      if (act === "practice-mc") p.practice[k] = { choice: +a.dataset.j, correct: +a.dataset.j === pr.answer };
      else if (act === "practice-reveal") p.practice[k] = { ...(p.practice[k] || {}), revealed: true };
      else delete p.practice[k];
      saveProg(c.id);
      $(`#pp-${CSS.escape(sec)}-${i}`).innerHTML = practice(c, sec, i, pr); break;
    }
    case "quiz-pick": case "quiz-submit": case "quiz-retake": {
      const kind = a.dataset.kind, n = kind === "quiz" ? S.chapterN : 0;
      const qs = kind === "quiz" ? S.chapters[`${c.id}:${n}`].assess.quiz : S.finals[c.id].questions;
      const selKey = `${c.id}:${kind}:${n}`, p = S.prog[c.id];
      if (act === "quiz-pick") { const s = S.quizSel[selKey] = S.quizSel[selKey] || []; s[+a.dataset.i] = +a.dataset.j; }
      else if (act === "quiz-retake") { S.quizSel[selKey] = []; S.quizSel[selKey + ":retake"] = true; }
      else {
        const sel = S.quizSel[selKey] || [];
        const right = qs.filter((q, i) => sel[i] === q.answer).length;
        const rec = { answers: qs.map((_, i) => sel[i] ?? null), score: right / qs.length, at: Date.now(), items: qs.map((q, i) => ({ sec: q.sec || null, ok: sel[i] === q.answer })) };
        if (kind === "quiz") p.quiz[n] = rec; else p.final = rec;
        delete S.quizSel[selKey]; delete S.quizSel[selKey + ":retake"];
        saveProg(c.id, true);
      }
      $("#quiz-body").innerHTML = quizBody(c, n, qs, kind);
      if (act === "quiz-submit") $("#quiz-body").scrollIntoView({ block: "end" });
      break;
    }
    case "grade": grade(c, S.chapterN, +a.dataset.i); break;
    case "err-open": case "err-cancel": {
      const sec = a.dataset.sec;
      S.errOpen[`${c.id}:${sec}`] = act === "err-open";
      const el = document.getElementById("err-" + sec);
      if (el) el.outerHTML = errataBlock(c, S.chapterN, sec);
      if (act === "err-open") { const ta = document.getElementById("err-text-" + sec); if (ta) ta.focus(); }
      break;
    }
    case "err-submit": errSubmit(c, S.chapterN, a.dataset.sec); break;
    case "chat-send": chatSend(c, S.chapterN); break;
    case "chat-stop": ctls["chat:" + `${c.id}:${S.chapterN}`] && ctls["chat:" + `${c.id}:${S.chapterN}`].abort(); break;
    case "save-cert": saveFile(`${c.code.replace(/\s/g, "")}-certificate.svg`, certSVG(c, S.prog[c.id], S.profile.name), "#cert-status"); break;
    case "save-notes": saveFile(`${c.code.replace(/\s/g, "")}-notes.md`, notesMarkdown(c), "#notes-status"); break;
  }
});

  if (e.key === "Enter" && e.target.matches("tr.link")) { e.target.click(); return; }
  const d = e.target.closest && e.target.closest("[data-deck]");
  if (d && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    e.preventDefault();
    const b = d.querySelector(`[data-act="slide"][data-d="${e.key === "ArrowRight" ? 1 : -1}"]`);
    if (b && !b.disabled) b.click();
  }
});
document.addEventListener("submit", (e) => { if (e.target.id === "enroll") { e.preventDefault(); if (!S.busy.syllabus) draftSyllabus(); } });
document.addEventListener("input", (e) => {
  const t = e.target, k = t.dataset && t.dataset.inp;
  if (!k) return;
  const c = S.courses.get(S.courseId), p = c && S.prog[c.id];
  if (["topic", "focus", "level", "length", "persona", "engine"].includes(k)) { S.form[k] = t.value; return; }
  if (k.startsWith("pf-")) {
    const f = k.slice(3);
    if (f === "pref") S.profile.prefs = [...document.querySelectorAll('[data-inp="pf-pref"]:checked')].map((x) => x.value);
    else S.profile[f] = t.value;
    const st = $("#pf-status"); if (st) st.textContent = "Saving…";
    saveProfile(); return;
  }
  if (k === "alt-pick") { S.altPick[`${c.id}:${t.dataset.sec}`] = t.value; return; }
  if (k === "au-rate" || k === "au-voice") {
    if (k === "au-rate") S.audio.rate = +t.value; else { S.audio.voice = t.value; LS.set("me/voice", t.value); }
    if (S.audio.playing) { const n = S.chapterN; auStop(); S.audio.playing = true; auSpeak(c, n); }
    return;
  }
  if (k === "note" && p) { p.notes[t.dataset.sec] = t.value; saveProg(c.id); }
  else if (k === "practice-text" && p) { const key = `${t.dataset.sec}#${t.dataset.i}`; p.practice[key] = { ...(p.practice[key] || {}), text: t.value }; saveProg(c.id); }
  else if (k === "challenge" && p) { const key = `${S.chapterN}#${t.dataset.i}`; p.challenge[key] = { ...(p.challenge[key] || {}), text: t.value }; saveProg(c.id); }
  else if (k === "chat") { const key = `${c.id}:${S.chapterN}`; S.chat[key] = S.chat[key] || { turns: [] }; S.chat[key].draft = t.value; }
  else if (k === "cert-name") {
    S.profile.name = t.value; $("#cert-svg").innerHTML = certSVG(c, p, t.value);
    saveProfile();
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.inp === "read") {
    const c = S.courses.get(S.courseId), p = S.prog[c.id];
    if (t.checked) p.read[t.dataset.sec] = true; else delete p.read[t.dataset.sec];
    saveProg(c.id, true);
    const link = document.querySelector(`.rail a[href="#s-${CSS.escape(t.dataset.sec)}"]`);
    if (link) link.classList.toggle("done", t.checked);
  }
});
document.addEventListener("error", (e) => {
  const t = e.target;
  if (t && t.classList && t.classList.contains("fig-img")) {
    const plate = t.closest(".plate"); if (plate) plate.outerHTML = `<div class="empty">This figure could not be drawn. The caption below still describes it.</div>`;
  }
}, true);

/* ---------- boot ---------- */
render();
Store.init().catch(() => { S.catalogLoaded = true; onCoursesChanged(); });
})();
</script>
