<title>Dr. Professor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Caslon+Display&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: a reading room. A warm desk (paper by day, walnut and lamplight after hours), books standing on wooden shelves, and each chapter laid out as a page on the desk with a contents rail beside it. */
:root {
  --paper: #ECE4D3;
  --sheet: #F8F3E7;
  --card: #FBF7EE;
  --ink: #2A221B;
  --muted: #6E6152;
  --rule: #DACDB4;
  --rule-strong: #B19F80;
  --accent: #24503E;
  --accent-soft: #DCE5D6;
  --brass: #A07A3A;
  --gilt: #E6C67D;
  --wood: #6A4429;
  --wood-dark: #3E2617;
  --glow: rgba(255, 210, 130, 0.42);
  --ok: #2F6B3A;
  --warn: #8A5A12;
  --bad: #8E2F2B;
  --stamp: #8E2F2B;
  --mark: #F5E1A0;
  --subj: #24503E;
  --c-terms: #2F5D7C; --c-example: #3B6B45; --c-practice: #94641A; --c-myth: #8E2F2B; --c-check: #5E4B8B;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .22 0 0 0 0 .12 0 0 0 .09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --f-display: "Libre Caslon Display", "Libre Caslon Text", "Big Caslon", "Baskerville", Georgia, serif;
  --f-read: "Literata", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-ui: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Courier Prime", "Courier New", Courier, ui-monospace, monospace;
  --s-xs: 0.78rem; --s-sm: 0.875rem; --s-base: 1rem; --s-read: 1.0625rem; --s-h3: 1.15rem; --s-h2: 1.7rem; --s-h1: 2.35rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1B1612; --sheet: #241D17; --card: #2A221B; --ink: #EDE3D0; --muted: #B4A68F; --rule: #3B3128; --rule-strong: #5E4F3F;
    --accent: #9CC7A8; --accent-soft: #24332B; --brass: #D2AC68; --gilt: #E6C67D; --wood: #4B2F1C; --wood-dark: #24160C; --glow: rgba(255, 186, 100, 0.16);
    --ok: #8CCB98; --warn: #E3B85E; --bad: #E6948C; --stamp: #E6948C; --mark: #4A3B1A;
    --c-terms: #8DB7D8; --c-example: #8CCB98; --c-practice: #E3B85E; --c-myth: #E6948C; --c-check: #BFAEE6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1B1612; --sheet: #241D17; --card: #2A221B; --ink: #EDE3D0; --muted: #B4A68F; --rule: #3B3128; --rule-strong: #5E4F3F;
  --accent: #9CC7A8; --accent-soft: #24332B; --brass: #D2AC68; --gilt: #E6C67D; --wood: #4B2F1C; --wood-dark: #24160C; --glow: rgba(255, 186, 100, 0.16);
  --ok: #8CCB98; --warn: #E3B85E; --bad: #E6948C; --stamp: #E6948C; --mark: #4A3B1A;
  --c-terms: #8DB7D8; --c-example: #8CCB98; --c-practice: #E3B85E; --c-myth: #E6948C; --c-check: #BFAEE6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background-color: var(--paper); background-image: radial-gradient(ellipse 90% 420px at 50% 0, var(--glow), transparent 75%), var(--grain); color: var(--ink); font-family: var(--f-ui); font-size: var(--s-base); line-height: 1.5; }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: 0.9em; background: var(--accent-soft); padding: 0 0.25em; }

/* Registrar bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 3px double var(--brass); }
.bar-in { max-width: 1180px; margin: 0 auto; padding-inline: 16px; display: flex; align-items: center; gap: 16px; min-height: 48px; flex-wrap: wrap; }
.mark { font-family: var(--f-display); font-size: 1.45rem; color: var(--ink); text-decoration: none; display: flex; gap: 12px; align-items: baseline; }
.mark small { font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.14em; color: var(--brass); text-transform: uppercase; }
.nav { margin-left: auto; display: flex; gap: 4px; }
.nav button { background: none; border: 0; padding: 6px 10px; cursor: pointer; font-size: var(--s-sm); color: var(--muted); }
.nav button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.crumbs { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; font-size: var(--s-sm); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 80px; }
.col { max-width: 760px; }
.stack { display: grid; gap: 28px; }
.stack-sm { display: grid; gap: 12px; }

.eyebrow { font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--s-h1); line-height: 1.12; }
.h2 { font-family: var(--f-display); font-weight: 400; font-size: var(--s-h2); line-height: 1.2; }
.h3 { font-family: var(--f-ui); font-weight: 600; font-size: var(--s-h3); }
.sec-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 6px; }
.sec-head .eyebrow { margin-left: auto; }
.muted { color: var(--muted); }
.small { font-size: var(--s-sm); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.prose { font-family: var(--f-read); font-size: var(--s-read); line-height: 1.65; max-width: 68ch; display: grid; gap: 0.9em; }
.prose strong { font-weight: 600; }
.lede { font-family: var(--f-read); font-size: 1.125rem; line-height: 1.6; max-width: 68ch; }

/* Forms */
.sheet { background: var(--sheet); border: 1px solid var(--rule); padding: 20px; }
.field { display: grid; gap: 6px; }
.field > label, .legend { font-size: var(--s-sm); font-weight: 600; }
.input, textarea.input { width: 100%; border: 1px solid var(--rule-strong); background: var(--sheet); padding: 8px 10px; border-radius: 2px; }
textarea.input { min-height: 84px; resize: vertical; line-height: 1.5; }
.levels { display: grid; border: 1px solid var(--rule-strong); }
.levels label { display: grid; grid-template-columns: auto 7rem 64px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--rule); cursor: pointer; }
.levels label:first-child { border-top: 0; }
.levels label:has(input:checked) { background: var(--accent-soft); }
.levels .lv-name { font-weight: 600; }
@media (max-width: 560px) { .levels label { grid-template-columns: auto 1fr; } .levels .lv-desc { grid-column: 2; } .levels .meter { display: none; } }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule-strong); background: var(--sheet); padding: 3px 10px; border-radius: 2px; cursor: pointer; font-size: var(--s-sm); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--sheet); padding: 8px 14px; border-radius: 2px; cursor: pointer; font-weight: 500; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { padding: 4px 10px; font-size: var(--s-sm); }
.radio-row { display: flex; flex-wrap: wrap; gap: 14px; }
.radio-row label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.status { font-size: var(--s-sm); color: var(--muted); min-height: 1.5em; }
.status.err { color: var(--bad); }

/* Level meter: six cells, filled to the level */
.meter { display: inline-flex; gap: 2px; vertical-align: middle; }
.meter i { width: 8px; height: 8px; border: 1px solid var(--rule-strong); }
.meter i.on { background: var(--accent); border-color: var(--accent); }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--sheet); }
table { border-collapse: collapse; width: 100%; font-size: var(--s-sm); }
th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
thead th { border-top: 0; font-weight: 600; font-size: var(--s-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--paper); white-space: nowrap; }
tr.link { cursor: pointer; }
tr.link:hover td { background: var(--accent-soft); }
td.code { font-family: var(--f-mono); white-space: nowrap; }
.pill { display: inline-block; font-size: var(--s-xs); padding: 1px 6px; border: 1px solid var(--rule-strong); border-radius: 2px; white-space: nowrap; color: var(--muted); }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.acc { color: var(--accent); border-color: var(--accent); }

.meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: var(--s-sm); }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; }
ol.obj, ul.plain { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }

/* Chapter layout */
.ch-grid { display: grid; grid-template-columns: 1fr; gap: 32px; }
@media (min-width: 1040px) { .ch-grid { grid-template-columns: 210px minmax(0, 1fr); } }
.rail { display: none; }
@media (min-width: 1040px) { .rail { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); align-self: start; max-height: calc(100vh - 90px); overflow: auto; font-size: var(--s-sm); } }
.rail ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.rail a { color: var(--ink); text-decoration: none; display: block; padding: 3px 0 3px 8px; border-left: 2px solid var(--rule); }
.rail a:hover { border-left-color: var(--accent); color: var(--accent); }
.rail a.done::after { content: " ✓"; color: var(--ok); }
.ch-main { min-width: 0; display: grid; gap: 40px; }
section.unit { display: grid; gap: 16px; scroll-margin-top: 72px; }
@media (max-width: 560px) { .mark small { display: none; } .bar-in { flex-wrap: nowrap; } }

figure.fig { margin: 0; display: grid; gap: 8px; }
.plate { background: #FFFFFF; border: 1px solid var(--rule); padding: 8px; max-width: 100%; }
.plate img { display: block; width: 100%; height: auto; }
figcaption { font-size: var(--s-sm); color: var(--muted); max-width: 68ch; }
figcaption b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }

dl.terms { margin: 0; display: grid; grid-template-columns: minmax(8rem, max-content) 1fr; border-top: 1px solid var(--rule); font-size: var(--s-sm); }
dl.terms dt, dl.terms dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--rule); }
dl.terms dt { font-weight: 600; padding-right: 16px; }
@media (max-width: 520px) { dl.terms { grid-template-columns: 1fr; } dl.terms dt { border-bottom: 0; padding-bottom: 0; } }

.box { border: 1px solid var(--rule-strong); background: var(--sheet); padding: 14px 16px; display: grid; gap: 10px; }
.box-title { font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-family: var(--f-read); font-size: var(--s-read); line-height: 1.55; }

.prob { display: grid; gap: 8px; padding: 12px 0; border-top: 1px dashed var(--rule-strong); }
.prob:first-of-type { border-top: 0; padding-top: 0; }
.prob .q { font-family: var(--f-read); font-size: var(--s-read); }
.choices { display: grid; gap: 4px; }
.choice { text-align: left; border: 1px solid var(--rule); background: var(--sheet); padding: 6px 10px; cursor: pointer; border-radius: 2px; display: flex; gap: 8px; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; }
.choice .k { font-family: var(--f-mono); color: var(--muted); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.right { border-color: var(--ok); }
.choice.right .k { color: var(--ok); }
.choice.wrong { border-color: var(--bad); }
.choice.wrong .k { color: var(--bad); }
.verdict { font-size: var(--s-sm); }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.expl { font-size: var(--s-sm); border-left: 2px solid var(--rule-strong); padding-left: 10px; }

.notes textarea { background: var(--mark); border-color: var(--rule-strong); font-family: var(--f-read); }
.check { display: flex; gap: 8px; align-items: center; font-size: var(--s-sm); cursor: pointer; }

/* Lecture deck */
.deck { display: grid; gap: 10px; max-width: 820px; }
.slide { aspect-ratio: 16 / 9; max-width: 100%; background: var(--sheet); border: 1px solid var(--rule-strong); padding: clamp(14px, 4%, 36px); display: grid; grid-template-rows: auto 1fr auto; gap: 12px; overflow: hidden; }
.slide h3 { font-family: var(--f-read); font-weight: 600; font-size: clamp(1.05rem, 2.6vw, 1.6rem); border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.slide ul { margin: 0; padding-left: 1.2em; display: grid; gap: 0.35em; align-content: start; font-size: clamp(0.8rem, 1.7vw, 1.05rem); overflow: auto; }
.slide .foot { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: var(--s-xs); color: var(--muted); }
.deck-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.deck-notes { font-size: var(--s-sm); color: var(--muted); max-width: 68ch; }

/* Office hours */
.chat { display: grid; gap: 10px; }
.msg { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--rule); background: var(--sheet); }
.msg.me { background: var(--accent-soft); border-color: transparent; }
.msg .who { font-family: var(--f-mono); font-size: var(--s-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.msg .body { font-family: var(--f-read); font-size: var(--s-base); line-height: 1.6; display: grid; gap: 0.6em; }

.gen-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--s-sm); }
.gen-list li { display: flex; gap: 10px; }
.gen-list .st { font-family: var(--f-mono); width: 6.5rem; flex: none; }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--rule-strong); padding-top: 14px; }

/* Certificate */
.cert-wrap { overflow-x: auto; }
.cert-wrap svg { width: 100%; max-width: 900px; height: auto; display: block; border: 1px solid var(--rule); }

.empty { border: 1px dashed var(--rule-strong); padding: 20px; color: var(--muted); font-size: var(--s-sm); }
.two { display: grid; gap: 28px; }
@media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }

/* Subject color: set per course on <main> as --subj; derived tints follow the theme */
main { --subj-ink: color-mix(in srgb, var(--subj) 62%, var(--ink)); --subj-soft: color-mix(in srgb, var(--subj) 10%, var(--sheet)); }
.prose strong { color: var(--subj-ink); }
figcaption b { color: var(--subj-ink); }
.swatch { display: inline-block; width: 10px; height: 10px; background: var(--sw); vertical-align: middle; margin-right: 6px; }

.opener { background: var(--subj); color: #FFFFFF; padding: clamp(18px, 4vw, 32px); display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; align-items: end; }
.opener .eyebrow { color: rgba(255, 255, 255, 0.82); grid-column: 1 / -1; }
.opener .big { font-family: var(--f-read); font-weight: 600; font-size: clamp(3.2rem, 9vw, 5.5rem); line-height: 0.9; }
.opener .h1 { color: #FFFFFF; }
.opener .sub { grid-column: 1 / -1; font-size: var(--s-sm); color: rgba(255, 255, 255, 0.88); display: flex; flex-wrap: wrap; gap: 4px 18px; }
.opener .meter i { border-color: rgba(255, 255, 255, 0.7); }
.opener .meter i.on { background: #FFFFFF; border-color: #FFFFFF; }
.cover { background: var(--subj); color: #FFFFFF; padding: clamp(18px, 4vw, 32px); display: grid; gap: 10px; }
.cover .eyebrow { color: rgba(255, 255, 255, 0.82); }
.cover .h1 { color: #FFFFFF; }
.cover .meter i { border-color: rgba(255, 255, 255, 0.7); }
.cover .meter i.on { background: #FFFFFF; border-color: #FFFFFF; }

/* Color-coded textbook boxes */
.cbox { --k: var(--subj); border: 1px solid var(--k); background: color-mix(in srgb, var(--k) 6%, var(--sheet)); }
.cbox > .cbox-h { background: var(--k); color: var(--sheet); font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 14px; display: flex; justify-content: space-between; gap: 10px; }
.cbox > .cbox-b { padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.k-terms { --k: var(--c-terms); } .k-example { --k: var(--c-example); } .k-practice { --k: var(--c-practice); }
.k-myth { --k: var(--c-myth); } .k-check { --k: var(--c-check); } .k-subj { --k: var(--subj); }
.myth { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-family: var(--f-read); font-size: var(--s-read); line-height: 1.55; }
.myth b { font-family: var(--f-ui); font-size: var(--s-sm); color: var(--c-myth); }
.myth b.fact { color: var(--ok); }
dl.terms dt { color: var(--c-terms); }

.slide { border-color: var(--subj); }
.slide h3 { background: var(--subj); color: #FFFFFF; border-bottom: 0; margin: calc(-1 * clamp(14px, 4%, 36px)) calc(-1 * clamp(14px, 4%, 36px)) 0; padding: clamp(10px, 2.5%, 22px) clamp(14px, 4%, 36px); }
.slide ul li::marker { color: var(--subj-ink); }

.bar-meter { height: 8px; background: var(--rule); position: relative; overflow: hidden; max-width: 320px; }
.bar-meter > span { position: absolute; inset: 0 auto 0 0; background: var(--bw, var(--subj)); }
details.report summary { cursor: pointer; font-size: var(--s-sm); font-weight: 600; }
.fix-before { text-decoration: line-through; color: var(--bad); }
.fix-after { color: var(--ok); }
.errata { font-size: var(--s-sm); display: grid; gap: 8px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: var(--s-sm); }

/* Books: covers, shelf and title page */
.book { position: relative; aspect-ratio: 2 / 3; width: 100%; color: #FFFFFF; display: grid; grid-template-rows: auto auto 1fr auto auto; padding: 9% 9% 7% 13%; overflow: hidden; text-align: left;
  background: linear-gradient(155deg, color-mix(in srgb, var(--subj) 82%, #FFFFFF) 0%, var(--subj) 42%, color-mix(in srgb, var(--subj) 72%, #000000) 100%);
  box-shadow: inset 7px 0 0 rgba(0, 0, 0, 0.22), inset 9px 0 0 rgba(255, 255, 255, 0.14), 0 1px 2px rgba(0, 0, 0, 0.25), 0 10px 22px rgba(0, 0, 0, 0.18);
  border-radius: 2px 5px 5px 2px; transition: transform 0.15s; }
.book-top { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: 0.6em; letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.55); padding-bottom: 0.5em; }
.book-title { font-family: var(--f-read); font-weight: 600; font-size: 1.3em; line-height: 1.1; margin-top: 0.75em; text-wrap: balance; }
.book-title small { display: block; font-weight: 400; font-size: 0.6em; line-height: 1.25; margin-top: 0.4em; opacity: 0.92; }
.book .cover-art { width: 80%; max-height: 100%; justify-self: center; align-self: center; aspect-ratio: 1; object-fit: contain; }
.cover-pattern { background: repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.2) 0 1px, transparent 1px 11px); border-radius: 50%; }
.book-author { font-family: var(--f-read); font-size: 0.82em; line-height: 1.25; }
.book-author span { font-style: italic; opacity: 0.9; }
.book-pub { font-family: var(--f-mono); font-size: 0.52em; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; border-top: 1px solid rgba(255, 255, 255, 0.45); padding-top: 0.55em; margin-top: 0.6em; }
.book.sm { font-size: 13px; }
.book.lg { font-size: 21px; max-width: 300px; }
@media (max-width: 560px) { .book.lg { font-size: 16px; max-width: 230px; } }

/* ---------- normalizers ---------- */
const normMC = (q) => {
  const choices = arr(q.choices).map(str).filter(Boolean);
  const answer = Number.isInteger(+q.answer) ? +q.answer : 0;
  return choices.length >= 2 && answer >= 0 && answer < choices.length
    ? { q: str(q.q), choices, answer, explanation: str(q.explanation), ch: q.ch ? +q.ch : undefined, sec: str(q.sec) || undefined } : null;
};
const normSources = (list) => arr(list).map((x, i) => ({ n: Number.isInteger(+x.n) && +x.n > 0 ? +x.n : i + 1, citation: str(x.citation), kind: str(x.kind), supports: str(x.supports) })).filter((x) => x.citation);
function normLesson(raw, c, n) {
  const ch = c.chapters[n - 1];
  const got = arr(raw && raw.sections);
  const sections = ch.sections.map((s, j) => {
    const r = got.find((x) => str(x.n) === `${n}.${j + 1}`) || got[j] || {};
    const ex = r.example || {};
    return {
      n: `${n}.${j + 1}`, title: s.title,
      reading: arr(r.reading).map(str).filter(Boolean),
      sources: normSources(r.sources),
      keyTerms: arr(r.keyTerms).map((t) => ({ term: str(t.term), def: str(t.def) })).filter((t) => t.term),
      example: { title: str(ex.title), steps: arr(ex.steps).map(str).filter(Boolean), takeaway: str(ex.takeaway) },
      misconception: { myth: str((r.misconception || {}).myth), fact: str((r.misconception || {}).fact) },
      practice: arr(r.practice).map((p) => p.type === "short" ? { type: "short", q: str(p.q), answer: str(p.answer), explanation: str(p.explanation) } : (normMC(p) && { type: "mc", ...normMC(p) })).filter((p) => p && p.q),
    };
  });
  if (!sections.some((s) => s.reading.length)) throw { code: "bad_shape" };
  return { overview: str(raw.overview), objectives: arr(raw.objectives).map(str).filter(Boolean), sections };
}
function normFigures(raw) {
  const list = arr(raw).map((f) => ({ section: str(f.section), caption: str(f.caption), svg: str(f.svg) })).filter((f) => /^<svg[\s>]/i.test(f.svg));
  if (!list.length) throw { code: "bad_shape" };

}
function normAssess(raw) {
  const r = raw || {};
  const out = {
    slides: arr(r.slides).map((s) => ({ title: str(s.title), bullets: arr(s.bullets).map(str).filter(Boolean), notes: str(s.notes) })).filter((s) => s.title),
    quiz: arr(r.quiz).map(normMC).filter((q) => q && q.q),
    challenge: arr(r.challenge).map((x) => ({ title: str(x.title), prompt: str(x.prompt), deliverable: str(x.deliverable), rubric: arr(x.rubric).map(str).filter(Boolean) })).filter((x) => x.prompt),
    readings: arr(r.readings).map((x) => ({ citation: str(x.citation), kind: str(x.kind), why: str(x.why), pages: str(x.pages) })).filter((x) => x.citation),
    videos: arr(r.videos).map((x) => ({ search: str(x.search), why: str(x.why) })).filter((x) => x.search),
    images: arr(r.images).map((x) => ({ search: str(x.search), source: str(x.source).toLowerCase(), why: str(x.why) })).filter((x) => x.search),
  };
  if (!out.quiz.length || !out.slides.length) throw { code: "bad_shape" };

function go(view, courseId = null, chapterN = null, anchor = null) {
  if (S.audio.playing && (view !== "chapter" || chapterN !== S.chapterN)) auStop();
  S.view = view; S.courseId = courseId; S.chapterN = chapterN; S.pendingAnchor = anchor;
  window.scrollTo(0, 0);
  render();
}
function onCoursesChanged() {
  if (S.view === "catalog") { const el = $("#catalog-list"); if (el) el.innerHTML = catalogList(); else render(); loadAllProg(); }
  else if (S.view === "course" || S.view === "transcript") render();
  else if (!$("#main").dataset.view) render();
}
let allProgLoading = false;
async function loadAllProg() {
  if (allProgLoading) return;
  const missing = [...S.courses.keys()].filter((id) => !S.prog[id]);
  if (!missing.length) return;
  allProgLoading = true;
  await Promise.all(missing.map(loadProg));
  allProgLoading = false;
  if (S.view === "catalog") { const el = $("#catalog-list"); if (el) el.innerHTML = catalogList(); }
  if (S.view === "transcript") render();
}

/* ---------- derived ---------- */
function chapterState(c, p, n) {
  const written = !!(c.written && c.written[n]);
  const q = p && p.quiz && p.quiz[n];
  const total = c.chapters[n - 1].sections.length;
  const read = c.chapters[n - 1].sections.filter((_, j) => p && p.read[`${n}.${j + 1}`]).length;
  if (q && q.score >= PASS_QUIZ) return { label: `Passed ${pct(q.score)}`, cls: "ok", written, passed: true, read, total };
  if (q) return { label: `Quiz ${pct(q.score)}, retake`, cls: "warn", written, passed: false, read, total };
  if (read) return { label: `Reading ${read}/${total}`, cls: "acc", written, passed: false, read, total };
  if (written) return { label: "Written", cls: "", written, passed: false, read, total };
  return { label: "Not yet written", cls: "", written, passed: false, read, total };
}
function courseSummary(c, p) {
  const n = c.chapters.length;
  const passed = c.chapters.filter((_, i) => chapterState(c, p, i + 1).passed).length;
  return { n, passed, final: p && p.final, cert: p && p.cert };
}

/* ---------- views ---------- */
function render() {
  const main = $("#main");
  main.dataset.view = S.view;
  $("#nav-catalog").toggleAttribute("aria-current", S.view === "catalog");
  if (S.view === "catalog") $("#nav-catalog").setAttribute("aria-current", "page");
  $("#nav-transcript").toggleAttribute("aria-current", S.view === "transcript");
  if (S.view === "transcript") $("#nav-transcript").setAttribute("aria-current", "page");
  $("#nav-profile").toggleAttribute("aria-current", S.view === "profile");
  if (S.view === "profile") $("#nav-profile").setAttribute("aria-current", "page");
  const c = S.courses.get(S.courseId);
  if (c && !["catalog", "transcript", "profile"].includes(S.view)) main.style.setProperty("--subj", subj(c)); else main.style.removeProperty("--subj");
  const crumbs = [];
  if (!["catalog", "transcript", "profile"].includes(S.view)) crumbs.push(`<button type="button" data-act="go-catalog">Catalog</button>`);
  if (c && S.view !== "course") crumbs.push(`<span>/</span><button type="button" data-act="open-course" data-id="${esc(c.id)}">${esc(c.code)}</button>`);
  $("#crumbs").innerHTML = crumbs.join("");
  if (S.view === "catalog") main.innerHTML = viewCatalog();

  else if (S.view === "final") main.innerHTML = viewFinal(c);
  else if (S.view === "cert") main.innerHTML = viewCert(c);
  else if (S.view === "notebook") main.innerHTML = viewNotebook(c);
  else if (S.view === "glossary") main.innerHTML = viewGlossary(c);

}

function needNames(ids) {
  const miss = [...new Set(ids.filter((id) => id && !(id in S.names)))];
  if (!miss.length) return;
  miss.forEach((id) => { S.names[id] = null; });
  caps.user.then((u) => (u && u.profiles ? u.profiles(miss) : {})).catch(() => ({})).then((res) => {
    miss.forEach((id) => { S.names[id] = (res && res[id]) || { name: "" }; });
    document.querySelectorAll("[data-uid]").forEach((el) => { const n = S.names[el.dataset.uid]; if (n) el.textContent = n.name || "a reader"; });
  });
}
const who = (id) => `<span data-uid="${esc(id)}">${esc((S.names[id] && S.names[id].name) || (S.names[id] ? "a reader" : "…"))}</span>`;
const engineName = (t) => ENGINES[t] || "Standard";

/* ----- study coach: mastery from practice and quizzes, then a personal review sheet ----- */
const secTitle = (c, sec) => { const [a, b] = String(sec).split(".").map(Number); const ch = c.chapters[a - 1]; return ch && ch.sections[b - 1] ? ch.sections[b - 1].title : ""; };
const secCmp = (a, b) => { const [x1, y1] = a.split(".").map(Number), [x2, y2] = b.split(".").map(Number); return x1 - x2 || y1 - y2; };
function mastery(p) {
  const m = {};
  const add = (sec, ok) => { if (!sec) return; const r = m[sec] = m[sec] || { right: 0, total: 0 }; r.total++; if (ok) r.right++; };
  if (!p) return m;
  Object.entries(p.practice).forEach(([k, v]) => { if (v && v.choice != null) add(k.split("#")[0], v.correct); });
  Object.values(p.quiz).forEach((q) => arr(q.items).forEach((it) => add(it.sec, it.ok)));
  return m;
}
function coachBox(c, p) {
  if (!p) return "";
  const m = mastery(p), secs = Object.keys(m).sort(secCmp);
  const weak = secs.filter((s) => m[s].right / m[s].total < 0.7);
  const busy = S.busy["coach:" + c.id];
  const body = !secs.length
    ? `<p class="small muted">Answer practice problems and chapter quizzes. The coach then shows which sections you have mastered, which need work, and writes you a personal review sheet built around your mistakes.</p>`
    : `<div class="tbl-wrap"><table><thead><tr><th>Section</th><th>Accuracy</th><th></th></tr></thead><tbody>${secs.map((s) => {
        const r = m[s], acc = r.right / r.total, ok = acc >= 0.7;
        return `<tr><td><span class="num" style="color:var(--subj-ink)">${esc(s)}</span> ${esc(secTitle(c, s))}</td>
          <td style="min-width:150px"><div class="bar-meter"><span style="width:${pct(acc)};--bw:${ok ? "var(--ok)" : "var(--warn)"}"></span></div><span class="small num">${r.right}/${r.total} correct</span></td>
          <td>${ok ? `<span class="pill ok">Solid</span>` : `<button class="btn ghost sm" data-act="coach-alt" data-sec="${esc(s)}">Explain it differently</button>`}</td></tr>`;
      }).join("")}</tbody></table></div>
      <div class="row">${busy ? `<button class="btn ghost" data-act="stop" data-k="coach:${esc(c.id)}">Stop</button><span class="status">Writing your review sheet…</span>` : `<button class="btn" data-act="coach-write" ${weak.length ? "" : "disabled"}>${p.review ? "Write a new review sheet" : "Write my review sheet"}</button><span class="small muted">${weak.length ? `${weak.length} section${weak.length === 1 ? "" : "s"} below 70%.` : "Nothing below 70% right now."}</span>`}</div>
      ${S.gen["coach:" + c.id] ? `<p class="status err">${esc(S.gen["coach:" + c.id])}</p>` : ""}`;
  return `<section class="cbox k-subj" id="coach"><div class="cbox-h"><span>Study coach</span><span>Private to you</span></div><div class="cbox-b">${body}${p.review ? reviewSheet(c, p) : ""}</div></section>`;
}
function reviewSheet(c, p) {
  const r = p.review, sh = r.sheet || {};
  return `<div class="stack-sm" style="margin-top:8px"><div class="h3">Your review sheet</div>
    <p class="small muted">Written ${esc(date(r.at))} by Dr. Professor as ${esc(persona(r.persona).name)}, using your study profile and your missed questions.</p>
    ${sh.intro ? `<p>${fmt(sh.intro)}</p>` : ""}
    ${arr(sh.items).map((it, i) => `<div class="cbox k-practice"><div class="cbox-h"><span>Review ${esc(it.sec)} · ${esc(it.title)}</span></div><div class="cbox-b">
      <div class="prose">${paras(it.explain)}</div>
      ${it.whyTempting ? `<p class="small"><strong>Why your answer was tempting.</strong> ${fmt(it.whyTempting)}</p>` : ""}
      ${it.example ? `<p class="small"><strong>Example.</strong> ${fmt(it.example)}</p>` : ""}
      ${it.check ? `<div class="prob" id="rv-${i}">${reviewCheck(i, it.check)}</div>` : ""}</div></div>`).join("")}
    ${arr(sh.plan).length ? `<div class="cbox k-example"><div class="cbox-h"><span>Plan for your next session</span></div><div class="cbox-b"><ol class="obj">${sh.plan.map((x) => `<li>${fmt(x)}</li>`).join("")}</ol></div></div>` : ""}</div>`;
}
function reviewCheck(i, q) {
  const pick = S.rvPick[i], done = pick != null;
  return `<div class="q"><strong>Check.</strong> ${fmt(q.q)}</div><div class="choices">${q.choices.map((ch, j) => `<button class="choice ${done ? (j === q.answer ? "right" : j === pick ? "wrong" : "") : ""}" data-act="rv-pick" data-i="${i}" data-j="${j}" ${done ? "disabled" : ""}><span class="k">${LETTERS[j]}</span><span>${fmt(ch)}</span></button>`).join("")}</div>
    ${done ? `<div class="verdict ${pick === q.answer ? "ok" : "bad"}">${pick === q.answer ? "Correct." : `The answer is ${LETTERS[q.answer]}.`}</div>${q.explanation ? `<div class="expl">${fmt(q.explanation)}</div>` : ""}` : ""}`;
}

/* ----- back matter ----- */
async function loadChapters(c) {
  await Promise.all(c.chapters.map((_, i) => {
    const n = i + 1, key = `${c.id}:${n}`;
    if (S.chapters[key] !== undefined || !(c.written && c.written[n])) return null;
    return Store.get(chapterPath(c.id, n)).then((d) => { S.chapters[key] = d; });
  }));
}
function withChapters(c, view) {
  if (S.loadedAll[c.id]) return true;
  loadChapters(c).then(() => { S.loadedAll[c.id] = true; if (S.view === view && S.courseId === c.id) render(); });
  return false;
}
function writtenChapters(c) {
  return c.chapters.map((_, i) => ({ n: i + 1, d: S.chapters[`${c.id}:${i + 1}`] })).filter((x) => x.d && x.d.lesson);
}
function viewGlossary(c) {
  if (!withChapters(c, "glossary")) return `<p class="muted">Collecting terms…</p>`;
  const terms = [];
  writtenChapters(c).forEach(({ n, d }) => d.lesson.sections.forEach((s) => s.keyTerms.forEach((t) => terms.push({ ...t, sec: s.n, n }))));
  terms.sort((a, b) => a.term.localeCompare(b.term, undefined, { sensitivity: "base" }));
  const groups = {};
  terms.forEach((t) => { const L = t.term[0].toUpperCase(); (groups[L] = groups[L] || []).push(t); });
  return `<div class="stack col"><div class="stack-sm"><div class="eyebrow">${esc(c.code)} · Back matter</div><h1 class="h1">Glossary</h1>
    <p class="small muted">${terms.length} terms from ${writtenChapters(c).length} written chapter${writtenChapters(c).length === 1 ? "" : "s"}. The glossary grows as more chapters are written.</p></div>
    ${terms.length ? Object.entries(groups).map(([L, list]) => `<div class="stack-sm"><div class="sec-head"><h2 class="h2" style="color:var(--subj-ink)">${esc(L)}</h2></div>
      <dl class="terms">${list.map((t) => `<dt>${esc(t.term)}</dt><dd>${fmt(t.def)} <button class="linkbtn" data-act="open-chapter" data-n="${t.n}" data-anchor="s-${esc(t.sec)}">${esc(t.sec)}</button></dd>`).join("")}</dl></div>`).join("") : `<div class="empty">No chapters written yet.</div>`}</div>`;
}
function viewBiblio(c) {
  if (!withChapters(c, "biblio")) return `<p class="muted">Collecting sources…</p>`;
  const map = new Map();
  const add = (x, where, further) => {
    const k = x.citation.toLowerCase().replace(/\s+/g, " ").trim();
    const e = map.get(k) || { ...x, where: [], further: false };
    e.where.push(where); e.further = e.further || further;
    e.checked = e.checked || x.checked; e.unverified = e.unverified || x.unverified; e.withdrawn = e.withdrawn || x.withdrawn;
    map.set(k, e);
  };
  writtenChapters(c).forEach(({ n, d }) => {
    d.lesson.sections.forEach((s) => arr(s.sources).forEach((x) => add(x, s.n, false)));
    arr(d.assess && d.assess.readings).forEach((r) => add(r, `Ch. ${n} reading`, true));
  });
  const list = [...map.values()].sort((a, b) => a.citation.localeCompare(b.citation));
  const checked = list.filter((x) => x.checked).length;
  return `<div class="stack col" style="max-width:900px"><div class="stack-sm"><div class="eyebrow">${esc(c.code)} · Back matter</div><h1 class="h1">Bibliography</h1>
    <p class="small muted">${list.length} sources; ${checked} confirmed by fact-check. Sources policy: peer-reviewed journals, university-press and standard academic texts, and scientific agencies.</p></div>
    ${list.length ? `<ol class="refs biblio">${list.map((x) => `<li class="${x.withdrawn ? "withdrawn" : ""}">${esc(x.citation)}
      <div class="row" style="gap:6px;margin-top:3px">${x.withdrawn ? `<span class="pill warn">Withdrawn</span>` : x.checked ? `<span class="pill ok">Checked</span>` : x.unverified ? `<span class="pill warn">Unverified</span>` : ""}<span class="small muted">${x.further ? "Further reading" : "Cited"} in ${esc([...new Set(x.where)].join(", "))}</span><a class="small" href="${readingLink(x)}" target="_blank" rel="noopener">Find it ↗</a></div></li>`).join("")}</ol>` : `<div class="empty">No chapters written yet.</div>`}</div>`;
}

function reviewBox(r) {
  const corr = arr(r.corrections), applied = corr.filter((x) => x.applied), fixes = arr(r.keyFixes), removed = arr(r.readingsRemoved);

      ${r.keysChecked ? ` Answer keys re-solved blind: <strong class="num">${r.keysAgreed}/${r.keysChecked}</strong> agreed${fixes.length ? `, ${plural(fixes.length, "key")} corrected` : ""}.` : ""}
      ${r.srcChecked ? ` Sources checked: <strong class="num">${r.srcChecked - (r.srcWithdrawn || 0)}/${r.srcChecked}</strong> confirmed${r.srcWithdrawn ? `, ${r.srcWithdrawn} withdrawn` : ""}.` : ""}
      ${applied.length ? ` ${plural(applied.length, "correction")} applied to the text.` : " No text corrections were needed."}
      ${removed.length ? ` ${plural(removed.length, "unverifiable reading")} removed.` : ""}
      ${r.style ? (Object.keys(r.style).length ? ` Style check: ${esc(Object.entries(r.style).map(([w, k]) => `${w} ×${k}`).join(", "))} remaining.` : " Style check: no stock AI phrasing found.") : ""}</p>
    ${r.summary ? `<p class="small muted">${fmt(r.summary)}</p>` : ""}
    ${corr.length || fixes.length ? `<details class="report"><summary>Show every change</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Where</th><th>Change</th><th>Why</th></tr></thead><tbody>
      ${fixes.map((k) => `<tr><td>${esc(k.id)}</td><td>Answer key <span class="fix-before">${esc(k.from)}</span> → <span class="fix-after">${esc(k.to)}</span></td><td>${fmt(k.why)}</td></tr>`).join("")}
      ${corr.map((x) => `<tr><td>${esc(x.where)}${x.applied ? "" : ` <span class="pill warn">not applied</span>`}</td><td><span class="fix-before">${esc(x.before)}</span><br><span class="fix-after">${esc(x.after)}</span></td><td>${fmt(x.why)}</td></tr>`).join("")}
    </tbody></table></div></details>` : ""}
    <p class="small muted">The fact-check uses Claude's own knowledge, not a library lookup. It catches most errors, not all of them. If you spot one, use “Report an error” under the section.</p>
  </div></div>`;

function errataBlock(c, n, sec) {

  return `<div class="errata" id="err-${esc(sec)}">
    ${list.map((e) => `<div class="cbox k-myth"><div class="cbox-h"><span>Error report · ${esc(date(e.at))}</span><span>${esc(label[e.status] || e.status)}</span></div><div class="cbox-b">
      <p><strong>Reported:</strong> ${esc(e.text)}</p>
      ${e.reply ? `<p><strong>Dr. Professor:</strong> ${fmt(e.reply)}</p>` : ""}
      ${arr(e.fixes).filter((f) => f.applied).map((f) => `<p class="small"><span class="fix-before">${esc(f.quote)}</span> → <span class="fix-after">${esc(f.correction)}</span></p>`).join("")}
    </div></div>`).join("")}
    ${open ? `<div class="field"><label for="err-text-${esc(sec)}">What is wrong in section ${esc(sec)}?</label><textarea class="input" id="err-text-${esc(sec)}" maxlength="4000" placeholder="Quote the sentence and say what you think is wrong. A source helps."></textarea>
      <div class="row"><button class="btn sm" data-act="err-submit" data-sec="${esc(sec)}">Submit for checking</button><button class="btn ghost sm" data-act="err-cancel" data-sec="${esc(sec)}">Cancel</button></div></div>`
      : `<div><button class="linkbtn" data-act="err-open" data-sec="${esc(sec)}">Report an error in ${esc(sec)}</button></div>`}
  </div>`;
}

const cite = (html, sec) => html.replace(/\[(\d+(?:\s*[,–-]\s*\d+)*)\]/g, (m, g) => `<sup class="cite"><a href="#ref-${esc(sec)}-${g.match(/\d+/)[0]}" title="See source">[${g}]</a></sup>`);
function provLine(c, chap) {

  const bits = pv.note ? [esc(pv.note)] : [part("lesson", "Text and practice"), part("figures", "Figures"), part("assess", "Lecture and assessments"), part("review", "Fact-check"), part("audio", "Narrated edition")].filter(Boolean);

function refsBlock(s) {

    ${x.withdrawn ? `<span class="pill warn">Withdrawn by fact-check</span>` : x.checked ? `<span class="pill ok">Checked</span>` : x.unverified ? `<span class="pill warn">Unverified</span>` : ""}

function altBlock(c, n, s) {

  return `<div class="alt" id="alt-${esc(s.n)}">
    <div class="row alt-bar"><label class="small" for="altp-${esc(s.n)}">Explain ${esc(s.n)} differently, as</label>
      <select class="input sel" id="altp-${esc(s.n)}" data-inp="alt-pick" data-sec="${esc(s.n)}">${PERSONAS.map((P) => `<option value="${P.id}" ${P.id === cur ? "selected" : ""}>${esc(P.name)}</option>`).join("")}</select>
      ${busy ? `<button class="btn ghost sm" data-act="stop" data-k="alt:${esc(key)}">Stop</button>` : `<button class="btn ghost sm" data-act="alt-explain" data-sec="${esc(s.n)}">${a ? "Explain it again" : "Explain it"}</button>`}</div>
    ${a ? `<div class="cbox k-subj"><div class="cbox-h"><span>Your tutor: ${esc(persona(a.persona).name)} on ${esc(s.n)}</span><span>Private to you</span></div><div class="cbox-b"><div class="prose alt-text">${a.text ? paras(a.text) : "<p class='muted'>Thinking…</p>"}</div>${a.err ? `<p class="status err">${esc(a.err)}</p>` : ""}</div></div>` : ""}
  </div>`;
}

function readingLink(r) {
  const doi = String(r.citation).match(/https:\/\/doi\.org\/[^\s]+/), url = String(r.citation).match(/https?:\/\/[^\s)]+/);
  if (doi) return doi[0].replace(/[.,]$/, "");
  if (url) return url[0].replace(/[.,]$/, "");
  const q = encodeURIComponent(r.citation);
  if (r.kind === "book" || r.kind === "chapter") return "https://www.worldcat.org/search?q=" + q;
  if (r.kind === "website") return "https://duckduckgo.com/?q=" + q;
  return "https://scholar.google.com/scholar?q=" + q;
}
function pager(c, n) {
  const prev = n > 1 ? `<button class="btn ghost sm" data-act="open-chapter" data-n="${n - 1}">← Ch. ${n - 1}: ${esc(c.chapters[n - 2].title)}</button>` : `<button class="btn ghost sm" data-act="open-course" data-id="${esc(c.id)}">← Syllabus</button>`;
  const next = n < c.chapters.length ? `<button class="btn ghost sm" data-act="open-chapter" data-n="${n + 1}">Ch. ${n + 1}: ${esc(c.chapters[n].title)} →</button>` : `<button class="btn ghost sm" data-act="open-final">Final examination →</button>`;
  return `<div class="pager">${prev}${next}</div>`;
}

function genBox(c, n, chap) {
  const key = `${c.id}:${n}`, g = S.gen[key];
  const parts = [["lesson", "Textbook text, worked examples, misconceptions and practice"], ["figures", "Color figures"], ["assess", "Lecture slides, quiz, challenges and study list"], ["review", "Fact-check: claims, figure labels and citations; every answer key re-solved blind"]];
  const has = (k) => chap && (k === "review" ? chap.review && chap.review.full : chap[k]);
  const running = g && g.running;
  const st = (k) => {
    if (has(k)) return `<span class="st" style="color:var(--ok)">Done</span>`;
    const s = g && g.parts[k];
    if (!s) return `<span class="st muted">Waiting</span>`;
    if (s.state === "wait") return `<span class="st muted">Queued</span>`;
    if (s.state === "run") return `<span class="st">${s.len ? `${(s.len / 1000).toFixed(1)}k chars` : "Thinking…"}</span>`;
    if (s.state === "err") return `<span class="st" style="color:var(--bad)">Failed</span>`;
    return `<span class="st" style="color:var(--ok)">Done</span>`;
  };
  const errs = g ? Object.values(g.parts).filter((s) => s.state === "err").map((s) => s.msg) : [];
  const onlyReview = chap && chap.lesson && chap.figures && chap.assess;
  const title = !(chap && chap.lesson) ? "This chapter has not been written yet" : onlyReview ? "This chapter has not been fact-checked yet" : "Parts of this chapter are not written yet";
  const btn = !(chap && chap.lesson) ? `Write chapter ${n}` : onlyReview ? "Run the fact-check" : "Write the missing parts";
  return `<div class="h3">${title}</div>
    <p class="small muted">Dr. Professor writes the chapter in three parts at once. A second, more careful pass then fact-checks it and corrects what it finds before you rely on it. This uses your Claude account and usually takes three to six minutes. The finished chapter is saved to the shared library, so it is only written once.</p>
    <ul class="gen-list">${parts.map(([k, label]) => `<li>${st(k)}<span>${label}</span></li>`).join("")}</ul>
    ${errs.length ? `<p class="status err">${esc([...new Set(errs)].join(" "))}</p>` : ""}
    <div class="row">${running ? `<button class="btn ghost" data-act="stop" data-k="${esc(key)}">Stop</button>` : `<button class="btn" data-act="write-chapter" data-n="${n}">${btn}</button>`}</div>`;
}

function deck(c, n, A) {
  const key = `${c.id}:${n}`;
  const i = Math.min(S.slide[key] || 0, A.slides.length - 1);
  const s = A.slides[i];
  return `<div class="deck" tabindex="0" data-deck="${esc(key)}" aria-roledescription="slide deck" aria-label="Lecture slides">
    <div class="slide"><h3>${esc(s.title)}</h3><ul>${s.bullets.map((b) => `<li>${fmt(b)}</li>`).join("")}</ul>
      <div class="foot"><span>${esc(c.code)} · Ch. ${n}</span><span>${i + 1} / ${A.slides.length}</span></div></div>
    <div class="deck-ctl"><button class="btn ghost sm" data-act="slide" data-d="-1" ${i === 0 ? "disabled" : ""}>← Previous</button><button class="btn ghost sm" data-act="slide" data-d="1" ${i === A.slides.length - 1 ? "disabled" : ""}>Next →</button><span class="small muted">Arrow keys work when the deck is focused.</span></div>
    ${s.notes ? `<p class="deck-notes"><strong>Lecturer's notes.</strong> ${fmt(s.notes)}</p>` : ""}</div>`;
}

function practice(c, sec, i, pr) {
  const p = S.prog[c.id], k = `${sec}#${i}`, rec = p.practice[k];
  const num = `<span class="num muted">${i + 1}.</span> `;
  if (pr.type === "mc") {
    const done = rec && rec.choice != null;
    return `<div class="q">${num}${fmt(pr.q)}</div><div class="choices">${pr.choices.map((ch, j) => {
      const cls = done ? (j === pr.answer ? "right" : j === rec.choice ? "wrong" : "") : "";
      return `<button class="choice ${cls}" data-act="practice-mc" data-sec="${esc(sec)}" data-i="${i}" data-j="${j}" ${done ? "disabled" : ""}><span class="k">${LETTERS[j]}</span><span>${fmt(ch)}</span></button>`;
    }).join("")}</div>
    ${done ? `<div class="verdict ${rec.choice === pr.answer ? "ok" : "bad"}">${rec.choice === pr.answer ? "Correct." : `Not quite. The answer is ${LETTERS[pr.answer]}.`}</div>${pr.explanation ? `<div class="expl">${fmt(pr.explanation)}</div>` : ""}<div><button class="btn ghost sm" data-act="practice-reset" data-sec="${esc(sec)}" data-i="${i}">Try again</button></div>` : ""}`;
  }
  const shown = rec && rec.revealed;
  return `<div class="q">${num}${fmt(pr.q)}</div>
    <textarea class="input" id="pa-${esc(sec)}-${i}" data-inp="practice-text" data-sec="${esc(sec)}" data-i="${i}" placeholder="Write your answer before checking.">${esc((rec && rec.text) || "")}</textarea>
    ${shown ? `<div class="expl"><strong>Model answer.</strong> ${fmt(pr.answer)}${pr.explanation ? `<br><span class="muted">${fmt(pr.explanation)}</span>` : ""}</div>` : `<div><button class="btn ghost sm" data-act="practice-reveal" data-sec="${esc(sec)}" data-i="${i}">Check against the model answer</button></div>`}`;
}

function quizBody(c, n, qs, kind) {
  const p = S.prog[c.id];
  const rec = kind === "quiz" ? p.quiz[n] : p.final;
  const selKey = `${c.id}:${kind}:${n}`;
  const sel = S.quizSel[selKey] || [];
  const done = !!rec && !S.quizSel[selKey + ":retake"];
  const pass = kind === "quiz" ? PASS_QUIZ : PASS_FINAL;
  const items = qs.map((q, i) => {
    const pick = done ? rec.answers[i] : sel[i];
    return `<div class="prob"><div class="q"><span class="num muted">${i + 1}.</span> ${q.ch ? `<span class="pill">Ch. ${q.ch}</span> ` : ""}${fmt(q.q)}</div><div class="choices">${q.choices.map((ch, j) => {
      const cls = done ? (j === q.answer ? "right" : j === pick ? "wrong" : "") : (j === pick ? "sel" : "");
      return `<button class="choice ${cls}" data-act="quiz-pick" data-kind="${kind}" data-i="${i}" data-j="${j}" ${done ? "disabled" : ""} aria-pressed="${j === pick}"><span class="k">${LETTERS[j]}</span><span>${fmt(ch)}</span></button>`;
    }).join("")}</div>${done && q.explanation ? `<div class="expl">${fmt(q.explanation)}</div>` : ""}</div>`;
  }).join("");
  const answered = sel.filter((x) => x != null).length;
  const foot = done
    ? `<div class="box"><div class="h3">Score: <span class="num">${pct(rec.score)}</span> <span class="pill ${rec.score >= pass ? "ok" : "warn"}">${rec.score >= pass ? "Passed" : "Not passed"}</span></div>
       <div class="bar-meter" role="img" aria-label="Score ${pct(rec.score)}"><span style="width:${pct(rec.score)};--bw:${rec.score >= pass ? "var(--ok)" : "var(--warn)"}"></span></div>
       <p class="small muted">Taken ${esc(date(rec.at))}. ${rec.score >= pass ? "" : `You need ${pct(pass)}. Review the explanations, then retake.`}</p>
       <div class="row"><button class="btn ghost sm" data-act="quiz-retake" data-kind="${kind}">Retake</button>${kind === "final" && rec.score >= pass ? `<button class="btn sm" data-act="open-cert">View certificate</button>` : ""}</div></div>`
    : `<div class="row"><button class="btn" data-act="quiz-submit" data-kind="${kind}" ${answered < qs.length ? "disabled" : ""}>Submit answers</button><span class="small muted num">${answered}/${qs.length} answered</span></div>`;
  return `<div class="box">${items}</div>${foot}`;
}

function challenge(c, n, i, x) {
  const p = S.prog[c.id], k = `${n}#${i}`, rec = p.challenge[k] || {};
  const busy = S.busy["grade:" + c.id + ":" + k];
  const gr = rec.grade;
  return `<div class="box-title">Exercise ${n}.${String.fromCharCode(65 + i)}</div>
    <div class="h3">${esc(x.title)}</div>
    <div class="prose">${paras(x.prompt)}</div>
    <p class="small"><strong>Submit:</strong> ${fmt(x.deliverable)}</p>
    ${x.rubric.length ? `<div class="small"><strong>Graded on:</strong><ul class="plain">${x.rubric.map((r) => `<li>${fmt(r)}</li>`).join("")}</ul></div>` : ""}
    <textarea class="input" id="cx-text-${n}-${i}" data-inp="challenge" data-i="${i}" style="min-height:140px" placeholder="Your submission">${esc(rec.text || "")}</textarea>
    <div class="row"><button class="btn sm" data-act="grade" data-i="${i}" ${busy ? "disabled" : ""}>${busy ? "Grading…" : gr ? "Resubmit for grading" : "Submit for grading"}</button><span class="status ${rec.err ? "err" : ""}">${esc(rec.err || "")}</span></div>
    ${gr ? `<div class="box" style="background:var(--paper)"><div class="h3">Grade: <span class="num">${esc(gr.score)}</span>/100</div><p>${fmt(gr.verdict)}</p>
      <div class="tbl-wrap"><table><thead><tr><th>Criterion</th><th>Met</th><th>Comment</th></tr></thead><tbody>${arr(gr.rubric).map((r) => `<tr><td>${fmt(r.criterion)}</td><td><span class="pill ${r.met === "yes" ? "ok" : r.met === "partly" ? "warn" : ""}">${esc(r.met)}</span></td><td>${fmt(r.comment)}</td></tr>`).join("")}</tbody></table></div>
      ${gr.next ? `<p class="small"><strong>Next step.</strong> ${fmt(gr.next)}</p>` : ""}</div>` : ""}`;
}

function chatBody(key) {
  const ch = S.chat[key] || { turns: [], busy: false };
  return `<div class="chat">
    ${ch.turns.length ? "" : `<p class="small muted">Ask about anything in this chapter: a step you did not follow, a practice answer you disagree with, how this connects to something else. Answers use your Claude account.</p>`}
    ${ch.turns.map((t) => `<div class="msg ${t.role === "user" ? "me" : ""}"><div class="who">${t.role === "user" ? "You" : "Dr. Professor"}</div><div class="body">${t.content ? paras(t.content) : "<p class='muted'>Thinking…</p>"}</div></div>`).join("")}
    ${ch.err ? `<p class="status err">${esc(ch.err)}</p>` : ""}
    <div class="field"><label for="chat-in">Your question</label><textarea class="input" id="chat-in" data-inp="chat" placeholder="Why does…">${esc(ch.draft || "")}</textarea></div>
    <div class="row">${ch.busy ? `<button class="btn ghost" data-act="chat-stop">Stop</button>` : `<button class="btn" data-act="chat-send">Ask</button>`}</div></div>`;
}

/* ----- final / cert / notebook / transcript ----- */
function viewFinal(c) {
  const ex = S.finals[c.id], p = S.prog[c.id];
  if (ex === undefined || !p) {
    Promise.all([ex === undefined ? Store.get(finalPath(c.id)).then((d) => { S.finals[c.id] = d; }) : null, loadProg(c.id)])
      .then(() => { if (S.view === "final" && S.courseId === c.id) render(); });
    return `<p class="muted">Opening the examination…</p>`;
  }
  const head = `<div class="stack-sm"><div class="eyebrow">${esc(c.code)} · Final examination</div><h1 class="h1">${esc(c.title)}</h1>
    <p class="lede">16 questions drawn from every chapter. ${pct(PASS_FINAL)} passes. Passing issues your certificate; it says "coursework and examination" if every chapter quiz is also passed, and "credit by examination" otherwise.</p></div>`;
  if (!ex) {
    const busy = S.busy["final:" + c.id];
    return `<div class="stack col">${head}<div class="sheet stack-sm"><div class="h3">The examination has not been written yet</div>
      <p class="small muted">It is written once from the syllabus and shared by everyone taking this course. About a minute.</p>
      <div class="row">${busy ? `<button class="btn ghost" data-act="stop" data-k="final:${esc(c.id)}">Stop</button>` : `<button class="btn" data-act="write-final">Write the final examination</button>`}<span class="status ${S.gen["final:" + c.id + ":err"] ? "err" : ""}">${esc(busy ? S.gen["final:" + c.id] || "Thinking…" : S.gen["final:" + c.id + ":err"] || "")}</span></div></div></div>`;
  }
  const ck = ex.check;
  const ckLine = ck ? `<div class="cbox k-check"><div class="cbox-h"><span>Answer key check</span><span>${esc(date(ck.at))}</span></div><div class="cbox-b"><p class="small">Every question was re-solved blind by a second Claude pass: <strong class="num">${ck.keysAgreed}/${ck.keysChecked}</strong> agreed with the key${arr(ck.keyFixes).length ? `; ${ck.keyFixes.length} disputed key${ck.keyFixes.length === 1 ? " was" : "s were"} re-examined and corrected` : ""}.</p></div></div>` : "";
  return `<div class="stack col">${head}${ckLine}<div id="quiz-body">${quizBody(c, 0, ex.questions, "final")}</div></div>`;
}

function certInfo(c, p) {
  if (!p || !p.final || p.final.score < PASS_FINAL) return null;
  const allPassed = c.chapters.every((_, i) => chapterState(c, p, i + 1).passed);
  return { basis: allPassed ? "Coursework and final examination" : "Credit by examination", score: p.final.score };
}
function certSVG(c, p, name) {
  const info = certInfo(c, p), L = lvl(c.level);
  const no = (c.code.replace(/\s/g, "") + "-" + (p.cert ? p.cert.no : "")).toUpperCase();
  const e = (s) => esc(s);
  const title = c.title.length > 64 ? c.title.slice(0, 61) + "…" : c.title;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-label="Certificate">
  <rect width="1100" height="780" fill="#FFFFFF"/>
  <rect x="28" y="28" width="1044" height="724" fill="none" stroke="#24503E" stroke-width="3"/>
  <rect x="40" y="40" width="1020" height="700" fill="none" stroke="#24503E" stroke-width="1"/>
  <text x="550" y="120" text-anchor="middle" font-family="Courier Prime, Courier, monospace" font-size="18" letter-spacing="6" fill="#A07A3A">DR. PROFESSOR</text>
  <text x="550" y="190" text-anchor="middle" font-family="Literata, Georgia, serif" font-size="50" fill="#15191D" style="font-family:'Libre Caslon Display', Georgia, serif">Certificate of Completion</text>
  <text x="550" y="250" text-anchor="middle" font-family="Literata, Georgia, serif" font-size="20" font-style="italic" fill="#59626B">This certifies that</text>
  <text x="550" y="320" text-anchor="middle" font-family="Literata, Georgia, serif" font-size="44" fill="#15191D">${e(name || "Name not entered")}</text>
  <line x1="260" y1="340" x2="840" y2="340" stroke="#A3ACB4"/>
  <text x="550" y="390" text-anchor="middle" font-family="Literata, Georgia, serif" font-size="20" font-style="italic" fill="#59626B">has satisfied the requirements of</text>
  <text x="550" y="440" text-anchor="middle" font-family="Literata, Georgia, serif" font-size="28" fill="#15191D">${e(c.code)} · ${e(title)}</text>
  <text x="550" y="482" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" fill="#15191D">${e(L.name)} level · ${c.chapters.length} chapters · approximately ${e(c.hours || "—")} study hours</text>
  <text x="550" y="520" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="16" fill="#59626B">Basis: ${e(info ? info.basis : "—")} · Final examination ${info ? pct(info.score) : "—"}</text>
  <line x1="140" y1="640" x2="440" y2="640" stroke="#15191D"/>
  <text x="290" y="666" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="15" fill="#59626B">Dr. Professor, instructor of record</text>
  <line x1="660" y1="640" x2="960" y2="640" stroke="#15191D"/>
  <text x="810" y="630" text-anchor="middle" font-family="Courier Prime, Courier, monospace" font-size="17" fill="#15191D">${e(date(p.cert ? p.cert.at : Date.now()))}</text>
  <text x="810" y="666" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="15" fill="#59626B">Date issued</text>
  <text x="550" y="716" text-anchor="middle" font-family="Courier Prime, Courier, monospace" font-size="13" fill="#59626B">Certificate no. ${e(no)}</text>
</svg>`;
}
function viewCert(c) {
  const p = S.prog[c.id];
  if (!p) { loadProg(c.id).then(() => S.view === "cert" && render()); return `<p class="muted">Opening…</p>`; }
  const info = certInfo(c, p);
  if (!info) return `<div class="stack col"><div class="stack-sm"><div class="eyebrow">${esc(c.code)} · Certificate</div><h1 class="h1">Not earned yet</h1></div>
    <p class="lede">Pass the final examination (${pct(PASS_FINAL)}) to earn the certificate for ${esc(c.title)}.</p>
    <div class="row"><button class="btn" data-act="open-final">Go to the final examination</button></div></div>`;
  if (!p.cert) { p.cert = { at: Date.now(), no: rand(6) }; saveProg(c.id, true); }
  return `<div class="stack"><div class="stack-sm col"><div class="eyebrow">${esc(c.code)} · Certificate</div><h1 class="h1">Certificate of completion</h1>
    <div class="field" style="max-width:420px"><label for="cert-name">Name to print on the certificate</label><input class="input" id="cert-name" data-inp="cert-name" maxlength="80" value="${esc(S.profile.name || "")}" placeholder="Your full name"></div></div>
    <div class="cert-wrap" id="cert-svg">${certSVG(c, p, S.profile.name)}</div>
    <div class="row"><button class="btn" data-act="save-cert" id="save-cert-btn">Save certificate (.svg)</button><span class="status" id="cert-status"></span></div></div>`;
}

function viewNotebook(c) {
  const p = S.prog[c.id];
  if (!p) { loadProg(c.id).then(() => S.view === "notebook" && render()); return `<p class="muted">Opening…</p>`; }
  const rows = [];
  c.chapters.forEach((ch, i) => {
    const n = i + 1;
    const secs = ch.sections.map((s, j) => ({ sec: `${n}.${j + 1}`, title: s.title, note: p.notes[`${n}.${j + 1}`] })).filter((x) => x.note && x.note.trim());
    const cx = Object.entries(p.challenge).filter(([k, v]) => k.startsWith(n + "#") && v.text);
    if (secs.length || cx.length) rows.push(`<div class="stack-sm"><div class="sec-head"><h2 class="h3">Chapter ${n}. ${esc(ch.title)}</h2></div>
      ${secs.map((x) => `<div><div class="small"><span class="num muted">${x.sec}</span> <strong>${esc(x.title)}</strong></div><div class="prose">${paras(x.note)}</div></div>`).join("")}
      ${cx.map(([k, v]) => `<div><div class="small"><strong>Challenge ${esc(k.replace("#", "."))}</strong>${v.grade ? ` · graded ${esc(v.grade.score)}/100` : ""}</div><div class="prose">${paras(v.text)}</div></div>`).join("")}</div>`);
  });
  return `<div class="stack col"><div class="stack-sm"><div class="eyebrow">${esc(c.code)} · Notebook</div><h1 class="h1">Your notes</h1>
    <p class="small muted">Notes and challenge submissions are private to you. Write them in each chapter; they collect here.</p></div>
    ${rows.length ? rows.join("") : `<div class="empty">No notes yet. Open a chapter and write in the yellow note box under any section.</div>`}
    ${rows.length ? `<div class="row"><button class="btn" data-act="save-notes">Save notes (.md)</button><span class="status" id="notes-status"></span></div>` : ""}</div>`;
}

function viewTranscript() {
  if (!S.catalogLoaded) return `<p class="muted">Loading…</p>`;
  loadAllProg();
  const list = [...S.courses.values()].filter((c) => S.prog[c.id] && (Object.keys(S.prog[c.id].read).length || Object.keys(S.prog[c.id].quiz).length || S.prog[c.id].final));
  return `<div class="stack col" style="max-width:900px"><div class="stack-sm"><div class="eyebrow">Academic record</div><h1 class="h1">Transcript</h1>
    <p class="small muted">Courses you have started. Only you can see your record.</p></div>
    ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Course</th><th>Level</th><th>Chapters passed</th><th>Final</th><th>Certificate</th></tr></thead><tbody>
      ${list.map((c) => { const p = S.prog[c.id], s = courseSummary(c, p); return `<tr class="link" data-act="open-course" data-id="${esc(c.id)}" tabindex="0"><td class="code">${esc(c.code)}</td><td>${esc(c.title)}</td><td>${esc(lvl(c.level).name)}</td><td class="num">${s.passed}/${s.n}</td><td class="num">${p.final ? pct(p.final.score) : "—"}</td><td>${p.cert ? `<span class="pill ok">${esc(date(p.cert.at))}</span>` : "—"}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty">Nothing on your record yet. Open a course from the catalog and mark a section as read to start.</div>`}</div>`;
}

/* ---------- actions ---------- */
const ctls = {};
function toast(msg) { const el = $("#f-status") || $(".status"); if (el) { el.textContent = msg; el.classList.add("err"); } }

async function draftSyllabus() {
  const f = S.form;

function sentenceChunks(text) {

  const out = []; let cur = "";
  parts.forEach((s) => { if ((cur + s).length > 220 && cur) { out.push(cur.trim()); cur = s; } else cur += s; });
  if (cur.trim()) out.push(cur.trim());

}
function auSpeak(c, n) {
  const A = S.audio, gen = ++A.gen, chap = S.chapters[`${c.id}:${n}`], items = audioItems(c, n, chap);
  const it = items[A.idx];
  if (!it) { A.playing = false; A.idx = 0; paintPlayer(); return; }
  const parts = sentenceChunks(it.text); let k = 0;
  const step = () => {
    if (gen !== A.gen) return;
    if (k >= parts.length) {
      A.idx++;
      const p = S.prog[c.id]; p.audioPos = { ...(p.audioPos || {}), [n]: A.idx }; saveProg(c.id);
      paintPlayer(); auSpeak(c, n); return;
    }
    const u = new SpeechSynthesisUtterance(parts[k++]);
    const v = Speech.pick(A.voice);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-US";

  S.chapters[key] = existing;
  const todo = ["lesson", "figures", "assess"].filter((k) => !existing[k]);
  const needReview = !(existing.review && existing.review.full);

  const g = S.gen[key] = { running: true, parts: {} };
  todo.forEach((k) => (g.parts[k] = { state: "run", len: 0 }));
