<title>Dr. Professor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a registrar's bar on top, one textbook reading column (about 68ch), a sticky contents rail beside it on wide screens. Tables and ruled lists, not cards. */
:root {
  --paper: #F4F6F7;
  --sheet: #FFFFFF;
  --ink: #15191D;
  --muted: #59626B;
  --rule: #D6DBDF;
  --rule-strong: #A3ACB4;
  --accent: #1C4F6E;
  --accent-soft: #E3ECF2;
  --ok: #2B6A3D;
  --warn: #8A5A00;
  --bad: #9A2B2B;
  --mark: #FFF2B8;
  --subj: #1C4F6E;
  --c-terms: #2E6DA4; --c-example: #2F7D4F; --c-practice: #A8670F; --c-myth: #B0303A; --c-check: #6B4FA0;
  --f-read: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s-xs: 0.75rem; --s-sm: 0.8125rem; --s-base: 0.9375rem; --s-read: 1.0625rem; --s-h3: 1.125rem; --s-h2: 1.375rem; --s-h1: 1.875rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1316; --sheet: #161B1F; --ink: #E3E7EA; --muted: #98A2AB; --rule: #2A3238; --rule-strong: #4B5660;
    --accent: #8CB9D6; --accent-soft: #1A2833; --ok: #7CC291; --warn: #E2B556; --bad: #EC8F8F; --mark: #3B3519;
    --c-terms: #7FB2E5; --c-example: #7CC291; --c-practice: #E2B556; --c-myth: #EC8F8F; --c-check: #B9A3E3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1316; --sheet: #161B1F; --ink: #E3E7EA; --muted: #98A2AB; --rule: #2A3238; --rule-strong: #4B5660;
  --accent: #8CB9D6; --accent-soft: #1A2833; --ok: #7CC291; --warn: #E2B556; --bad: #EC8F8F; --mark: #3B3519;
  --c-terms: #7FB2E5; --c-example: #7CC291; --c-practice: #E2B556; --c-myth: #EC8F8F; --c-check: #B9A3E3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: var(--s-base); line-height: 1.5; }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: 0.9em; background: var(--accent-soft); padding: 0 0.25em; }

/* Registrar bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule-strong); }
.bar-in { max-width: 1180px; margin: 0 auto; padding-inline: 16px; display: flex; align-items: center; gap: 16px; min-height: 48px; flex-wrap: wrap; }
.mark { font-family: var(--f-mono); font-weight: 500; font-size: var(--s-sm); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); text-decoration: none; display: flex; gap: 10px; align-items: baseline; }
.mark small { letter-spacing: 0.04em; color: var(--muted); text-transform: none; font-weight: 400; }
.nav { margin-left: auto; display: flex; gap: 4px; }
.nav button { background: none; border: 0; padding: 6px 10px; cursor: pointer; font-size: var(--s-sm); color: var(--muted); }
.nav button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.crumbs { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; font-size: var(--s-sm); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 80px; }
.col { max-width: 760px; }
.stack { display: grid; gap: 28px; }
.stack-sm { display: grid; gap: 12px; }

.eyebrow { font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--f-read); font-weight: 600; font-size: var(--s-h1); line-height: 1.2; }
.h2 { font-family: var(--f-read); font-weight: 600; font-size: var(--s-h2); line-height: 1.25; }
.h3 { font-family: var(--f-ui); font-weight: 600; font-size: var(--s-h3); }
.sec-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 6px; }
.sec-head .eyebrow { margin-left: auto; }
.muted { color: var(--muted); }
.small { font-size: var(--s-sm); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.prose { font-family: var(--f-read); font-size: var(--s-read); line-height: 1.65; max-width: 68ch; display: grid; gap: 0.9em; }
.prose strong { font-weight: 600; }
.lede { font-family: var(--f-read); font-size: 1.125rem; line-height: 1.6; max-width: 68ch; }

/* Forms */
.sheet { background: var(--sheet); border: 1px solid var(--rule); padding: 20px; }
.field { display: grid; gap: 6px; }
.field > label, .legend { font-size: var(--s-sm); font-weight: 600; }
.input, textarea.input { width: 100%; border: 1px solid var(--rule-strong); background: var(--sheet); padding: 8px 10px; border-radius: 2px; }
textarea.input { min-height: 84px; resize: vertical; line-height: 1.5; }
.levels { display: grid; border: 1px solid var(--rule-strong); }
.levels label { display: grid; grid-template-columns: auto 7rem 64px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--rule); cursor: pointer; }
.levels label:first-child { border-top: 0; }
.levels label:has(input:checked) { background: var(--accent-soft); }
.levels .lv-name { font-weight: 600; }
@media (max-width: 560px) { .levels label { grid-template-columns: auto 1fr; } .levels .lv-desc { grid-column: 2; } .levels .meter { display: none; } }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule-strong); background: var(--sheet); padding: 3px 10px; border-radius: 2px; cursor: pointer; font-size: var(--s-sm); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--sheet); padding: 8px 14px; border-radius: 2px; cursor: pointer; font-weight: 500; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { padding: 4px 10px; font-size: var(--s-sm); }
.radio-row { display: flex; flex-wrap: wrap; gap: 14px; }
.radio-row label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.status { font-size: var(--s-sm); color: var(--muted); min-height: 1.5em; }
.status.err { color: var(--bad); }

/* Level meter: six cells, filled to the level */
.meter { display: inline-flex; gap: 2px; vertical-align: middle; }
.meter i { width: 8px; height: 8px; border: 1px solid var(--rule-strong); }
.meter i.on { background: var(--accent); border-color: var(--accent); }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--sheet); }
table { border-collapse: collapse; width: 100%; font-size: var(--s-sm); }
th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
thead th { border-top: 0; font-weight: 600; font-size: var(--s-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--paper); white-space: nowrap; }
tr.link { cursor: pointer; }
tr.link:hover td { background: var(--accent-soft); }
td.code { font-family: var(--f-mono); white-space: nowrap; }
.pill { display: inline-block; font-size: var(--s-xs); padding: 1px 6px; border: 1px solid var(--rule-strong); border-radius: 2px; white-space: nowrap; color: var(--muted); }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.acc { color: var(--accent); border-color: var(--accent); }

.meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: var(--s-sm); }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; }
ol.obj, ul.plain { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }

/* Chapter layout */
.ch-grid { display: grid; grid-template-columns: 1fr; gap: 32px; }
@media (min-width: 1040px) { .ch-grid { grid-template-columns: 210px minmax(0, 1fr); } }
.rail { display: none; }
@media (min-width: 1040px) { .rail { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); align-self: start; max-height: calc(100vh - 90px); overflow: auto; font-size: var(--s-sm); } }
.rail ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.rail a { color: var(--ink); text-decoration: none; display: block; padding: 3px 0 3px 8px; border-left: 2px solid var(--rule); }
.rail a:hover { border-left-color: var(--accent); color: var(--accent); }
.rail a.done::after { content: " ✓"; color: var(--ok); }
.ch-main { min-width: 0; display: grid; gap: 40px; }
section.unit { display: grid; gap: 16px; scroll-margin-top: 72px; }
@media (max-width: 560px) { .mark small { display: none; } .bar-in { flex-wrap: nowrap; } }

figure.fig { margin: 0; display: grid; gap: 8px; }
.plate { background: #FFFFFF; border: 1px solid var(--rule); padding: 8px; max-width: 100%; }
.plate img { display: block; width: 100%; height: auto; }
figcaption { font-size: var(--s-sm); color: var(--muted); max-width: 68ch; }
figcaption b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }

dl.terms { margin: 0; display: grid; grid-template-columns: minmax(8rem, max-content) 1fr; border-top: 1px solid var(--rule); font-size: var(--s-sm); }
dl.terms dt, dl.terms dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--rule); }
dl.terms dt { font-weight: 600; padding-right: 16px; }
@media (max-width: 520px) { dl.terms { grid-template-columns: 1fr; } dl.terms dt { border-bottom: 0; padding-bottom: 0; } }

.box { border: 1px solid var(--rule-strong); background: var(--sheet); padding: 14px 16px; display: grid; gap: 10px; }
.box-title { font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-family: var(--f-read); font-size: var(--s-read); line-height: 1.55; }

.prob { display: grid; gap: 8px; padding: 12px 0; border-top: 1px dashed var(--rule-strong); }
.prob:first-of-type { border-top: 0; padding-top: 0; }
.prob .q { font-family: var(--f-read); font-size: var(--s-read); }
.choices { display: grid; gap: 4px; }
.choice { text-align: left; border: 1px solid var(--rule); background: var(--sheet); padding: 6px 10px; cursor: pointer; border-radius: 2px; display: flex; gap: 8px; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; }
.choice .k { font-family: var(--f-mono); color: var(--muted); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.right { border-color: var(--ok); }
.choice.right .k { color: var(--ok); }
.choice.wrong { border-color: var(--bad); }
.choice.wrong .k { color: var(--bad); }
.verdict { font-size: var(--s-sm); }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.expl { font-size: var(--s-sm); border-left: 2px solid var(--rule-strong); padding-left: 10px; }

.notes textarea { background: var(--mark); border-color: var(--rule-strong); font-family: var(--f-read); }
.check { display: flex; gap: 8px; align-items: center; font-size: var(--s-sm); cursor: pointer; }

/* Lecture deck */
.deck { display: grid; gap: 10px; max-width: 820px; }
.slide { aspect-ratio: 16 / 9; max-width: 100%; background: var(--sheet); border: 1px solid var(--rule-strong); padding: clamp(14px, 4%, 36px); display: grid; grid-template-rows: auto 1fr auto; gap: 12px; overflow: hidden; }
.slide h3 { font-family: var(--f-read); font-weight: 600; font-size: clamp(1.05rem, 2.6vw, 1.6rem); border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.slide ul { margin: 0; padding-left: 1.2em; display: grid; gap: 0.35em; align-content: start; font-size: clamp(0.8rem, 1.7vw, 1.05rem); overflow: auto; }
.slide .foot { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: var(--s-xs); color: var(--muted); }
.deck-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.deck-notes { font-size: var(--s-sm); color: var(--muted); max-width: 68ch; }

/* Office hours */
.chat { display: grid; gap: 10px; }
.msg { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--rule); background: var(--sheet); }
.msg.me { background: var(--accent-soft); border-color: transparent; }
.msg .who { font-family: var(--f-mono); font-size: var(--s-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.msg .body { font-family: var(--f-read); font-size: var(--s-base); line-height: 1.6; display: grid; gap: 0.6em; }

.gen-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--s-sm); }
.gen-list li { display: flex; gap: 10px; }
.gen-list .st { font-family: var(--f-mono); width: 6.5rem; flex: none; }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--rule-strong); padding-top: 14px; }

/* Certificate */
.cert-wrap { overflow-x: auto; }
.cert-wrap svg { width: 100%; max-width: 900px; height: auto; display: block; border: 1px solid var(--rule); }

.empty { border: 1px dashed var(--rule-strong); padding: 20px; color: var(--muted); font-size: var(--s-sm); }
.two { display: grid; gap: 28px; }
@media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }

/* Subject color: set per course on <main> as --subj; derived tints follow the theme */
main { --subj-ink: color-mix(in srgb, var(--subj) 62%, var(--ink)); --subj-soft: color-mix(in srgb, var(--subj) 10%, var(--sheet)); }
.prose strong { color: var(--subj-ink); }
figcaption b { color: var(--subj-ink); }
.swatch { display: inline-block; width: 10px; height: 10px; background: var(--sw); vertical-align: middle; margin-right: 6px; }

.opener { background: var(--subj); color: #FFFFFF; padding: clamp(18px, 4vw, 32px); display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; align-items: end; }
.opener .eyebrow { color: rgba(255, 255, 255, 0.82); grid-column: 1 / -1; }
.opener .big { font-family: var(--f-read); font-weight: 600; font-size: clamp(3.2rem, 9vw, 5.5rem); line-height: 0.9; }
.opener .h1 { color: #FFFFFF; }
.opener .sub { grid-column: 1 / -1; font-size: var(--s-sm); color: rgba(255, 255, 255, 0.88); display: flex; flex-wrap: wrap; gap: 4px 18px; }
.opener .meter i { border-color: rgba(255, 255, 255, 0.7); }
.opener .meter i.on { background: #FFFFFF; border-color: #FFFFFF; }
.cover { background: var(--subj); color: #FFFFFF; padding: clamp(18px, 4vw, 32px); display: grid; gap: 10px; }
.cover .eyebrow { color: rgba(255, 255, 255, 0.82); }
.cover .h1 { color: #FFFFFF; }
.cover .meter i { border-color: rgba(255, 255, 255, 0.7); }
.cover .meter i.on { background: #FFFFFF; border-color: #FFFFFF; }

/* Color-coded textbook boxes */
.cbox { --k: var(--subj); border: 1px solid var(--k); background: color-mix(in srgb, var(--k) 6%, var(--sheet)); }
.cbox > .cbox-h { background: var(--k); color: var(--sheet); font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 14px; display: flex; justify-content: space-between; gap: 10px; }
.cbox > .cbox-b { padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.k-terms { --k: var(--c-terms); } .k-example { --k: var(--c-example); } .k-practice { --k: var(--c-practice); }
.k-myth { --k: var(--c-myth); } .k-check { --k: var(--c-check); } .k-subj { --k: var(--subj); }
.myth { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-family: var(--f-read); font-size: var(--s-read); line-height: 1.55; }
.myth b { font-family: var(--f-ui); font-size: var(--s-sm); color: var(--c-myth); }
.myth b.fact { color: var(--ok); }
dl.terms dt { color: var(--c-terms); }

.slide { border-color: var(--subj); }
.slide h3 { background: var(--subj); color: #FFFFFF; border-bottom: 0; margin: calc(-1 * clamp(14px, 4%, 36px)) calc(-1 * clamp(14px, 4%, 36px)) 0; padding: clamp(10px, 2.5%, 22px) clamp(14px, 4%, 36px); }
.slide ul li::marker { color: var(--subj-ink); }

.bar-meter { height: 8px; background: var(--rule); position: relative; overflow: hidden; max-width: 320px; }
.bar-meter > span { position: absolute; inset: 0 auto 0 0; background: var(--bw, var(--subj)); }
details.report summary { cursor: pointer; font-size: var(--s-sm); font-weight: 600; }
.fix-before { text-decoration: line-through; color: var(--bad); }
.fix-after { color: var(--ok); }
.errata { font-size: var(--s-sm); display: grid; gap: 8px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: var(--s-sm); }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<header class="bar">
  <div class="bar-in">
    <a class="mark" href="#" data-act="go-catalog">Dr. Professor <small>Courses on any subject, at any level</small></a>
    <nav class="nav" aria-label="Main">
      <button type="button" data-act="go-catalog" id="nav-catalog">Catalog</button>
      <button type="button" data-act="go-transcript" id="nav-transcript">Transcript</button>
    </nav>
  </div>
</header>
<div class="crumbs" id="crumbs"></div>
<main id="main"><p class="muted">Loading the course catalog…</p></main>

<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const LEVELS = [
  { id: "noob", name: "Noob", num: "050", short: "No background at all.",
    guide: "The learner knows nothing about the subject. Use everyday language and concrete analogies, define every term the first time it appears, keep numbers simple, and build intuition before vocabulary. Simple does not mean childish." },
  { id: "beginner", name: "Beginner", num: "101", short: "First real course in the subject.",
    guide: "Introductory level, like a first high-school or community-college course. Introduce the field's core vocabulary and main ideas with clear examples, and use light quantitative work where it is natural." },
  { id: "intermediate", name: "Intermediate", num: "201", short: "Knows the basics; wants the mechanisms.",
    guide: "Lower-division university level. Assume the basics. Explain mechanisms and causes, use quantitative reasoning and the standard models, and introduce the field's standard methods and tools." },
  { id: "advanced", name: "Advanced", num: "301", short: "Upper-division depth, formal methods.",
    guide: "Upper-division university level. Use the field's formal tools (equations, models, frameworks) directly, cover edge cases and trade-offs, and refer to standard texts and key results." },
  { id: "expert", name: "Expert", num: "501", short: "Graduate level: literature and debates.",
    guide: "Graduate level. Assume fluency with the fundamentals. Focus on current research, competing models, methodological limits, quantitative depth, and the primary literature." },
  { id: "mastery", name: "Mastery", num: "701", short: "The frontier: open problems, original work.",
    guide: "Research and master-practitioner level. Cover the frontier: open problems, unresolved debates, advanced technique, and how experts make judgment calls. Exercises demand original synthesis, critique, and teaching the material to others." },
];
const LENGTHS = { short: 5, standard: 8, full: 12 };
const QUICK = ["Game design", "Birds", "Outer space", "Energy and power"];
const PASS_QUIZ = 0.7, PASS_FINAL = 0.75;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>")
  .replace(/`([^`]+)`/g, "<code>$1</code>");
const paras = (text) => String(text || "").split(/\n{2,}/).map((p) => `<p>${fmt(p.trim())}</p>`).join("");
const arr = (x) => (Array.isArray(x) ? x : []);
const str = (x) => (typeof x === "string" ? x.trim() : x == null ? "" : String(x));
const lvl = (id) => LEVELS.find((l) => l.id === id) || LEVELS[1];
const lvlIdx = (id) => Math.max(0, LEVELS.findIndex((l) => l.id === id));
const meter = (id) => `<span class="meter" aria-hidden="true">${LEVELS.map((_, i) => `<i class="${i <= lvlIdx(id) ? "on" : ""}"></i>`).join("")}</span>`;
const pct = (x) => Math.round((x || 0) * 100) + "%";

/* ---------- storage: db when served, browser storage otherwise ---------- */
const LS = {
  get(k) { try { const v = localStorage.getItem("drp:" + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem("drp:" + k, JSON.stringify(v)); } catch {} },
  keys(prefix) { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("drp:" + prefix)) out.push(k.slice(4)); } } catch {} return out; },
};
const queues = {};
function queued(key, fn) {
  const p = (queues[key] || Promise.resolve()).then(fn, fn);
  queues[key] = p.catch(() => {});
  return p;
}
const Store = {
  db: null, uid: null,
  async init() {
    const [db, user] = await Promise.all([caps.db, caps.user]);
    this.db = db;
    this.uid = user ? await user.id().catch(() => null) : null;
    if (db) {
      db.collection("courses").onSnapshot((snap) => {
        const m = new Map();
        snap.docs.forEach((d) => { if (d.exists) m.set(d.id, { ...clone(d.data()), id: d.id }); });
        S.courses = m; S.catalogLoaded = true; S.catalogError = null;
        onCoursesChanged();
      }, (err) => { S.catalogError = err && err.code; S.catalogLoaded = true; onCoursesChanged(); });
    } else {
      LS.keys("courses/").filter((k) => k.split("/").length === 2).forEach((k) => { const c = LS.get(k); if (c && c.id) S.courses.set(c.id, c); });
      S.catalogLoaded = true; onCoursesChanged();
    }
    S.profile = (await this.getUser("profile")) || { name: "" };
  },
  async get(path) {
    if (this.db) { try { const s = await this.db.doc(path).get(); return s.exists ? clone(s.data()) : null; } catch { return null; } }
    return LS.get(path);
  },
  set(path, data) {
    return queued(path, async () => { if (this.db) await this.db.doc(path).set(data); else LS.set(path, data); });
  },
  merge(path, data) {
    return queued(path, async () => {
      if (this.db) await this.db.doc(path).update(data);
      else { const cur = LS.get(path) || {}; for (const k in data) cur[k] = (data[k] && typeof data[k] === "object" && !Array.isArray(data[k])) ? { ...(cur[k] || {}), ...data[k] } : data[k]; LS.set(path, cur); }
    });
  },
  async list(coll) {
    if (this.db) {
      try { const s = await this.db.collection(coll).get(); return s.docs.filter((d) => d.exists).map((d) => ({ ...clone(d.data()), id: d.id })); }
      catch { return []; }
    }
    const depth = coll.split("/").length + 1;
    return LS.keys(coll + "/").filter((k) => k.split("/").length === depth).map((k) => ({ ...LS.get(k), id: k.split("/").pop() }));
  },
  userPath(k) { return this.db && this.uid ? `data/users/${this.uid}/${k}` : null; },
  async getUser(k) { const p = this.userPath(k); return p ? this.get(p) : LS.get("me/" + k); },
  setUser(k, data) { const p = this.userPath(k); if (p) return this.set(p, data); LS.set("me/" + k, data); return Promise.resolve(); },
};

function preamble(c) {

    `Level: ${L.name}. ${L.guide}`,
    c.focus ? `Learner's stated focus: ${c.focus}` : "",
    "ACCURACY COMES FIRST. State only facts you are confident are true and well established. Never invent statistics, studies, quotations, dates, names, places or sources. If you are not sure of a precise figure, give a rounded figure or a range you are sure of, or leave it out. Name a study or author only when you are certain of who and when. Separate settled consensus from open debate, and say which is which. A learner will rely on every sentence.",
    "Writing standards: specific; real names, numbers, dates, units and examples instead of generalities; no filler, hype, emoji or exclamation marks; American English. Write formulas in plain Unicode text (E = mc², v = d / t), never LaTeX. Inside strings you may use **bold** for a key term's first use and *italic* for emphasis; no other markdown, no headings, no HTML.",

function outline(c) {

}

/* ---------- normalizers ---------- */
const normMC = (q) => {
  const choices = arr(q.choices).map(str).filter(Boolean);
  const answer = Number.isInteger(+q.answer) ? +q.answer : 0;
  return choices.length >= 2 && answer >= 0 && answer < choices.length ? { q: str(q.q), choices, answer, explanation: str(q.explanation), ch: q.ch ? +q.ch : undefined } : null;
};
function normLesson(raw, c, n) {
  const ch = c.chapters[n - 1];
  const got = arr(raw && raw.sections);
  const sections = ch.sections.map((s, j) => {
    const r = got.find((x) => str(x.n) === `${n}.${j + 1}`) || got[j] || {};
    const ex = r.example || {};
    return {
      n: `${n}.${j + 1}`, title: s.title,
      reading: arr(r.reading).map(str).filter(Boolean),
      keyTerms: arr(r.keyTerms).map((t) => ({ term: str(t.term), def: str(t.def) })).filter((t) => t.term),
      example: { title: str(ex.title), steps: arr(ex.steps).map(str).filter(Boolean), takeaway: str(ex.takeaway) },
      misconception: { myth: str((r.misconception || {}).myth), fact: str((r.misconception || {}).fact) },
      practice: arr(r.practice).map((p) => p.type === "short" ? { type: "short", q: str(p.q), answer: str(p.answer), explanation: str(p.explanation) } : (normMC(p) && { type: "mc", ...normMC(p) })).filter((p) => p && p.q),
    };
  });
  if (!sections.some((s) => s.reading.length)) throw { code: "bad_shape" };
  return { overview: str(raw.overview), objectives: arr(raw.objectives).map(str).filter(Boolean), sections };
}
function normFigures(raw) {
  const list = arr(raw).map((f) => ({ section: str(f.section), caption: str(f.caption), svg: str(f.svg) })).filter((f) => /^<svg[\s>]/i.test(f.svg));
  if (!list.length) throw { code: "bad_shape" };
  return list;
}
function normAssess(raw) {
  const r = raw || {};
  const out = {
    slides: arr(r.slides).map((s) => ({ title: str(s.title), bullets: arr(s.bullets).map(str).filter(Boolean), notes: str(s.notes) })).filter((s) => s.title),
    quiz: arr(r.quiz).map(normMC).filter((q) => q && q.q),
    challenge: arr(r.challenge).map((x) => ({ title: str(x.title), prompt: str(x.prompt), deliverable: str(x.deliverable), rubric: arr(x.rubric).map(str).filter(Boolean) })).filter((x) => x.prompt),
    readings: arr(r.readings).map((x) => ({ citation: str(x.citation), kind: str(x.kind), why: str(x.why), pages: str(x.pages) })).filter((x) => x.citation),
    videos: arr(r.videos).map((x) => ({ search: str(x.search), why: str(x.why) })).filter((x) => x.search),
    images: arr(r.images).map((x) => ({ search: str(x.search), source: str(x.source).toLowerCase(), why: str(x.why) })).filter((x) => x.search),
  };
  if (!out.quiz.length || !out.slides.length) throw { code: "bad_shape" };
  return out;
}

async function loadAllProg() {
  if (allProgLoading) return;
  const missing = [...S.courses.keys()].filter((id) => !S.prog[id]);
  if (!missing.length) return;
  allProgLoading = true;
  await Promise.all(missing.map(loadProg));
  allProgLoading = false;
  if (S.view === "catalog") { const el = $("#catalog-list"); if (el) el.innerHTML = catalogList(); }
  if (S.view === "transcript") render();
}

/* ---------- derived ---------- */
function chapterState(c, p, n) {
  const written = !!(c.written && c.written[n]);
  const q = p && p.quiz && p.quiz[n];
  const total = c.chapters[n - 1].sections.length;
  const read = c.chapters[n - 1].sections.filter((_, j) => p && p.read[`${n}.${j + 1}`]).length;
  if (q && q.score >= PASS_QUIZ) return { label: `Passed ${pct(q.score)}`, cls: "ok", written, passed: true, read, total };
  if (q) return { label: `Quiz ${pct(q.score)}, retake`, cls: "warn", written, passed: false, read, total };
  if (read) return { label: `Reading ${read}/${total}`, cls: "acc", written, passed: false, read, total };
  if (written) return { label: "Written", cls: "", written, passed: false, read, total };
  return { label: "Not yet written", cls: "", written, passed: false, read, total };
}
function courseSummary(c, p) {
  const n = c.chapters.length;
  const passed = c.chapters.filter((_, i) => chapterState(c, p, i + 1).passed).length;
  return { n, passed, final: p && p.final, cert: p && p.cert };
}

/* ---------- views ---------- */
function render() {
  const main = $("#main");
  main.dataset.view = S.view;
  $("#nav-catalog").toggleAttribute("aria-current", S.view === "catalog");
  if (S.view === "catalog") $("#nav-catalog").setAttribute("aria-current", "page");
  $("#nav-transcript").toggleAttribute("aria-current", S.view === "transcript");
  if (S.view === "transcript") $("#nav-transcript").setAttribute("aria-current", "page");
  const c = S.courses.get(S.courseId);
  if (c && S.view !== "catalog" && S.view !== "transcript") main.style.setProperty("--subj", subj(c)); else main.style.removeProperty("--subj");
  const crumbs = [];
  if (S.view !== "catalog" && S.view !== "transcript") crumbs.push(`<button type="button" data-act="go-catalog">Catalog</button>`);
  if (c && S.view !== "course") crumbs.push(`<span>/</span><button type="button" data-act="open-course" data-id="${esc(c.id)}">${esc(c.code)}</button>`);
  $("#crumbs").innerHTML = crumbs.join("");
  if (S.view === "catalog") main.innerHTML = viewCatalog();
  else if (S.view === "transcript") main.innerHTML = viewTranscript();
  else if (!c) main.innerHTML = S.catalogLoaded ? `<div class="empty">This course is not in the catalog. <button class="btn sm ghost" data-act="go-catalog">Back to catalog</button></div>` : `<p class="muted">Loading…</p>`;
  else if (S.view === "course") main.innerHTML = viewCourse(c);
  else if (S.view === "chapter") main.innerHTML = viewChapter(c, S.chapterN);
  else if (S.view === "final") main.innerHTML = viewFinal(c);
  else if (S.view === "cert") main.innerHTML = viewCert(c);
  else if (S.view === "notebook") main.innerHTML = viewNotebook(c);
}

function catalogList() {
  if (!S.catalogLoaded) return `<p class="muted small">Loading the catalog…</p>`;
  if (S.catalogError) return `<div class="empty">The shared library could not be read (${esc(S.catalogError)}). Reload the page to try again.</div>`;
  const list = [...S.courses.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  if (!list.length) return `<div class="empty">No courses on file yet. Request one with the form; it appears here once the syllabus is drafted.</div>`;
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Code</th><th>Course</th><th>Level</th><th>Ch.</th><th>Your progress</th></tr></thead>
    <tbody>${list.map((c) => {
      const p = S.prog[c.id]; const s = courseSummary(c, p);
      const prog = s.cert ? `<span class="pill ok">Certified</span>` : p ? `<span class="num">${s.passed}/${s.n}</span> passed` : `<span class="muted">—</span>`;
      return `<tr class="link" data-act="open-course" data-id="${esc(c.id)}" tabindex="0">
        <td class="code"><span class="swatch" style="--sw:${subj(c)}"></span>${esc(c.code)}</td><td>${esc(c.title)}</td>
        <td style="white-space:nowrap">${meter(c.level)} ${esc(lvl(c.level).name)}</td>
        <td class="num">${c.chapters.length}</td><td>${prog}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}

/* ----- chapter ----- */
function figuresFor(chap, sec) { return arr(chap.figures).filter((f) => f.section === sec); }
function svgSrc(svg) {
  let s = svg;
  if (!/xmlns=/.test(s)) s = s.replace(/^<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
}

function viewChapter(c, n) {
  const ch = c.chapters[n - 1];
  if (!ch) return `<div class="empty">No such chapter.</div>`;
  const key = `${c.id}:${n}`;
  const chap = S.chapters[key];
  const p = S.prog[c.id];
  if (chap === undefined || !p || !S.errata[c.id]) {
    Promise.all([
      chap === undefined ? Store.get(chapterPath(c.id, n)).then((d) => { S.chapters[key] = d; }) : null,
      loadProg(c.id),
      S.errata[c.id] ? null : Store.list(`courses/${c.id}/errata`).then((l) => { S.errata[c.id] = l; }),
    ]).then(() => { if (S.view === "chapter" && S.courseId === c.id && S.chapterN === n) render(); });
    return `<p class="muted">Opening chapter ${n}…</p>`;
  }
  const L0 = chap && chap.lesson;
  const reviewed = !!(chap && chap.review && chap.review.full);
  const facts = L0
    ? `<span>${L0.sections.length} sections</span><span>≈ ${Math.max(5, Math.round(words(L0) / 200))} min reading</span><span>${arr(chap.figures).length} figures</span><span>${L0.sections.reduce((k, s) => k + s.practice.length, 0)} practice problems</span>${reviewed ? `<span>✓ Fact-checked</span>` : ""}`
    : `<span>${ch.sections.length} sections</span><span>Not yet written</span>`;
  const head = `<header class="opener">
      <div class="eyebrow">${esc(c.code)} · ${esc(c.title)}</div>
      <div class="big" aria-hidden="true">${n}</div>
      <div class="stack-sm"><div class="eyebrow">Chapter ${n} of ${c.chapters.length}</div><h1 class="h1">${esc(ch.title)}</h1></div>
      <div class="sub">${meter(c.level)}<span>${esc(lvl(c.level).name)} level</span>${facts}</div>
    </header>`;
  if (!L0) {
    return `<div class="stack col" style="max-width:900px">${head}
      <p class="lede">${esc(ch.summary)}</p>
      <div class="tbl-wrap"><table><tbody>${ch.sections.map((s, j) => `<tr><td class="num" style="color:var(--subj-ink)">${n}.${j + 1}</td><td><strong>${esc(s.title)}</strong><div class="muted">${esc(s.summary)}</div></td></tr>`).join("")}</tbody></table></div>
      <div class="sheet stack-sm" id="gen-box">${genBox(c, n, chap)}</div>
      ${pager(c, n)}</div>`;
  }
  const L = chap.lesson, A = chap.assess;
  let figNo = 0;
  const figHTML = (f) => { figNo++; return `<figure class="fig"><div class="plate"><img class="fig-img" alt="${esc(f.caption)}" src="${svgSrc(f.svg)}"></div><figcaption><b>Figure ${n}.${figNo}</b> ${fmt(f.caption)}</figcaption></figure>`; };
  const sectionIds = new Set(L.sections.map((s) => s.n));
  const loose = arr(chap.figures).filter((f) => !sectionIds.has(f.section));
  const rail = `<nav class="rail" aria-label="Chapter contents"><div class="eyebrow">Contents</div><ol>
      <li><a href="#top">Overview</a></li>
      ${chap.review ? `<li><a href="#factcheck">Fact-check report</a></li>` : ""}
      ${A ? `<li><a href="#lecture">Lecture</a></li>` : ""}
      ${L.sections.map((s) => `<li><a href="#s-${esc(s.n)}" class="${p.read[s.n] ? "done" : ""}">${esc(s.n)} ${esc(s.title)}</a></li>`).join("")}
      ${A ? `<li><a href="#quiz">Chapter quiz</a></li><li><a href="#challenge">Challenge exercises</a></li><li><a href="#readings">Homework reading</a></li><li><a href="#media">Watch and look</a></li>` : ""}
      <li><a href="#office">Office hours</a></li></ol></nav>`;
  const missing = !A || !chap.figures || !reviewed;
  return `<div class="ch-grid">${rail}<div class="ch-main">
    <section class="unit" id="top">${head}
      <div class="prose">${paras(L.overview)}</div>
      ${L.objectives.length ? `<div class="cbox k-subj"><div class="cbox-h"><span>After this chapter you can</span></div><div class="cbox-b"><ul class="plain">${L.objectives.map((o) => `<li>${fmt(o)}</li>`).join("")}</ul></div></div>` : ""}
      ${chap.review ? reviewBox(chap.review) : ""}
      ${loose.map(figHTML).join("")}
      ${missing ? `<div class="sheet stack-sm" id="gen-box">${genBox(c, n, chap)}</div>` : ""}
    </section>
    ${A && A.slides.length ? `<section class="unit" id="lecture"><div class="sec-head"><h2 class="h2">Lecture</h2><span class="eyebrow">${A.slides.length} slides</span></div><div id="deck">${deck(c, n, A)}</div></section>` : ""}
    ${L.sections.map((s) => `<section class="unit" id="s-${esc(s.n)}">
      <div class="sec-head"><h2 class="h2"><span class="num" style="color:var(--subj-ink)">${esc(s.n)}</span> ${esc(s.title)}</h2></div>
      <div class="prose">${s.reading.map((r) => `<p>${fmt(r)}</p>`).join("")}</div>
      ${figuresFor(chap, s.n).map(figHTML).join("")}
      ${s.misconception && s.misconception.myth ? `<div class="cbox k-myth"><div class="cbox-h"><span>Common misconception</span></div><div class="cbox-b"><div class="myth"><b>Myth</b><span>${fmt(s.misconception.myth)}</span><b class="fact">Fact</b><span>${fmt(s.misconception.fact)}</span></div></div></div>` : ""}
      ${s.keyTerms.length ? `<div class="cbox k-terms"><div class="cbox-h"><span>Key terms</span><span>${s.keyTerms.length}</span></div><div class="cbox-b"><dl class="terms">${s.keyTerms.map((t) => `<dt>${esc(t.term)}</dt><dd>${fmt(t.def)}</dd>`).join("")}</dl></div></div>` : ""}
      ${s.example.steps.length ? `<div class="cbox k-example"><div class="cbox-h"><span>Worked example</span></div><div class="cbox-b"><div class="h3">${fmt(((t) => t.charAt(0).toUpperCase() + t.slice(1))(s.example.title.replace(/^Worked example:\s*/i, "")))}</div><ol class="steps">${s.example.steps.map((x) => `<li>${fmt(x)}</li>`).join("")}</ol>${s.example.takeaway ? `<p class="small"><strong>Takeaway.</strong> ${fmt(s.example.takeaway)}</p>` : ""}</div></div>` : ""}
      ${s.practice.length ? `<div class="cbox k-practice"><div class="cbox-h"><span>Practice ${esc(s.n)}</span><span>${s.practice.length} problems</span></div><div class="cbox-b">${s.practice.map((pr, i) => `<div class="prob" id="pp-${esc(s.n)}-${i}">${practice(c, s.n, i, pr)}</div>`).join("")}</div></div>` : ""}
      <div class="field notes"><label for="note-${esc(s.n)}">Your notes · ${esc(s.n)}</label><textarea class="input" id="note-${esc(s.n)}" data-inp="note" data-sec="${esc(s.n)}" placeholder="Summarize the section in your own words, or write questions to bring to office hours.">${esc(p.notes[s.n] || "")}</textarea></div>
      <label class="check"><input type="checkbox" id="read-${esc(s.n)}" data-inp="read" data-sec="${esc(s.n)}" ${p.read[s.n] ? "checked" : ""}> I have read section ${esc(s.n)} and done its practice</label>
      ${errataBlock(c, n, s.n)}
    </section>`).join("")}
    ${A ? `<section class="unit" id="quiz"><div class="sec-head"><h2 class="h2">Chapter quiz</h2><span class="eyebrow">${A.quiz.length} questions · ${pct(PASS_QUIZ)} to pass</span></div><div id="quiz-body">${quizBody(c, n, A.quiz, "quiz")}</div></section>
    <section class="unit" id="challenge"><div class="sec-head"><h2 class="h2">Challenge exercises</h2><span class="eyebrow">Graded by Dr. Professor</span></div>
      ${A.challenge.map((x, i) => `<div class="box" style="border-top:3px solid var(--subj)" id="cx-${i}">${challenge(c, n, i, x)}</div>`).join("")}</section>
    <section class="unit" id="readings"><div class="sec-head"><h2 class="h2">Homework reading</h2></div>
      <p class="small muted">Citations are written by Dr. Professor and checked by the fact-check pass from memory, not against a library. Use the search links to find and confirm each one before you rely on it.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Source</th><th>Read it for</th><th></th></tr></thead><tbody>${A.readings.map((r) => `<tr><td>${esc(r.citation)}${r.pages ? `<div class="muted">${esc(r.pages)}</div>` : ""}<div class="row" style="gap:6px;margin-top:4px"><span class="pill">${esc(r.kind || "source")}</span>${r.checked ? `<span class="pill ok">Checked</span>` : r.unverified ? `<span class="pill warn">Unverified</span>` : ""}</div></td><td>${fmt(r.why)}</td><td style="white-space:nowrap"><a href="${readingLink(r)}" target="_blank" rel="noopener">Find it ↗</a></td></tr>`).join("")}</tbody></table></div></section>
    <section class="unit" id="media"><div class="sec-head"><h2 class="h2">Watch and look</h2></div>
      <p class="small muted">Dr. Professor does not invent video or image addresses. These links run a search; pick a result from a university, museum, agency or recognized educator.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Search</th><th>What to look for</th></tr></thead><tbody>
        ${A.videos.map((v) => `<tr><td>Video</td><td><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.search)}" target="_blank" rel="noopener">${esc(v.search)} ↗</a></td><td>${fmt(v.why)}</td></tr>`).join("")}
        ${A.images.map((v) => `<tr><td>Images${v.source === "nasa" ? " · NASA" : " · Wikimedia"}</td><td><a href="${v.source === "nasa" ? "https://images.nasa.gov/search?q=" : "https://commons.wikimedia.org/w/index.php?search="}${encodeURIComponent(v.search)}" target="_blank" rel="noopener">${esc(v.search)} ↗</a></td><td>${fmt(v.why)}</td></tr>`).join("")}
      </tbody></table></div></section>` : ""}
    <section class="unit" id="office"><div class="sec-head"><h2 class="h2">Office hours</h2><span class="eyebrow">Ask about this chapter</span></div>
      <div id="chat">${chatBody(key)}</div></section>
    ${pager(c, n)}
  </div></div>`;
}
function reviewBox(r) {
  const corr = arr(r.corrections), applied = corr.filter((x) => x.applied), fixes = arr(r.keyFixes), removed = arr(r.readingsRemoved);
  const plural = (k, w) => `${k} ${w}${k === 1 ? "" : "s"}`;
  return `<div class="cbox k-check" id="factcheck"><div class="cbox-h"><span>Fact-check report</span><span>${esc(date(r.at))}</span></div><div class="cbox-b">
    <p class="small">${esc(r.by || "Checked after writing by a second, more careful Claude pass.")}
      ${r.keysChecked ? ` Answer keys re-solved blind: <strong class="num">${r.keysAgreed}/${r.keysChecked}</strong> agreed${fixes.length ? `, ${plural(fixes.length, "key")} corrected` : ""}.` : ""}
      ${applied.length ? ` ${plural(applied.length, "correction")} applied to the text.` : " No text corrections were needed."}
      ${removed.length ? ` ${plural(removed.length, "unverifiable reading")} removed.` : ""}</p>
    ${r.summary ? `<p class="small muted">${fmt(r.summary)}</p>` : ""}
    ${corr.length || fixes.length ? `<details class="report"><summary>Show every change</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Where</th><th>Change</th><th>Why</th></tr></thead><tbody>
      ${fixes.map((k) => `<tr><td>${esc(k.id)}</td><td>Answer key <span class="fix-before">${esc(k.from)}</span> → <span class="fix-after">${esc(k.to)}</span></td><td>${fmt(k.why)}</td></tr>`).join("")}
      ${corr.map((x) => `<tr><td>${esc(x.where)}${x.applied ? "" : ` <span class="pill warn">not applied</span>`}</td><td><span class="fix-before">${esc(x.before)}</span><br><span class="fix-after">${esc(x.after)}</span></td><td>${fmt(x.why)}</td></tr>`).join("")}
    </tbody></table></div></details>` : ""}
    <p class="small muted">The fact-check uses Claude's own knowledge, not a library lookup. It catches most errors, not all of them. If you spot one, use “Report an error” under the section.</p>
  </div></div>`;
}
function errataBlock(c, n, sec) {
  const list = arr(S.errata[c.id]).filter((e) => e.n === n && e.sec === sec);
  const open = S.errOpen[`${c.id}:${sec}`];
  const label = { checking: "Checking…", error: "Fixed", partly: "Partly fixed", "not-an-error": "No error found", failed: "Could not check" };
  return `<div class="errata" id="err-${esc(sec)}">
    ${list.map((e) => `<div class="cbox k-myth"><div class="cbox-h"><span>Error report · ${esc(date(e.at))}</span><span>${esc(label[e.status] || e.status)}</span></div><div class="cbox-b">
      <p><strong>Reported:</strong> ${esc(e.text)}</p>
      ${e.reply ? `<p><strong>Dr. Professor:</strong> ${fmt(e.reply)}</p>` : ""}
      ${arr(e.fixes).filter((f) => f.applied).map((f) => `<p class="small"><span class="fix-before">${esc(f.quote)}</span> → <span class="fix-after">${esc(f.correction)}</span></p>`).join("")}
    </div></div>`).join("")}
    ${open ? `<div class="field"><label for="err-text-${esc(sec)}">What is wrong in section ${esc(sec)}?</label><textarea class="input" id="err-text-${esc(sec)}" maxlength="4000" placeholder="Quote the sentence and say what you think is wrong. A source helps."></textarea>
      <div class="row"><button class="btn sm" data-act="err-submit" data-sec="${esc(sec)}">Submit for checking</button><button class="btn ghost sm" data-act="err-cancel" data-sec="${esc(sec)}">Cancel</button></div></div>`
      : `<div><button class="linkbtn" data-act="err-open" data-sec="${esc(sec)}">Report an error in ${esc(sec)}</button></div>`}
  </div>`;
}
function readingLink(r) {
  const q = encodeURIComponent(r.citation);
  if (r.kind === "book" || r.kind === "chapter") return "https://www.worldcat.org/search?q=" + q;
  if (r.kind === "website") return "https://duckduckgo.com/?q=" + q;
  return "https://scholar.google.com/scholar?q=" + q;
}
function pager(c, n) {
  const prev = n > 1 ? `<button class="btn ghost sm" data-act="open-chapter" data-n="${n - 1}">← Ch. ${n - 1}: ${esc(c.chapters[n - 2].title)}</button>` : `<button class="btn ghost sm" data-act="open-course" data-id="${esc(c.id)}">← Syllabus</button>`;
  const next = n < c.chapters.length ? `<button class="btn ghost sm" data-act="open-chapter" data-n="${n + 1}">Ch. ${n + 1}: ${esc(c.chapters[n].title)} →</button>` : `<button class="btn ghost sm" data-act="open-final">Final examination →</button>`;
  return `<div class="pager">${prev}${next}</div>`;
}

function genBox(c, n, chap) {
  const key = `${c.id}:${n}`, g = S.gen[key];
  const parts = [["lesson", "Textbook text, worked examples, misconceptions and practice"], ["figures", "Color figures"], ["assess", "Lecture slides, quiz, challenges and study list"], ["review", "Fact-check: claims, figure labels and citations; every answer key re-solved blind"]];
  const has = (k) => chap && (k === "review" ? chap.review && chap.review.full : chap[k]);
  const running = g && g.running;
  const st = (k) => {
    if (has(k)) return `<span class="st" style="color:var(--ok)">Done</span>`;
    const s = g && g.parts[k];
    if (!s) return `<span class="st muted">Waiting</span>`;
    if (s.state === "wait") return `<span class="st muted">Queued</span>`;
    if (s.state === "run") return `<span class="st">${s.len ? `${(s.len / 1000).toFixed(1)}k chars` : "Thinking…"}</span>`;
    if (s.state === "err") return `<span class="st" style="color:var(--bad)">Failed</span>`;
    return `<span class="st" style="color:var(--ok)">Done</span>`;
  };
  const errs = g ? Object.values(g.parts).filter((s) => s.state === "err").map((s) => s.msg) : [];
  const onlyReview = chap && chap.lesson && chap.figures && chap.assess;
  const title = !(chap && chap.lesson) ? "This chapter has not been written yet" : onlyReview ? "This chapter has not been fact-checked yet" : "Parts of this chapter are not written yet";
  const btn = !(chap && chap.lesson) ? `Write chapter ${n}` : onlyReview ? "Run the fact-check" : "Write the missing parts";
  return `<div class="h3">${title}</div>
    <p class="small muted">Dr. Professor writes the chapter in three parts at once. A second, more careful pass then fact-checks it and corrects what it finds before you rely on it. This uses your Claude account and usually takes three to six minutes. The finished chapter is saved to the shared library, so it is only written once.</p>
    <ul class="gen-list">${parts.map(([k, label]) => `<li>${st(k)}<span>${label}</span></li>`).join("")}</ul>
    ${errs.length ? `<p class="status err">${esc([...new Set(errs)].join(" "))}</p>` : ""}
    <div class="row">${running ? `<button class="btn ghost" data-act="stop" data-k="${esc(key)}">Stop</button>` : `<button class="btn" data-act="write-chapter" data-n="${n}">${btn}</button>`}</div>`;
}

function deck(c, n, A) {
  const key = `${c.id}:${n}`;
  const i = Math.min(S.slide[key] || 0, A.slides.length - 1);
  const s = A.slides[i];
  return `<div class="deck" tabindex="0" data-deck="${esc(key)}" aria-roledescription="slide deck" aria-label="Lecture slides">
    <div class="slide"><h3>${esc(s.title)}</h3><ul>${s.bullets.map((b) => `<li>${fmt(b)}</li>`).join("")}</ul>
      <div class="foot"><span>${esc(c.code)} · Ch. ${n}</span><span>${i + 1} / ${A.slides.length}</span></div></div>
    <div class="deck-ctl"><button class="btn ghost sm" data-act="slide" data-d="-1" ${i === 0 ? "disabled" : ""}>← Previous</button><button class="btn ghost sm" data-act="slide" data-d="1" ${i === A.slides.length - 1 ? "disabled" : ""}>Next →</button><span class="small muted">Arrow keys work when the deck is focused.</span></div>
    ${s.notes ? `<p class="deck-notes"><strong>Lecturer's notes.</strong> ${fmt(s.notes)}</p>` : ""}</div>`;
}

function practice(c, sec, i, pr) {
  const p = S.prog[c.id], k = `${sec}#${i}`, rec = p.practice[k];
  const num = `<span class="num muted">${i + 1}.</span> `;
  if (pr.type === "mc") {
    const done = rec && rec.choice != null;
    return `<div class="q">${num}${fmt(pr.q)}</div><div class="choices">${pr.choices.map((ch, j) => {
      const cls = done ? (j === pr.answer ? "right" : j === rec.choice ? "wrong" : "") : "";
      return `<button class="choice ${cls}" data-act="practice-mc" data-sec="${esc(sec)}" data-i="${i}" data-j="${j}" ${done ? "disabled" : ""}><span class="k">${LETTERS[j]}</span><span>${fmt(ch)}</span></button>`;
    }).join("")}</div>
    ${done ? `<div class="verdict ${rec.choice === pr.answer ? "ok" : "bad"}">${rec.choice === pr.answer ? "Correct." : `Not quite. The answer is ${LETTERS[pr.answer]}.`}</div>${pr.explanation ? `<div class="expl">${fmt(pr.explanation)}</div>` : ""}<div><button class="btn ghost sm" data-act="practice-reset" data-sec="${esc(sec)}" data-i="${i}">Try again</button></div>` : ""}`;
  }
  const shown = rec && rec.revealed;
  return `<div class="q">${num}${fmt(pr.q)}</div>
    <textarea class="input" id="pa-${esc(sec)}-${i}" data-inp="practice-text" data-sec="${esc(sec)}" data-i="${i}" placeholder="Write your answer before checking.">${esc((rec && rec.text) || "")}</textarea>
    ${shown ? `<div class="expl"><strong>Model answer.</strong> ${fmt(pr.answer)}${pr.explanation ? `<br><span class="muted">${fmt(pr.explanation)}</span>` : ""}</div>` : `<div><button class="btn ghost sm" data-act="practice-reveal" data-sec="${esc(sec)}" data-i="${i}">Check against the model answer</button></div>`}`;
}

function quizBody(c, n, qs, kind) {
  const p = S.prog[c.id];
  const rec = kind === "quiz" ? p.quiz[n] : p.final;
  const selKey = `${c.id}:${kind}:${n}`;
  const sel = S.quizSel[selKey] || [];
  const done = !!rec && !S.quizSel[selKey + ":retake"];
  const pass = kind === "quiz" ? PASS_QUIZ : PASS_FINAL;
  const items = qs.map((q, i) => {
    const pick = done ? rec.answers[i] : sel[i];
    return `<div class="prob"><div class="q"><span class="num muted">${i + 1}.</span> ${q.ch ? `<span class="pill">Ch. ${q.ch}</span> ` : ""}${fmt(q.q)}</div><div class="choices">${q.choices.map((ch, j) => {
      const cls = done ? (j === q.answer ? "right" : j === pick ? "wrong" : "") : (j === pick ? "sel" : "");
      return `<button class="choice ${cls}" data-act="quiz-pick" data-kind="${kind}" data-i="${i}" data-j="${j}" ${done ? "disabled" : ""} aria-pressed="${j === pick}"><span class="k">${LETTERS[j]}</span><span>${fmt(ch)}</span></button>`;
    }).join("")}</div>${done && q.explanation ? `<div class="expl">${fmt(q.explanation)}</div>` : ""}</div>`;
  }).join("");
  const answered = sel.filter((x) => x != null).length;
  const foot = done
    ? `<div class="box"><div class="h3">Score: <span class="num">${pct(rec.score)}</span> <span class="pill ${rec.score >= pass ? "ok" : "warn"}">${rec.score >= pass ? "Passed" : "Not passed"}</span></div>
       <div class="bar-meter" role="img" aria-label="Score ${pct(rec.score)}"><span style="width:${pct(rec.score)};--bw:${rec.score >= pass ? "var(--ok)" : "var(--warn)"}"></span></div>
       <p class="small muted">Taken ${esc(date(rec.at))}. ${rec.score >= pass ? "" : `You need ${pct(pass)}. Review the explanations, then retake.`}</p>
       <div class="row"><button class="btn ghost sm" data-act="quiz-retake" data-kind="${kind}">Retake</button>${kind === "final" && rec.score >= pass ? `<button class="btn sm" data-act="open-cert">View certificate</button>` : ""}</div></div>`
    : `<div class="row"><button class="btn" data-act="quiz-submit" data-kind="${kind}" ${answered < qs.length ? "disabled" : ""}>Submit answers</button><span class="small muted num">${answered}/${qs.length} answered</span></div>`;
  return `<div class="box">${items}</div>${foot}`;
}

function challenge(c, n, i, x) {
  const p = S.prog[c.id], k = `${n}#${i}`, rec = p.challenge[k] || {};
  const busy = S.busy["grade:" + c.id + ":" + k];
  const gr = rec.grade;
  return `<div class="box-title">Exercise ${n}.${String.fromCharCode(65 + i)}</div>
    <div class="h3">${esc(x.title)}</div>
    <div class="prose">${paras(x.prompt)}</div>
    <p class="small"><strong>Submit:</strong> ${fmt(x.deliverable)}</p>
    ${x.rubric.length ? `<div class="small"><strong>Graded on:</strong><ul class="plain">${x.rubric.map((r) => `<li>${fmt(r)}</li>`).join("")}</ul></div>` : ""}
    <textarea class="input" id="cx-text-${n}-${i}" data-inp="challenge" data-i="${i}" style="min-height:140px" placeholder="Your submission">${esc(rec.text || "")}</textarea>
    <div class="row"><button class="btn sm" data-act="grade" data-i="${i}" ${busy ? "disabled" : ""}>${busy ? "Grading…" : gr ? "Resubmit for grading" : "Submit for grading"}</button><span class="status ${rec.err ? "err" : ""}">${esc(rec.err || "")}</span></div>
    ${gr ? `<div class="box" style="background:var(--paper)"><div class="h3">Grade: <span class="num">${esc(gr.score)}</span>/100</div><p>${fmt(gr.verdict)}</p>
      <div class="tbl-wrap"><table><thead><tr><th>Criterion</th><th>Met</th><th>Comment</th></tr></thead><tbody>${arr(gr.rubric).map((r) => `<tr><td>${fmt(r.criterion)}</td><td><span class="pill ${r.met === "yes" ? "ok" : r.met === "partly" ? "warn" : ""}">${esc(r.met)}</span></td><td>${fmt(r.comment)}</td></tr>`).join("")}</tbody></table></div>
      ${gr.next ? `<p class="small"><strong>Next step.</strong> ${fmt(gr.next)}</p>` : ""}</div>` : ""}`;
}

function chatBody(key) {
  const ch = S.chat[key] || { turns: [], busy: false };
  return `<div class="chat">
    ${ch.turns.length ? "" : `<p class="small muted">Ask about anything in this chapter: a step you did not follow, a practice answer you disagree with, how this connects to something else. Answers use your Claude account.</p>`}
    ${ch.turns.map((t) => `<div class="msg ${t.role === "user" ? "me" : ""}"><div class="who">${t.role === "user" ? "You" : "Dr. Professor"}</div><div class="body">${t.content ? paras(t.content) : "<p class='muted'>Thinking…</p>"}</div></div>`).join("")}
    ${ch.err ? `<p class="status err">${esc(ch.err)}</p>` : ""}
    <div class="field"><label for="chat-in">Your question</label><textarea class="input" id="chat-in" data-inp="chat" placeholder="Why does…">${esc(ch.draft || "")}</textarea></div>
    <div class="row">${ch.busy ? `<button class="btn ghost" data-act="chat-stop">Stop</button>` : `<button class="btn" data-act="chat-send">Ask</button>`}</div></div>`;
}

/* ----- final / cert / notebook / transcript ----- */
function viewFinal(c) {
  const ex = S.finals[c.id], p = S.prog[c.id];
  if (ex === undefined || !p) {
    Promise.all([ex === undefined ? Store.get(finalPath(c.id)).then((d) => { S.finals[c.id] = d; }) : null, loadProg(c.id)])
      .then(() => { if (S.view === "final" && S.courseId === c.id) render(); });
    return `<p class="muted">Opening the examination…</p>`;
  }
  const head = `<div class="stack-sm"><div class="eyebrow">${esc(c.code)} · Final examination</div><h1 class="h1">${esc(c.title)}</h1>
    <p class="lede">16 questions drawn from every chapter. ${pct(PASS_FINAL)} passes. Passing issues your certificate; it says "coursework and examination" if every chapter quiz is also passed, and "credit by examination" otherwise.</p></div>`;
  if (!ex) {
    const busy = S.busy["final:" + c.id];
    return `<div class="stack col">${head}<div class="sheet stack-sm"><div class="h3">The examination has not been written yet</div>
      <p class="small muted">It is written once from the syllabus and shared by everyone taking this course. About a minute.</p>
      <div class="row">${busy ? `<button class="btn ghost" data-act="stop" data-k="final:${esc(c.id)}">Stop</button>` : `<button class="btn" data-act="write-final">Write the final examination</button>`}<span class="status ${S.gen["final:" + c.id + ":err"] ? "err" : ""}">${esc(busy ? S.gen["final:" + c.id] || "Thinking…" : S.gen["final:" + c.id + ":err"] || "")}</span></div></div></div>`;
  }
  const ck = ex.check;
  const ckLine = ck ? `<div class="cbox k-check"><div class="cbox-h"><span>Answer key check</span><span>${esc(date(ck.at))}</span></div><div class="cbox-b"><p class="small">Every question was re-solved blind by a second Claude pass: <strong class="num">${ck.keysAgreed}/${ck.keysChecked}</strong> agreed with the key${arr(ck.keyFixes).length ? `; ${ck.keyFixes.length} disputed key${ck.keyFixes.length === 1 ? " was" : "s were"} re-examined and corrected` : ""}.</p></div></div>` : "";
  return `<div class="stack col">${head}${ckLine}<div id="quiz-body">${quizBody(c, 0, ex.questions, "final")}</div></div>`;
}

function certInfo(c, p) {
  if (!p || !p.final || p.final.score < PASS_FINAL) return null;
  const allPassed = c.chapters.every((_, i) => chapterState(c, p, i + 1).passed);
  return { basis: allPassed ? "Coursework and final examination" : "Credit by examination", score: p.final.score };
}
function certSVG(c, p, name) {
  const info = certInfo(c, p), L = lvl(c.level);
  const no = (c.code.replace(/\s/g, "") + "-" + (p.cert ? p.cert.no : "")).toUpperCase();
  const e = (s) => esc(s);
  const title = c.title.length > 64 ? c.title.slice(0, 61) + "…" : c.title;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-label="Certificate">
  <rect width="1100" height="780" fill="#FFFFFF"/>
  <rect x="28" y="28" width="1044" height="724" fill="none" stroke="#1C4F6E" stroke-width="3"/>
  <rect x="40" y="40" width="1020" height="700" fill="none" stroke="#1C4F6E" stroke-width="1"/>
  <text x="550" y="120" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="18" letter-spacing="6" fill="#1C4F6E">DR. PROFESSOR</text>
  <text x="550" y="190" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="46" fill="#15191D">Certificate of Completion</text>
  <text x="550" y="250" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="20" font-style="italic" fill="#59626B">This certifies that</text>
  <text x="550" y="320" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="44" fill="#15191D">${e(name || "Name not entered")}</text>
  <line x1="260" y1="340" x2="840" y2="340" stroke="#A3ACB4"/>
  <text x="550" y="390" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="20" font-style="italic" fill="#59626B">has satisfied the requirements of</text>
  <text x="550" y="440" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="28" fill="#15191D">${e(c.code)} · ${e(title)}</text>
  <text x="550" y="482" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" fill="#15191D">${e(L.name)} level · ${c.chapters.length} chapters · approximately ${e(c.hours || "—")} study hours</text>
  <text x="550" y="520" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" fill="#59626B">Basis: ${e(info ? info.basis : "—")} · Final examination ${info ? pct(info.score) : "—"}</text>
  <line x1="140" y1="640" x2="440" y2="640" stroke="#15191D"/>
  <text x="290" y="666" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" fill="#59626B">Dr. Professor, instructor of record</text>
  <line x1="660" y1="640" x2="960" y2="640" stroke="#15191D"/>
  <text x="810" y="630" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="17" fill="#15191D">${e(date(p.cert ? p.cert.at : Date.now()))}</text>
  <text x="810" y="666" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" fill="#59626B">Date issued</text>
  <text x="550" y="716" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#59626B">Certificate no. ${e(no)}</text>
</svg>`;
}
function viewCert(c) {
  const p = S.prog[c.id];
  if (!p) { loadProg(c.id).then(() => S.view === "cert" && render()); return `<p class="muted">Opening…</p>`; }
  const info = certInfo(c, p);
  if (!info) return `<div class="stack col"><div class="stack-sm"><div class="eyebrow">${esc(c.code)} · Certificate</div><h1 class="h1">Not earned yet</h1></div>
    <p class="lede">Pass the final examination (${pct(PASS_FINAL)}) to earn the certificate for ${esc(c.title)}.</p>
    <div class="row"><button class="btn" data-act="open-final">Go to the final examination</button></div></div>`;
  if (!p.cert) { p.cert = { at: Date.now(), no: rand(6) }; saveProg(c.id, true); }
  return `<div class="stack"><div class="stack-sm col"><div class="eyebrow">${esc(c.code)} · Certificate</div><h1 class="h1">Certificate of completion</h1>
    <div class="field" style="max-width:420px"><label for="cert-name">Name to print on the certificate</label><input class="input" id="cert-name" data-inp="cert-name" maxlength="80" value="${esc(S.profile.name || "")}" placeholder="Your full name"></div></div>
    <div class="cert-wrap" id="cert-svg">${certSVG(c, p, S.profile.name)}</div>
    <div class="row"><button class="btn" data-act="save-cert" id="save-cert-btn">Save certificate (.svg)</button><span class="status" id="cert-status"></span></div></div>`;
}

function viewNotebook(c) {
  const p = S.prog[c.id];
  if (!p) { loadProg(c.id).then(() => S.view === "notebook" && render()); return `<p class="muted">Opening…</p>`; }
  const rows = [];
  c.chapters.forEach((ch, i) => {
    const n = i + 1;
    const secs = ch.sections.map((s, j) => ({ sec: `${n}.${j + 1}`, title: s.title, note: p.notes[`${n}.${j + 1}`] })).filter((x) => x.note && x.note.trim());
    const cx = Object.entries(p.challenge).filter(([k, v]) => k.startsWith(n + "#") && v.text);
    if (secs.length || cx.length) rows.push(`<div class="stack-sm"><div class="sec-head"><h2 class="h3">Chapter ${n}. ${esc(ch.title)}</h2></div>
      ${secs.map((x) => `<div><div class="small"><span class="num muted">${x.sec}</span> <strong>${esc(x.title)}</strong></div><div class="prose">${paras(x.note)}</div></div>`).join("")}
      ${cx.map(([k, v]) => `<div><div class="small"><strong>Challenge ${esc(k.replace("#", "."))}</strong>${v.grade ? ` · graded ${esc(v.grade.score)}/100` : ""}</div><div class="prose">${paras(v.text)}</div></div>`).join("")}</div>`);
  });
  return `<div class="stack col"><div class="stack-sm"><div class="eyebrow">${esc(c.code)} · Notebook</div><h1 class="h1">Your notes</h1>
    <p class="small muted">Notes and challenge submissions are private to you. Write them in each chapter; they collect here.</p></div>
    ${rows.length ? rows.join("") : `<div class="empty">No notes yet. Open a chapter and write in the yellow note box under any section.</div>`}
    ${rows.length ? `<div class="row"><button class="btn" data-act="save-notes">Save notes (.md)</button><span class="status" id="notes-status"></span></div>` : ""}</div>`;
}

function viewTranscript() {
  if (!S.catalogLoaded) return `<p class="muted">Loading…</p>`;
  loadAllProg();
  const list = [...S.courses.values()].filter((c) => S.prog[c.id] && (Object.keys(S.prog[c.id].read).length || Object.keys(S.prog[c.id].quiz).length || S.prog[c.id].final));

async function writeChapter(c, n) {
  const key = `${c.id}:${n}`;
  const path = chapterPath(c.id, n);
  const existing = (await Store.get(path)) || S.chapters[key] || {};
  S.chapters[key] = existing;
  const todo = ["lesson", "figures", "assess"].filter((k) => !existing[k]);
  const needReview = !(existing.review && existing.review.full);
  if (!todo.length && !needReview) { render(); return; }
  const ctl = new AbortController(); ctls[key] = ctl;
  const g = S.gen[key] = { running: true, parts: {} };
  todo.forEach((k) => (g.parts[k] = { state: "run", len: 0 }));
  if (needReview) g.parts.review = { state: "wait" };
  const refresh = () => { const box = $("#gen-box"); if (box && S.view === "chapter" && S.chapterN === n && S.courseId === c.id) box.innerHTML = genBox(c, n, S.chapters[key]); };
  refresh();
  let lastPaint = 0;
  const onLen = (k) => (len) => { g.parts[k].len = len; const now = Date.now(); if (now - lastPaint > 400) { lastPaint = now; refresh(); } };
  const run = async (k) => {
    try {
      const raw = await askJSON(PROMPTS[k](c, n), { signal: ctl.signal, onLen: onLen(k) });
      const val = k === "lesson" ? normLesson(raw, c, n) : k === "figures" ? normFigures(raw) : normAssess(raw);
      const doc = { ...S.chapters[key], [k]: val, n, updatedAt: Date.now() };
      S.chapters[key] = doc;
      g.parts[k] = { state: "done" };
      await Store.set(path, doc);
      if (k === "lesson") await Store.merge(coursePath(c.id), { written: { [n]: Date.now() } }).catch(() => {});
    } catch (e) {
      g.parts[k] = { state: "err", msg: e && e.code ? errCopy(e) : saveErr(e) };
    }
    refresh();
  };
  await Promise.all(todo.map(run));
  const doc = S.chapters[key];
  if (needReview) {
    if (ctl.signal.aborted) g.parts.review = { state: "err", msg: errCopy({ code: "cancelled" }) };
    else if (!doc.lesson || !doc.assess) g.parts.review = { state: "err", msg: "The fact-check runs once the text and assessments are written; retry the failed part first." };
    else {
      g.parts.review = { state: "run", len: 0 }; refresh();
      try {
        await factCheck(c, n, doc, ctl.signal, onLen("review"));
        g.parts.review = { state: "done" };
        await Store.set(path, doc);
      } catch (e) { g.parts.review = { state: "err", msg: e && e.code ? errCopy(e) : saveErr(e) }; }
    }
    refresh();
  }
  g.running = false;
  const cc = S.courses.get(c.id);
  if (cc && doc.lesson) { cc.written = { ...(cc.written || {}), [n]: Date.now() }; }
  if (S.view === "chapter" && S.courseId === c.id && S.chapterN === n) {
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
}

/* ----- accuracy: fact-check, blind answer-key check, learner error reports ----- */
const unesc = (s) => String(s).replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
const svgLabels = (svg) => [...String(svg).matchAll(/<text[^>]*>([^<]+)<\/text>/g)].map((m) => unesc(m[1]).trim()).filter(Boolean);
function keyItems(chap) {
  const items = [];
  chap.lesson.sections.forEach((s) => s.practice.forEach((p, i) => { if (p.type === "mc") items.push({ id: `P${s.n}-${i}`, ref: p }); }));
  arr(chap.assess && chap.assess.quiz).forEach((q, i) => items.push({ id: `Q${i + 1}`, ref: q }));
  return items;
}
const mcText = (q) => q.choices.map((ch, j) => `  ${LETTERS[j]}. ${ch}`).join("\n");
function sectionText(chap, s) {
  const out = [`## Section ${s.n} ${s.title}`, ...s.reading];
  if (s.keyTerms.length) out.push("Key terms:\n" + s.keyTerms.map((t) => `- ${t.term}: ${t.def}`).join("\n"));
  if (s.example.steps.length) out.push(`${s.example.title}\n${s.example.steps.map((x, i) => `${i + 1}. ${x}`).join("\n")}\nTakeaway: ${s.example.takeaway}`);
  if (s.misconception && s.misconception.myth) out.push(`Misconception. Myth: ${s.misconception.myth}\nFact: ${s.misconception.fact}`);
  s.practice.forEach((p, i) => out.push(p.type === "mc"
    ? `[P${s.n}-${i}] ${p.q}\n${mcText(p)}\n  Key: ${LETTERS[p.answer]}. Explanation: ${p.explanation}`
    : `[P${s.n}-${i}] (short answer) ${p.q}\n  Model answer: ${p.answer}\n  Explanation: ${p.explanation}`));
  arr(chap.figures).filter((f) => f.section === s.n).forEach((f) => out.push(`Figure for ${s.n}. Caption: ${f.caption}\n  Labels: ${svgLabels(f.svg).join(" | ")}`));
  return out.join("\n\n");
}
function chapterText(chap) {
  const L = chap.lesson, A = chap.assess || {};
  const out = ["## Overview", L.overview, "Objectives: " + L.objectives.join("; "), ...L.sections.map((s) => sectionText(chap, s))];
  const secIds = new Set(L.sections.map((s) => s.n));
  arr(chap.figures).filter((f) => !secIds.has(f.section)).forEach((f) => out.push(`Figure. Caption: ${f.caption}\n  Labels: ${svgLabels(f.svg).join(" | ")}`));
  if (arr(A.slides).length) out.push("## Lecture slides\n" + A.slides.map((s, i) => `${i + 1}. ${s.title}: ${s.bullets.join(" / ")}\n   Notes: ${s.notes}`).join("\n"));
  if (arr(A.quiz).length) out.push("## Quiz\n" + A.quiz.map((q, i) => `[Q${i + 1}] ${q.q}\n${mcText(q)}\n  Key: ${LETTERS[q.answer]}. Explanation: ${q.explanation}`).join("\n\n"));
  if (arr(A.challenge).length) out.push("## Challenge exercises\n" + A.challenge.map((x) => `${x.title}: ${x.prompt} Deliverable: ${x.deliverable} Rubric: ${x.rubric.join("; ")}`).join("\n"));
  if (arr(A.readings).length) out.push("## Readings\n" + A.readings.map((r, i) => `[R${i + 1}] ${r.citation} ${r.pages ? "(" + r.pages + ")" : ""} — ${r.why}`).join("\n"));
  return out.filter(Boolean).join("\n\n");
}
function applyFix(scope, quote, correction) {
  if (!quote || quote === correction) return false;
  const xml = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let done = false;
  const walk = (o) => {
    if (done || !o || typeof o !== "object") return;
    for (const k of Object.keys(o)) {
      if (done) return;
      const v = o[k];
      if (typeof v === "string") {
        if (k === "svg") { const q = ">" + xml(quote) + "<"; if (v.includes(q)) { o[k] = v.replace(q, () => ">" + xml(correction) + "<"); done = true; } }
        else if (v.includes(quote)) { o[k] = v.replace(quote, () => correction); done = true; }
      } else walk(v);
    }
  };
  walk(scope);
  return done;
}
async function resolveKeys(c, items, blind, extra, signal) {
  const byId = {};
  arr(blind).forEach((b) => { byId[str(b.id)] = b; });
  const disputes = items.filter((it) => { const b = byId[it.id]; return !b || +b.answer !== it.ref.answer || str(b.problem) || extra[it.id]; })
    .map((it) => ({ ...it, blind: byId[it.id], extra: extra[it.id] }));
  const keyFixes = [];
  if (disputes.length) {
    const res = arr(await askJSON(PROMPTS.adjudicate(c, disputes), { signal, tier: "complex" }));
    for (const r of res) {
      const it = disputes.find((d) => d.id === str(r.id));
      if (!it) continue;
      const q = it.ref, before = LETTERS[q.answer];
      const rw = r.rewrite && typeof r.rewrite === "object" ? normMC(r.rewrite) : null;
      if (rw && rw.q) {
        q.q = rw.q; q.choices = rw.choices; q.answer = rw.answer; q.explanation = str(r.explanation) || q.explanation;
        keyFixes.push({ id: it.id, from: before, to: `${LETTERS[q.answer]} (question rewritten)`, why: str(r.explanation) });
      } else if (Number.isInteger(+r.answer) && +r.answer >= 0 && +r.answer < q.choices.length && +r.answer !== q.answer) {
        q.answer = +r.answer; q.explanation = str(r.explanation) || q.explanation;
        keyFixes.push({ id: it.id, from: before, to: LETTERS[q.answer], why: str(r.explanation) });
      }
    }
  }
  return { keysChecked: items.length, keysAgreed: items.length - disputes.length, keyFixes };
}
async function factCheck(c, n, chap, signal, onLen) {
  const items = keyItems(chap);
  const [fc, blind] = await Promise.all([
    askJSON(PROMPTS.factcheck(c, n, chap), { signal, tier: "complex", onLen }),
    items.length ? askJSON(PROMPTS.blindKeys(c, items), { signal, tier: "complex" }) : [],
  ]);
  const extra = {};
  arr(fc.keys).forEach((k) => { if (str(k.id)) extra[str(k.id)] = str(k.problem) || "flagged"; });
  const kr = await resolveKeys(c, items, blind, extra, signal);
  const scope = { lesson: chap.lesson, figures: chap.figures, assess: chap.assess };
  const corrections = arr(fc.issues).map((i) => ({ where: str(i.where), before: str(i.quote), after: str(i.correction), why: str(i.problem), severity: str(i.severity) }))
    .filter((x) => x.before && x.after && x.before !== x.after);
  corrections.forEach((x) => { x.applied = applyFix(scope, x.before, x.after); });
  const removed = [];
  if (chap.assess) {
    const verdict = {};
    arr(fc.readings).forEach((r) => { verdict[str(r.id)] = str(r.verdict); });
    chap.assess.readings = chap.assess.readings.filter((r, i) => {
      const v = verdict["R" + (i + 1)];
      if (v === "likely-invented") { removed.push(r.citation); return false; }
      if (v === "uncertain") r.unverified = true; else if (v === "real") r.checked = true;
      return true;
    });
  }
  chap.review = { full: true, at: Date.now(), ...kr, corrections: [...arr(chap.review && chap.review.corrections), ...corrections], readingsRemoved: removed, summary: str(fc.summary) };
}
async function errSubmit(c, n, sec) {
  const ta = document.getElementById("err-text-" + sec);
  const text = str(ta && ta.value);
  if (!text) { if (ta) ta.focus(); return; }
  const chap = S.chapters[`${c.id}:${n}`];
  const s = chap.lesson.sections.find((x) => x.n === sec);
  const id = `e-${Date.now()}-${rand(4)}`;
  const e = { id, n, sec, text: text.slice(0, 4000), at: Date.now(), by: Store.uid || null, status: "checking" };
  S.errata[c.id] = [...arr(S.errata[c.id]), e];
  S.errOpen[`${c.id}:${sec}`] = false;
  const el = document.getElementById("err-" + sec); if (el) el.outerHTML = errataBlock(c, n, sec);
  const save = () => { const { id: _id, ...doc } = e; return Store.set(`courses/${c.id}/errata/${id}`, doc).catch(() => {}); };
  save();
  try {
    const res = await askJSON(PROMPTS.errata(c, chap, s, e.text), { tier: "complex" });
    e.status = ["error", "partly", "not-an-error"].includes(res.verdict) ? res.verdict : "partly";
    e.reply = str(res.reply);
    e.fixes = arr(res.fixes).map((f) => ({ quote: str(f.quote), correction: str(f.correction) })).filter((f) => f.quote && f.correction && f.quote !== f.correction);
    const scope = { lesson: chap.lesson, figures: chap.figures, assess: chap.assess };
    e.fixes.forEach((f) => { f.applied = applyFix(scope, f.quote, f.correction); });
    const applied = e.fixes.filter((f) => f.applied);
    if (applied.length) {
      chap.review = chap.review || { at: Date.now(), corrections: [] };
      chap.review.corrections = [...arr(chap.review.corrections), ...applied.map((f) => ({ where: `${sec} (learner report)`, before: f.quote, after: f.correction, why: e.reply, severity: "error", applied: true }))];
      await Store.set(chapterPath(c.id, n), chap);
    }
  } catch (err) { e.status = "failed"; e.reply = errCopy(err); }
  await save();
  if (S.view === "chapter" && S.courseId === c.id && S.chapterN === n) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}

async function writeFinal(c) {
  const k = "final:" + c.id;
  const ctl = new AbortController(); ctls[k] = ctl;
  S.busy[k] = true; S.gen[k + ":err"] = ""; render();
  const status = (t) => { S.gen[k] = t; const el = $("#main .status"); if (el) el.textContent = t; };
  try {
    const raw = await askJSON(PROMPTS.final(c), { signal: ctl.signal, onLen: (len) => status(`Writing: ${(len / 1000).toFixed(1)}k characters`) });
    const questions = arr(raw.questions).map(normMC).filter((q) => q && q.q);
    if (questions.length < 8) throw { code: "bad_shape" };
    status("Checking the answer key: every question re-solved blind…");
    const items = questions.map((q, i) => ({ id: `F${i + 1}`, ref: q }));
    const blind = await askJSON(PROMPTS.blindKeys(c, items), { signal: ctl.signal, tier: "complex" });
    const check = await resolveKeys(c, items, blind, {}, ctl.signal);
    const doc = { questions, at: Date.now(), check: { ...check, at: Date.now() } };
    await Store.set(finalPath(c.id), doc);
    S.finals[c.id] = doc;
  } catch (e) {
    S.gen[k + ":err"] = e && e.code ? errCopy(e) : saveErr(e);
  }
  S.busy[k] = false;
  if (S.view === "final") render();
}

async function grade(c, n, i) {
  const A = S.chapters[`${c.id}:${n}`].assess, x = A.challenge[i];
  const p = S.prog[c.id], k = `${n}#${i}`, rec = p.challenge[k] = p.challenge[k] || {};
  const box = () => $("#cx-" + i);
  if (!str(rec.text)) { rec.err = "Write your submission first."; box().innerHTML = challenge(c, n, i, x); return; }
  const bk = "grade:" + c.id + ":" + k;
  S.busy[bk] = true; rec.err = ""; box().innerHTML = challenge(c, n, i, x);
  try {
    const g = await askJSON(PROMPTS.grade(c, x, rec.text.slice(0, 20000)));
    const score = Math.max(0, Math.min(100, Math.round(Number(g.score) || 0)));
    rec.grade = { score, verdict: str(g.verdict), next: str(g.next), rubric: arr(g.rubric).map((r) => ({ criterion: str(r.criterion), met: str(r.met).toLowerCase(), comment: str(r.comment) })), at: Date.now() };
    saveProg(c.id, true);
  } catch (e) { rec.err = errCopy(e); }
