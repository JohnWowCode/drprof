  <text x="516" y="296" font-size="14" fill="#2F7D4F">Solid green: Gen 4</text>
  <text x="516" y="326" font-size="14" fill="#444444">After 4 generations the same five-</text>
  <text x="516" y="346" font-size="14" fill="#444444">cell shape is back, shifted one cell</text>
  <text x="516" y="366" font-size="14" fill="#444444">down and one cell right. It keeps</text>
  <text x="516" y="386" font-size="14" fill="#444444">going forever on an empty grid.</text>
  <text x="516" y="416" font-size="14" fill="#444444">The motion is emergent: it comes</text>
  <text x="516" y="436" font-size="14" fill="#444444">from the rules interacting.</text>
