  <rect width="800" height="480" fill="#ffffff"/>
  <defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#444444"/></marker></defs>
  <g font-family="Helvetica, Arial, sans-serif">
  <text x="30" y="36" font-size="18" fill="#222222">Three rules, one traveling glider: Conway’s Game of Life</text>
  <rect x="30" y="56" width="262" height="396" rx="12" fill="#EFE0B4" fill-opacity="0.45" stroke="#A0781A" stroke-width="1.5"/>
  <text x="46" y="84" font-size="15" fill="#7F5F14" font-weight="bold">The rules (applied to every cell</text>
  <text x="46" y="105" font-size="15" fill="#7F5F14" font-weight="bold">at once, each generation)</text>
  <text x="46" y="136" font-size="15" fill="#444444">Each square cell is alive or dead</text>
  <text x="46" y="157" font-size="15" fill="#444444">and has 8 neighbors.</text>
  <text x="46" y="188" font-size="15" fill="#C8691C">Birth: a dead cell with exactly</text>
  <text x="46" y="209" font-size="15" fill="#C8691C">3 live neighbors comes alive.</text>
  <text x="46" y="240" font-size="15" fill="#2F7D4F">Survival: a live cell with 2 or 3</text>
  <text x="46" y="261" font-size="15" fill="#2F7D4F">live neighbors stays alive.</text>
  <text x="46" y="292" font-size="15" fill="#B0303A">Death: every other live cell dies,</text>
  <text x="46" y="313" font-size="15" fill="#B0303A">from too few or too many</text>
  <text x="46" y="334" font-size="15" fill="#B0303A">neighbors.</text>
  <text x="46" y="365" font-size="15" fill="#444444">No rule mentions motion,</text>
  <text x="46" y="386" font-size="15" fill="#444444">shape or direction.</text>
  <text x="320" y="70" font-size="15" fill="#444444">Five generations of a glider (5 by 5 window)</text>
  <text x="357" y="86" font-size="14" text-anchor="middle" fill="#444444">Gen 0</text>
