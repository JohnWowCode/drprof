<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#ffffff"/>
  <defs>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6B4FA0"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2F7D4F"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2E6DA4"/></marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="20" y="32" font-size="18" fill="#222222">Three nested loops in Slay the Spire (2019)</text>

    <!-- META -->
    <rect x="20" y="46" width="760" height="426" rx="16" fill="#F4F0FA" stroke="#6B4FA0" stroke-width="2"/>
    <text x="40" y="68" font-size="15" font-weight="bold" fill="#6B4FA0">Meta loop: across many runs</text>
    <rect x="50" y="78" width="170" height="46" rx="8" fill="#DCD2EE" stroke="#6B4FA0"/>
    <text x="135" y="97" font-size="14" text-anchor="middle" fill="#6B4FA0">Run ends:</text>
    <text x="135" y="115" font-size="14" text-anchor="middle" fill="#6B4FA0">a win or a death</text>
    <rect x="255" y="78" width="290" height="46" rx="8" fill="#DCD2EE" stroke="#6B4FA0"/>
    <text x="400" y="97" font-size="14" text-anchor="middle" fill="#6B4FA0">Score unlocks cards and relics;</text>
    <text x="400" y="115" font-size="14" text-anchor="middle" fill="#6B4FA0">a win unlocks the next Ascension</text>
    <rect x="580" y="78" width="170" height="46" rx="8" fill="#DCD2EE" stroke="#6B4FA0"/>
    <text x="665" y="97" font-size="14" text-anchor="middle" fill="#6B4FA0">A new run starts</text>
    <text x="665" y="115" font-size="14" text-anchor="middle" fill="#6B4FA0">at the bottom</text>
    <path d="M221 101 L 252 101" stroke="#6B4FA0" stroke-width="2" marker-end="url(#mp)"/>
    <path d="M546 101 L 577 101" stroke="#6B4FA0" stroke-width="2" marker-end="url(#mp)"/>
    <path d="M751 101 L 766 101 L 766 462 L 34 462 L 34 101 L 47 101" fill="none" stroke="#6B4FA0" stroke-width="2" marker-end="url(#mp)"/>

    <!-- SESSION -->
    <rect x="50" y="136" width="700" height="318" rx="14" fill="#EEF7EF" stroke="#2F7D4F" stroke-width="2"/>
    <text x="70" y="158" font-size="15" font-weight="bold" fill="#2F7D4F">Session loop: one run, floor by floor</text>
    <rect x="110" y="168" width="125" height="46" rx="8" fill="#C4E3C9" stroke="#2F7D4F"/>
    <text x="172" y="187" font-size="14" text-anchor="middle" fill="#2F7D4F">Pick a path</text>
    <text x="172" y="205" font-size="14" text-anchor="middle" fill="#2F7D4F">on the map</text>
    <rect x="261" y="168" width="125" height="46" rx="8" fill="#C4E3C9" stroke="#2F7D4F"/>
    <text x="323" y="187" font-size="14" text-anchor="middle" fill="#2F7D4F">Enter a room:</text>
    <text x="323" y="205" font-size="14" text-anchor="middle" fill="#2F7D4F">fight, shop, rest</text>
    <rect x="412" y="168" width="125" height="46" rx="8" fill="#C4E3C9" stroke="#2F7D4F"/>
    <text x="474" y="187" font-size="14" text-anchor="middle" fill="#2F7D4F">Reward: 1 of 3</text>
    <text x="474" y="205" font-size="14" text-anchor="middle" fill="#2F7D4F">cards, gold, relic</text>
    <rect x="565" y="168" width="125" height="46" rx="8" fill="#C4E3C9" stroke="#2F7D4F"/>
    <text x="627" y="187" font-size="14" text-anchor="middle" fill="#2F7D4F">Deck changes;</text>
    <text x="627" y="205" font-size="14" text-anchor="middle" fill="#2F7D4F">next floor</text>
    <path d="M236 191 L 258 191" stroke="#2F7D4F" stroke-width="2" marker-end="url(#mg)"/>
    <path d="M387 191 L 409 191" stroke="#2F7D4F" stroke-width="2" marker-end="url(#mg)"/>
    <path d="M538 191 L 562 191" stroke="#2F7D4F" stroke-width="2" marker-end="url(#mg)"/>
    <path d="M691 191 L 730 191 L 730 434 L 70 434 L 70 191 L 107 191" fill="none" stroke="#2F7D4F" stroke-width="2" marker-end="url(#mg)"/>
    <path d="M323 215 L 323 238" stroke="#2E6DA4" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- CORE -->
    <rect x="90" y="240" width="620" height="164" rx="12" fill="#E8F0F9" stroke="#2E6DA4" stroke-width="2"/>
    <text x="110" y="262" font-size="15" font-weight="bold" fill="#2E6DA4">Core loop: one turn of a fight</text>
    <rect x="120" y="274" width="122" height="46" rx="8" fill="#BBD5EE" stroke="#2E6DA4"/>
    <text x="181" y="293" font-size="14" text-anchor="middle" fill="#2E6DA4">Draw 5 cards</text>
    <text x="181" y="311" font-size="14" text-anchor="middle" fill="#2E6DA4">from the deck</text>
    <rect x="267" y="274" width="122" height="46" rx="8" fill="#BBD5EE" stroke="#2E6DA4"/>
    <text x="328" y="293" font-size="14" text-anchor="middle" fill="#2E6DA4">Read enemy</text>
    <text x="328" y="311" font-size="14" text-anchor="middle" fill="#2E6DA4">intents</text>
    <rect x="413" y="274" width="122" height="46" rx="8" fill="#BBD5EE" stroke="#2E6DA4"/>
    <text x="474" y="293" font-size="14" text-anchor="middle" fill="#2E6DA4">Spend 3 energy</text>
    <text x="474" y="311" font-size="14" text-anchor="middle" fill="#2E6DA4">playing cards</text>
    <rect x="558" y="274" width="122" height="46" rx="8" fill="#BBD5EE" stroke="#2E6DA4"/>
    <text x="619" y="293" font-size="14" text-anchor="middle" fill="#2E6DA4">End turn;</text>
    <text x="619" y="311" font-size="14" text-anchor="middle" fill="#2E6DA4">enemies act</text>
    <path d="M243 297 L 264 297" stroke="#2E6DA4" stroke-width="2" marker-end="url(#mb)"/>
    <path d="M390 297 L 410 297" stroke="#2E6DA4" stroke-width="2" marker-end="url(#mb)"/>
    <path d="M536 297 L 555 297" stroke="#2E6DA4" stroke-width="2" marker-end="url(#mb)"/>
    <path d="M619 321 L 619 342 L 181 342 L 181 324" fill="none" stroke="#2E6DA4" stroke-width="2" marker-end="url(#mb)"/>
    <text x="400" y="368" font-size="14" text-anchor="middle" fill="#2E6DA4">Repeat each turn until the fight is won or lost</text>
    <text x="400" y="390" font-size="14" text-anchor="middle" fill="#444444">Inner loops run many times for each turn of an outer loop</text>

    <text x="400" y="426" font-size="14" text-anchor="middle" fill="#2F7D4F">Repeat floor by floor until the run ends</text>
  </g>
</svg>
