<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#ffffff"/>
  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222222">Tetris as a system: a loop of actions, rules, state and feedback</text>

  <!-- Player -->
  <rect x="30" y="196" width="160" height="96" rx="10" fill="#DCD2EE" stroke="#6B4FA0" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#6B4FA0" text-anchor="middle">
    <text x="110" y="226" font-size="17" font-weight="bold">Player</text>
    <text x="110" y="250" font-size="14">reads the well,</text>
    <text x="110" y="270" font-size="14">plans, decides</text>
  </g>

  <!-- Actions -->
  <rect x="250" y="66" width="240" height="92" rx="10" fill="#BBD5EE" stroke="#2E6DA4" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#2E6DA4" text-anchor="middle">
    <text x="370" y="94" font-size="17" font-weight="bold">Player actions</text>
    <text x="370" y="118" font-size="14">move, rotate or drop</text>
    <text x="370" y="138" font-size="14">the falling piece</text>
  </g>

  <!-- Rules -->
  <rect x="540" y="56" width="240" height="176" rx="10" fill="#C4E3C9" stroke="#2F7D4F" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#2F7D4F" text-anchor="middle">
    <text x="660" y="84" font-size="17" font-weight="bold">Rules</text>
    <text x="660" y="110" font-size="14">7 shapes fall into a</text>
    <text x="660" y="128" font-size="14">well 10 cells wide</text>
    <text x="660" y="152" font-size="14">a full row clears</text>
    <text x="660" y="176" font-size="14">more rows cleared:</text>
    <text x="660" y="194" font-size="14">higher level, faster fall</text>
    <text x="660" y="218" font-size="14">stack hits the top: game over</text>
  </g>

  <!-- State -->
  <rect x="540" y="290" width="240" height="100" rx="10" fill="#F6D2AE" stroke="#C8691C" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#A4520F" text-anchor="middle">
    <text x="660" y="318" font-size="17" font-weight="bold">Game state</text>
    <text x="660" y="342" font-size="14">the well, the next piece,</text>
    <text x="660" y="362" font-size="14">score, rows, level</text>
  </g>

  <!-- Feedback -->
  <rect x="250" y="330" width="240" height="96" rx="10" fill="#EFE0B4" stroke="#A0781A" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#7F5F14" text-anchor="middle">
    <text x="370" y="358" font-size="17" font-weight="bold">Feedback</text>
    <text x="370" y="382" font-size="14">rows flash and vanish,</text>
    <text x="370" y="402" font-size="14">numbers change, stack rises</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#444444" stroke-width="2.5">
    <polyline points="110,196 110,112 240,112"/>
    <line x1="490" y1="112" x2="530" y2="112"/>
    <line x1="660" y1="232" x2="660" y2="280"/>
    <line x1="540" y1="378" x2="500" y2="378"/>
    <polyline points="250,378 110,378 110,302"/>
  </g>
  <g fill="#444444">
    <polygon points="250,112 238,105 238,119"/>
    <polygon points="540,112 528,105 528,119"/>
    <polygon points="660,290 653,278 667,278"/>
    <polygon points="490,378 502,371 502,385"/>
    <polygon points="110,292 103,304 117,304"/>
  </g>

  <!-- Centre notes: the definition's other traits -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="370" y="214" fill="#B0303A" font-weight="bold">Goal: clear rows, score high,</text>
    <text x="370" y="234" fill="#B0303A" font-weight="bold">delay the end (endless mode: no win)</text>
    <text x="370" y="272" fill="#444444">Voluntary: the player may</text>
    <text x="370" y="292" fill="#444444">stop at any moment</text>
  </g>
  <text x="776" y="464" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="end">Diagram of the logic, not of the screen</text>
</svg>
