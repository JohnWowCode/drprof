<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
<rect width="800" height="480" fill="#ffffff"/>
<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#444444" text-anchor="start" font-weight="bold">From a feeling to a check</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#444444"/></marker></defs>
<text x="128" y="70" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#B0303A" text-anchor="start" font-weight="bold">Vague word</text>
<text x="340" y="70" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#444444" text-anchor="start" font-weight="bold">What you would observe</text>
<text x="572" y="70" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2F7D4F" text-anchor="start" font-weight="bold">Check: pass or fail</text>
<text x="24" y="128" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2E6DA4" text-anchor="start" font-weight="bold">Interface</text>
<rect x="128" y="86" width="184" height="64" rx="6" fill="#F2C4C8" stroke="#B0303A" stroke-width="1.5"/>
<text x="220" y="124" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="middle" font-weight="bold">“readable” HUD</text>
<rect x="340" y="86" width="204" height="64" rx="6" fill="#BBD5EE" stroke="#2E6DA4" stroke-width="1.5"/>
<text x="442" y="114" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">text stands out</text>
<text x="442" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">from the dusk sky</text>
<rect x="572" y="86" width="204" height="64" rx="6" fill="#C4E3C9" stroke="#2F7D4F" stroke-width="2"/>
<text x="674" y="114" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="normal">contrast at least 4.5:1</text>
<text x="674" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="normal">(WCAG 2.2, SC 1.4.3)</text>
<line x1="313" y1="118" x2="337" y2="118" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<line x1="545" y1="118" x2="569" y2="118" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="24" y="214" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2F7D4F" text-anchor="start" font-weight="bold">Game feel</text>
<rect x="128" y="172" width="184" height="64" rx="6" fill="#F2C4C8" stroke="#B0303A" stroke-width="1.5"/>
<text x="220" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="middle" font-weight="bold">“the jump feels good”</text>
<rect x="340" y="172" width="204" height="64" rx="6" fill="#C4E3C9" stroke="#2F7D4F" stroke-width="1.5"/>
<text x="442" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">height, hang time,</text>
<text x="442" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">short hops on a tap</text>
<rect x="572" y="172" width="204" height="64" rx="6" fill="#C4E3C9" stroke="#2F7D4F" stroke-width="2"/>
<text x="674" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="normal">full jump 3 tiles (96 px),</text>
<text x="674" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="normal">top reached in about 0.4 s</text>
<line x1="313" y1="204" x2="337" y2="204" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<line x1="545" y1="204" x2="569" y2="204" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="24" y="300" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6B4FA0" text-anchor="start" font-weight="bold">Image</text>
<rect x="128" y="258" width="184" height="64" rx="6" fill="#F2C4C8" stroke="#B0303A" stroke-width="1.5"/>
<text x="220" y="296" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="middle" font-weight="bold">“cozy” title art</text>
<rect x="340" y="258" width="204" height="64" rx="6" fill="#DCD2EE" stroke="#6B4FA0" stroke-width="1.5"/>
<text x="442" y="286" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">warm lamp light</text>
<text x="442" y="306" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">against a cool sky</text>
<rect x="572" y="258" width="204" height="64" rx="6" fill="#C4E3C9" stroke="#2F7D4F" stroke-width="2"/>
<text x="674" y="286" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="normal">only the 4 palette colors;</text>
<text x="674" y="306" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="normal">lamp is the brightest spot</text>
<line x1="313" y1="290" x2="337" y2="290" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<line x1="545" y1="290" x2="569" y2="290" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="24" y="386" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#C8691C" text-anchor="start" font-weight="bold">Sound</text>
<rect x="128" y="344" width="184" height="64" rx="6" fill="#F2C4C8" stroke="#B0303A" stroke-width="1.5"/>
<text x="220" y="382" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="middle" font-weight="bold">“punchy” lamp sound</text>
<rect x="340" y="344" width="204" height="64" rx="6" fill="#F6D2AE" stroke="#C8691C" stroke-width="1.5"/>
<text x="442" y="372" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">sharp start,</text>
<text x="442" y="392" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">quick fade</text>
<rect x="572" y="344" width="204" height="64" rx="6" fill="#C4E3C9" stroke="#2F7D4F" stroke-width="2"/>
<text x="674" y="372" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="normal">under 1 s, loudest at the</text>
<text x="674" y="392" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="normal">start, no echo afterwards</text>
<line x1="313" y1="376" x2="337" y2="376" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<line x1="545" y1="376" x2="569" y2="376" stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="24" y="456" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start" font-weight="normal">Write the check before you look or listen. Jump and sound targets are Lamplighter design choices, not standards.</text>
</svg>
