<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#ffffff"/>
  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222222">Day and night on a spinning Earth, seen from above the North Pole</text>
  <line x1="48.0" y1="172.0" x2="218.0" y2="172.0" stroke="#C8691C" stroke-width="2.5"/>
  <polygon points="228.0,172.0 218.0,177.0 218.0,167.0" fill="#C8691C"/>
  <line x1="48.0" y1="212.0" x2="218.0" y2="212.0" stroke="#C8691C" stroke-width="2.5"/>
  <polygon points="228.0,212.0 218.0,217.0 218.0,207.0" fill="#C8691C"/>
  <line x1="48.0" y1="312.0" x2="218.0" y2="312.0" stroke="#C8691C" stroke-width="2.5"/>
  <polygon points="228.0,312.0 218.0,317.0 218.0,307.0" fill="#C8691C"/>
  <line x1="48.0" y1="352.0" x2="218.0" y2="352.0" stroke="#C8691C" stroke-width="2.5"/>
  <polygon points="228.0,352.0 218.0,357.0 218.0,347.0" fill="#C8691C"/>
  <text x="48.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#C8691C" text-anchor="start" font-weight="bold">Sunlight</text>
  <text x="48.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="start">The Sun is far</text>
  <text x="48.0" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="start">off to the left</text>
  <path d="M430,150 A112,112 0 0 0 430,374 Z" fill="#BBD5EE" stroke="#2E6DA4" stroke-width="2"/>
  <path d="M430,150 A112,112 0 0 1 430,374 Z" fill="#444444" stroke="#444444" stroke-width="2"/>
  <circle cx="430" cy="262" r="112" fill="none" stroke="#2E6DA4" stroke-width="2"/>
  <text x="374.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2E6DA4" text-anchor="middle" font-weight="bold">Day side</text>
  <text x="486.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Night side</text>
  <circle cx="430" cy="262" r="4" fill="#222222"/>
  <text x="422.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="end">North</text>
  <text x="422.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="end">Pole</text>
  <line x1="430.0" y1="150.0" x2="430.0" y2="136.0" stroke="#B0303A" stroke-width="3"/>
  <circle cx="430.0" cy="150.0" r="5" fill="#B0303A"/>
  <text x="430.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#B0303A" text-anchor="middle" font-weight="bold">Sunrise</text>
  <line x1="318.0" y1="262.0" x2="304.0" y2="262.0" stroke="#B0303A" stroke-width="3"/>
  <circle cx="318.0" cy="262.0" r="5" fill="#B0303A"/>
  <text x="296.0" y="267.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#B0303A" text-anchor="end" font-weight="bold">Noon</text>
  <line x1="430.0" y1="374.0" x2="430.0" y2="388.0" stroke="#B0303A" stroke-width="3"/>
  <circle cx="430.0" cy="374.0" r="5" fill="#B0303A"/>
  <text x="430.0" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#B0303A" text-anchor="middle" font-weight="bold">Sunset</text>
  <line x1="542.0" y1="262.0" x2="556.0" y2="262.0" stroke="#B0303A" stroke-width="3"/>
  <circle cx="542.0" cy="262.0" r="5" fill="#B0303A"/>
  <text x="564.0" y="267.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#B0303A" text-anchor="start" font-weight="bold">Midnight</text>
  <path d="M571.7,226.7 A146,146 0 0 0 507.4,138.2" fill="none" stroke="#6B4FA0" stroke-width="3"/>
  <polygon points="497.2,131.8 511.1,132.2 503.7,144.1" fill="#6B4FA0"/>
  <text x="572.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6B4FA0" text-anchor="start">Earth spins this way,</text>
  <text x="572.0" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6B4FA0" text-anchor="start">once a day, west to east</text>
  <text x="600.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">The sky seems to turn</text>
  <text x="600.0" y="318.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">the other way: 15° every</text>
  <text x="600.0" y="336.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">hour (360° ÷ 24 hours).</text>
  <text x="24.0" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">You stand still on the ground while Earth carries you around. At sunrise you are carried into</text>
  <text x="24.0" y="457.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">sunlight; at sunset you are carried out of it. Not to scale: the real Sun is about 12,000 Earth widths away.</text>
</svg>
