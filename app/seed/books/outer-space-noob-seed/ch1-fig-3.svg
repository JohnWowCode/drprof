  <text x="138.0" y="92.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2E6DA4" text-anchor="middle" font-weight="bold">June solstice (about June 21)</text>
  <text x="662.0" y="92.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2E6DA4" text-anchor="middle" font-weight="bold">December solstice (about Dec 21)</text>
  <text x="138.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="middle">North leans toward the Sun</text>
  <text x="662.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="middle">North leans away from the Sun</text>
  <text x="164.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="end">Axis</text>
  <text x="688.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="end">Axis</text>
  <text x="230.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="start">40° N at noon:</text>
  <text x="230.0" y="167.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="start">Sun 73° high</text>
  <line x1="204.3" y1="238.8" x2="226.0" y2="160" stroke="#B0303A" stroke-width="1"/>
  <text x="570.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="end">40° N at noon:</text>
  <text x="570.0" y="167.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="end">Sun 27° high</text>
  <line x1="635.4" y1="198.8" x2="574.0" y2="160" stroke="#B0303A" stroke-width="1"/>
  <text x="138.0" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="middle">North: summer, long days</text>
  <text x="138.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="middle">South: winter, short days</text>
  <text x="662.0" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="middle">North: winter, short days</text>
  <text x="662.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="middle">South: summer, long days</text>
  <text x="400.0" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle">Dashed purple: Arctic and</text>
  <text x="400.0" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle">Antarctic Circles (66.6°)</text>
  <text x="24.0" y="420.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222222" text-anchor="start">The axis is tilted 23.4° and keeps pointing the same way in space (toward Polaris) all year.</text>
  <text x="24.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">Shaded half: night. Earth is actually closest to the Sun in early January, only about 3% closer</text>
  <text x="24.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">than in early July. Sizes and distances are not to scale, and the orbit is nearly a circle.</text>
</svg>
