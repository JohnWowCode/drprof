<text x="24.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">Pocket scale model: 1 AU = about 24 m (26 yards). Neptune is about 710 m (777 yards) out.</text>
<text x="24.0" y="442.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">Sunlight takes about 8.3 minutes to cross 1 AU, so it reaches Neptune in about 4 hours.</text>
<text x="24.0" y="468.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">Planet dots are not to scale; distances are average distances (NASA NSSDCA).</text>
