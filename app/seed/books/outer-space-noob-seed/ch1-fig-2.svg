  <text x="24.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#A0781A" text-anchor="start">Inner ring: the Moon in its orbit.</text>
  <text x="24.0" y="88.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#A0781A" text-anchor="start">The half facing the Sun is always lit.</text>
  <text x="24.0" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">Outer ring: what you see from Earth (Northern Hemisphere view). Earth’s shadow plays no part;</text>
  <text x="24.0" y="457.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">the new-to-new cycle takes about 29.5 days. Not to scale: the Moon is really about 30 Earth widths away.</text>
