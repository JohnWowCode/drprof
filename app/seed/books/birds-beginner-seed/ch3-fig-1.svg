<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
<rect width="800" height="480" fill="#ffffff"/>
<text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222222">One-way airflow through a bird’s lung (schematic, not to scale)</text>
<defs>
