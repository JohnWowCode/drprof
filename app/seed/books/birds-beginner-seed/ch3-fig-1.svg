<text x="20" y="104" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start">Trachea</text>
<line x1="76" y1="100" x2="116" y2="100" stroke="#444444" stroke-width="1"/>
<text x="176" y="128" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="start">Lung (parabronchi)</text>
<text x="62" y="318" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle">Cranial air sacs</text>
<text x="62" y="335" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle">(front)</text>
<text x="318" y="360" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle">Caudal air sacs</text>
<text x="318" y="377" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle">(rear)</text>
<text x="152" y="104" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="start">Fresh air</text>
<text x="560" y="128" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="start">Lung (parabronchi)</text>
<text x="412" y="104" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="start">Used air out</text>
<text x="20" y="404" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="start">Most fresh air passes the lung to the caudal sacs;</text>
<text x="20" y="421" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="start">air in the lung moves on to the cranial sacs.</text>
<text x="420" y="404" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="start">Caudal sacs push their fresh air through the lung;</text>
<text x="420" y="421" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="start">cranial sacs empty used air out the trachea.</text>
<text x="400" y="458" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2F7D4F" text-anchor="middle">In both phases air crosses the parabronchi in the same direction, from back to front.</text>
</svg>