<path d="M144 90 L144 140" fill="none" stroke="#2E6DA4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ab)"/>
<path d="M258 222 L284 266" fill="none" stroke="#2E6DA4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ab)"/>
<path d="M98 214 L78 236" fill="none" stroke="#C8691C" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="414" y="66" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">2. Breathing out</text>
<ellipse cx="462" cy="262" rx="44" ry="36" fill="#DCD2EE" stroke="#6B4FA0" stroke-width="2"/>
<ellipse cx="718" cy="300" rx="46" ry="42" fill="#DCD2EE" stroke="#6B4FA0" stroke-width="2"/>
<rect x="500" y="150" width="180" height="66" rx="12" fill="#C4E3C9" stroke="#2F7D4F" stroke-width="2"/>
<line x1="546" y1="164" x2="670" y2="164" stroke="#2F7D4F" stroke-width="1" stroke-opacity="0.6"/>
<line x1="546" y1="176" x2="670" y2="176" stroke="#2F7D4F" stroke-width="1" stroke-opacity="0.6"/>
<line x1="546" y1="188" x2="670" y2="188" stroke="#2F7D4F" stroke-width="1" stroke-opacity="0.6"/>
<path d="M525 88 L525 204 L652 204 L690 268" fill="none" stroke="#444444" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M525 88 L525 204 L652 204 L690 268" fill="none" stroke="#DDDDDD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
