<line x1="146" y1="188" x2="270" y2="188" stroke="#2F7D4F" stroke-width="1" stroke-opacity="0.6"/>
<path d="M125 88 L125 204 L252 204 L290 268" fill="none" stroke="#444444" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 88 L125 204 L252 204 L290 268" fill="none" stroke="#DDDDDD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M92 236 L112 214" fill="none" stroke="#444444" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 236 L112 214" fill="none" stroke="#DDDDDD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M318 258 L282 178" fill="none" stroke="#444444" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M318 258 L282 178" fill="none" stroke="#DDDDDD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
