<text x="160" y="222" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#A4520F" text-anchor="middle">Songbird (thrush)</text>
<text x="160" y="242" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#A4520F" text-anchor="middle">short legs; perches; slim bill</text>
<text x="405" y="222" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#B0303A" text-anchor="middle">Woodpecker</text>
<text x="405" y="242" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="middle">clings upright, braced on stiff tail</text>
<text x="650" y="222" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2E6DA4" text-anchor="middle">Duck</text>
<text x="650" y="242" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="middle">flat bill; sits low on the water</text>
<text x="160" y="430" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2F7D4F" text-anchor="middle">Heron</text>
<text x="160" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle">long legs, long neck, dagger bill</text>
<text x="405" y="430" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7F5F14" text-anchor="middle">Soaring hawk, from below</text>
<text x="405" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7F5F14" text-anchor="middle">broad wings, short fanned tail</text>
<text x="650" y="430" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6B4FA0" text-anchor="middle">Pigeon</text>
<text x="650" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle">small head, plump body</text>
