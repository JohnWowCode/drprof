<text x="275" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4">at right angles</text>
<text x="275" y="151" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4">to the airflow</text>
<text x="30" y="300" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#B0303A" font-weight="bold">Drag</text>
<text x="30" y="318" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A">opposite to the</text>
<text x="30" y="335" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A">direction of motion</text>
