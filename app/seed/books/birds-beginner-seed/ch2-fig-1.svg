<text x="222" y="420" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#444444" font-weight="bold">Weight</text>
<text x="222" y="438" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444">pulls straight down</text>
<text x="30" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0">Lift + drag together exactly</text>
<text x="30" y="113" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0">balance weight (dashed)</text>
