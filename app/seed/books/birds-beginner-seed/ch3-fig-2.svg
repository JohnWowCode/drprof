<path d="M604 316 Q596 350 560 362" fill="none" stroke="#2E6DA4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M604 316 Q596 350 560 362" fill="none" stroke="#BBD5EE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M604 316 Q610 360 580 384" fill="none" stroke="#2E6DA4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M604 316 Q610 360 580 384" fill="none" stroke="#BBD5EE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M604 316 L676 316" fill="none" stroke="#2F7D4F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M604 316 L676 316" fill="none" stroke="#C4E3C9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="700" cy="316" rx="24" ry="20" fill="#DCD2EE" stroke="#6B4FA0" stroke-width="2"/>
<line x1="724" y1="316" x2="742" y2="316" stroke="#6B4FA0" stroke-width="3"/>
<text x="40" y="76" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#A0781A" text-anchor="start">Beak: seizes and handles food; no teeth</text>
<line x1="66" y1="80" x2="64" y2="110" stroke="#A0781A" stroke-width="1"/>
<text x="176" y="128" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="start">Esophagus</text>
<line x1="170" y1="126" x2="146" y2="158" stroke="#C8691C" stroke-width="1"/>
<text x="24" y="262" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="start">Crop: stores food</text>
<text x="24" y="279" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="start">(pigeon ‘crop milk’ made here)</text>
<line x1="108" y1="256" x2="138" y2="222" stroke="#C8691C" stroke-width="1"/>
<text x="108" y="354" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="start">Proventriculus: glandular</text>
<text x="108" y="371" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B0303A" text-anchor="start">stomach, acid and enzymes</text>
<line x1="200" y1="342" x2="256" y2="294" stroke="#B0303A" stroke-width="1"/>
<text x="250" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#A0781A" text-anchor="start">Gizzard: muscular stomach,</text>
<text x="250" y="427" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#A0781A" text-anchor="start">grinds food with grit</text>
<line x1="320" y1="396" x2="342" y2="350" stroke="#A0781A" stroke-width="1"/>
<text x="430" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="start">Small intestine: digestion and absorption</text>
<line x1="470" y1="200" x2="460" y2="228" stroke="#2F7D4F" stroke-width="1"/>
<text x="384" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="start">Ceca: paired side pouches; fermentation</text>
<line x1="540" y1="438" x2="566" y2="370" stroke="#2E6DA4" stroke-width="1"/>
<text x="610" y="264" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="start">Large intestine</text>
<line x1="640" y1="268" x2="640" y2="308" stroke="#2F7D4F" stroke-width="1"/>
<text x="790" y="370" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="end">Cloaca: shared chamber;</text>
<text x="790" y="387" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="end">also receives uric acid</text>
<text x="790" y="404" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="end">from the kidneys</text>
<line x1="720" y1="356" x2="706" y2="336" stroke="#6B4FA0" stroke-width="1"/>
</svg>