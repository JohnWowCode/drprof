<path d="M196 234 L238 268" fill="none" stroke="#C8691C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 234 L238 268" fill="none" stroke="#F6D2AE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
