<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
<rect width="800" height="480" fill="#ffffff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222">Power on a log scale: from a phone charger to sunlight on Earth</text>
