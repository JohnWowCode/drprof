<line x1="176.7" y1="273" x2="176.7" y2="287" stroke="#444444" stroke-width="1.5"/>
<line x1="215.6" y1="276" x2="215.6" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="254.5" y1="276" x2="254.5" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="293.4" y1="273" x2="293.4" y2="287" stroke="#444444" stroke-width="1.5"/>
<line x1="332.3" y1="276" x2="332.3" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="371.2" y1="276" x2="371.2" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="410.1" y1="273" x2="410.1" y2="287" stroke="#444444" stroke-width="1.5"/>
<line x1="449.0" y1="276" x2="449.0" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="487.9" y1="276" x2="487.9" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="526.8" y1="273" x2="526.8" y2="287" stroke="#444444" stroke-width="1.5"/>
<line x1="565.7" y1="276" x2="565.7" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="604.6" y1="276" x2="604.6" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="643.5" y1="273" x2="643.5" y2="287" stroke="#444444" stroke-width="1.5"/>
<line x1="682.4" y1="276" x2="682.4" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="721.3" y1="276" x2="721.3" y2="284" stroke="#444444" stroke-width="1"/>
<line x1="760.2" y1="273" x2="760.2" y2="287" stroke="#444444" stroke-width="1.5"/>
<text x="60.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">1 W</text>
<text x="176.7" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">1 kW</text>
<text x="293.4" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">1 MW</text>
<text x="410.1" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">1 GW</text>
<text x="526.8" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">1 TW</text>
<text x="643.5" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">1 PW</text>
<text x="760.2" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" font-weight="normal">1 EW</text>
<text x="20.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start" font-weight="normal">Each major tick is a factor of 1,000. Values are average or rated power.</text>
<circle cx="110.6" cy="280" r="6" fill="#BBD5EE" stroke="#2E6DA4" stroke-width="2"/>
<line x1="110.6" y1="272" x2="110.6" y2="213" stroke="#2E6DA4" stroke-width="1"/>
<text x="118.6" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="end" font-weight="bold">Phone charger</text>
<text x="118.6" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="end" font-weight="normal">20 W</text>
<circle cx="137.3" cy="280" r="6" fill="#C4E3C9" stroke="#2F7D4F" stroke-width="2"/>
<line x1="137.3" y1="288" x2="137.3" y2="329" stroke="#2F7D4F" stroke-width="1"/>
<text x="137.3" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="bold">Human metabolism</text>
<text x="137.3" y="363.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2F7D4F" text-anchor="middle" font-weight="normal">2,000 kcal/day = 97 W</text>
<circle cx="178.9" cy="280" r="6" fill="#BBD5EE" stroke="#2E6DA4" stroke-width="2"/>
<line x1="178.9" y1="272" x2="178.9" y2="133" stroke="#2E6DA4" stroke-width="1"/>
<text x="178.9" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="middle" font-weight="bold">Home using</text>
<text x="178.9" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2E6DA4" text-anchor="middle" font-weight="normal">10,000 kWh/yr: 1.1 kW</text>
<circle cx="339.1" cy="280" r="6" fill="#F6D2AE" stroke="#C8691C" stroke-width="2"/>
<line x1="339.1" y1="272" x2="339.1" y2="213" stroke="#C8691C" stroke-width="1"/>
<text x="347.1" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="end" font-weight="bold">Large offshore</text>
<text x="347.1" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="end" font-weight="normal">wind turbine, 15 MW</text>
<circle cx="398.4" cy="280" r="6" fill="#F6D2AE" stroke="#C8691C" stroke-width="2"/>
<line x1="398.4" y1="272" x2="398.4" y2="133" stroke="#C8691C" stroke-width="1"/>
<text x="398.4" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="middle" font-weight="bold">Combined-cycle gas</text>
<text x="398.4" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C8691C" text-anchor="middle" font-weight="normal">plant, 500 MW</text>
<circle cx="546.1" cy="280" r="6" fill="#DCD2EE" stroke="#6B4FA0" stroke-width="2"/>
<line x1="546.1" y1="272" x2="546.1" y2="213" stroke="#6B4FA0" stroke-width="1"/>
<text x="546.1" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle" font-weight="bold">United States,</text>
<text x="546.1" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle" font-weight="normal">2024: 3.1 TW</text>
<circle cx="576.5" cy="280" r="6" fill="#DCD2EE" stroke="#6B4FA0" stroke-width="2"/>
<line x1="576.5" y1="288" x2="576.5" y2="329" stroke="#6B4FA0" stroke-width="1"/>
<text x="576.5" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle" font-weight="bold">World, 2025:</text>
<text x="576.5" y="363.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6B4FA0" text-anchor="middle" font-weight="normal">19 TW</text>
<circle cx="730.6" cy="280" r="6" fill="#EFE0B4" stroke="#A0781A" stroke-width="2"/>
<line x1="730.6" y1="272" x2="730.6" y2="133" stroke="#A0781A" stroke-width="1"/>
<text x="738.6" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#A0781A" text-anchor="end" font-weight="bold">Sunlight intercepted</text>
<text x="738.6" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#A0781A" text-anchor="end" font-weight="normal">by Earth: 174,000 TW</text>
<text x="20.0" y="465.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#444444" text-anchor="start" font-weight="normal">Sources: EIA (US, 2024); Energy Institute 2026 edition (world, 2025); solar irradiance 1,361 W/m² over Earth’s disk.</text>
</svg>